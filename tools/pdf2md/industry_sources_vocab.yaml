# industry_sources_vocab.yaml
#
# Obscuration vocabulary for the industry-practices corpus
# (domains/piping-design/_Sources/industry-practices/).
#
# Purpose: replace identifying source-organization names, issuer-specific
# document numbers, and issuer-fingerprinting site/project names in MD bodies
# with stable per-org IDs (`Industry Source NN`) so retrieval keys on topical
# content, not on house-style identity. The org -> ID mapping lives only in
# 00-MASTER-INDEX.csv / .xlsx (column: `Industry Source ID`).
#
# Schema:
#   version: int                       — vocab schema version
#   case_sensitive: bool               — alias/prefix matching is case-insensitive by default
#   sources:
#     - id: "Industry Source NN"       — stable per-org ID (zero-padded)
#       canonical_name: str            — exactly as in master-index `Source Organization`
#       aliases: [str, ...]            — whole-token textual variants to redact
#       document_number_prefixes: [str, ...]
#                                      — issuer-specific doc-number prefixes; replaced as
#                                        "<id> Doc <suffix>" so cross-citations stay traceable
#                                        as references without revealing the issuer
#       site_names: [str, ...]         — issuer-fingerprinting site/project/facility names
#                                        (replaced with "<id> Facility")
#   keep_verbatim: [str, ...]          — generic technical references not to redact (codes etc.)
#
# Sort order of IDs: lexicographic by canonical_name (frozen at master-index build time).
#
# Maintenance: aliases and document_number_prefixes are seeded from the master
# index; they grow as redacted-page leak-greps surface new variants. Adding an
# alias is a one-line edit; the redactor is idempotent so already-redacted
# pages re-run cleanly.


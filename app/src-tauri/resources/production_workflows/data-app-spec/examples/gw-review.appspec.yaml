exports:
  - id: review_export
    label: Download review workbook
    format: xlsx
    filename_pattern: "gw_review_{review_year}.xlsx"
    include_provenance: [app_version, spec_sha256, analysis_date, settings, data_vintage, component_versions]
    x-include_input_identities: [uploaded file names and sha256, guideline knowledge-pack id, version and edition]
    sheets:
      - {name: Well summary, content: [well_evidence]}
      - {name: Exceedances, content: [review_year_results]}
      - {name: Trends, content: [trend_results]}
      - {name: Issues, content: [issues_rows]}

provenance:
  display: [data_sources, data_vintage, methods, app_version, spec_identity, component_versions, acceptance_status, disclaimer]
  result_provenance: on_request
  data_currency_note: The data are the files uploaded in this session; the about panel shows their sampling period and upload time.

verification:
  known_answer_tests:
    - id: kat_mk_published
      subject: trend_component
      oracle: published_value
      source: ref_epa_ug_2009
      locator: "§17.3.2, Example 17-6, pp. 17-33 to 17-34 (23 sulfate values, ppm; dates yr.mon from 89.6 to 96.8)"
      inputs:
        - port: series
          values:
            - {group_well: example_17_6, group_parameter: sulfate, time: "1989-06-01", value: 480, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1989-08-01", value: 450, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1990-01-01", value: 490, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1990-03-01", value: 520, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1990-06-01", value: 485, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1990-08-01", value: 510, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1991-01-01", value: 510, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1991-03-01", value: 530, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1991-06-01", value: 510, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1991-08-01", value: 560, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1992-01-01", value: 560, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1992-06-01", value: 540, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1993-01-01", value: 590, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1993-06-01", value: 550, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1994-01-01", value: 600, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1994-06-01", value: 700, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1995-01-01", value: 570, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1995-06-01", value: 610, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1995-08-01", value: 650, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1996-01-01", value: 620, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1996-03-01", value: 830, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1996-06-01", value: 720, detected: true}
            - {group_well: example_17_6, group_parameter: sulfate, time: "1996-08-01", value: 590, detected: true}
      expected:
        - {output: trends.s, value: 194, comparison: exact}
        - {output: trends.var_s, value: 1428, tolerance: {absolute: 0.5}, comparison: approximate}
        - {output: trends.z, value: 5.11, tolerance: {absolute: 0.005}, comparison: approximate}
      confirmation: >-
        Published values reproduced by two independent recomputations (Unified Guidance
        Example 17-6). The day of each date is
        assumed to be the first of the month; S and its variance depend only on order
        and ties. The example has no non-detects, so it does not exercise
        g_trend_rule_open's non-detect rule. Run against the bound component once chosen.
  property_tests:
    - id: pt_mk_time_reversal
      subject: trend_component
      statement: Reversing the time order of a series changes the sign of S and of Sen's slope and leaves var(S) unchanged.
      basis:
        - {kind: derived, statement: "Follows from S being a sum of sign(x_j - x_i) over pairs j > i and the slope being a median of pairwise slopes."}
    - id: pt_mk_shift
      subject: trend_component
      statement: Adding a constant to every value leaves S, var(S), the p-value and Sen's slope unchanged.
      basis:
        - {kind: derived, statement: Pairwise differences are unchanged by a common shift.}
    - id: pt_exceedance_nondetect
      subject: results_flagged
      statement: No row with detect_flag not_detected has exceeds true.
  data_contract_checks:
    - id: dc_results
      subject: lab_results_upload
    - id: dc_registry
      subject: well_registry_upload
    - id: dc_guidelines
      subject: tier1_groundwater
  review_requirements:
    - {gate: domain_pack_acceptance, examiner: domain_expert, subject: tier1_groundwater, required: true}
    - {gate: independent_numerical_review, examiner: separate_agent, subject: trend_component, required: true}
    - {gate: domain_expert_review, examiner: domain_expert, subject: results_flagged, required: true}
    - {gate: domain_expert_review, examiner: accountable_professional, required: true}
    - {gate: spec_acceptance, examiner: owner, required: true}


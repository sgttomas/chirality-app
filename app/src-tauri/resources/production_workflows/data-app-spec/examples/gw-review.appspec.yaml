  - id: ref_epa_ug_2009
    kind: standard
    title: "Statistical Analysis of Groundwater Monitoring Data at RCRA Facilities: Unified Guidance (EPA 530/R-09-007)"
    publisher: US Environmental Protection Agency
    date: "2009"
    url: https://archive.epa.gov/epawaste/hazard/web/pdf/unified-guid.pdf
    status_note: §17.3.2 and Example 17-6 were read for this example.

gaps:
  - id: g_guideline_values
    statement: The guideline values, edition and keys are not yet in an accepted knowledge pack.
    affects: [tier1_groundwater]
    blocking: [build, acceptance]
    resolution_route: domain-knowledge-intake, then domain-pack acceptance.
    status: open
  - id: g_trend_component
    statement: The trend test implementation is not chosen, so its bundle and censored-data handling are unknown.
    affects: [trend_component]
    blocking: [build, verification]
    resolution_route: analysis-binding.
    status: open
  - id: g_trend_rule_open
    statement: The significance level, minimum record and non-detect rule are not adopted (design record gaps g_trend_rule, g_min_record, g_nondetect_trend).
    affects: [trend_analysis]
    blocking: [build]
    resolution_route: Rulings recorded in the design record.
    status: open
  - id: g_rules_not_adopted
    statement: No decision rules are adopted (design record gap g_decision_rules).
    affects: [well_screen]
    blocking: [build]
    resolution_route: Elicitation and a ruling recorded in the design record; or a ruling for the evidence-only option, which removes well_screen.
    status: open
  - id: g_templates
    statement: The upload templates have not been produced.
    affects: [asset_results_template, asset_registry_template]
    blocking: [build]
    status: open
  - id: g_basemap
    statement: The basemap provider and its terms are not chosen.
    affects: [site_map]
    blocking: [build]
    status: open


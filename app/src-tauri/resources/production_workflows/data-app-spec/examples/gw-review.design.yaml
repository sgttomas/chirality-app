gaps:
  - id: g_trend_rule
    statement: The significance level and the rule that turns a test result into increasing, decreasing or no trend are not adopted.
    affects: [ch_trend, k_trend_method]
    blocking: [build, acceptance]
    resolution_route: Ruling by the professional of record, informed by the method source.
    status: open
  - id: g_nondetects
    statement: >-
      How non-detects are compared with guidelines and treated in the trend test is not
      adopted. For comparisons the author proposes that a non-detect never exceeds, and
      that a detection limit above the guideline is shown as 'not assessable'.
    affects: [ch_exceedance, ch_trend, k_nondetects]
    blocking: [build, acceptance]
    resolution_route: >-
      Domain review, then a ruling by the professional of record. A candidate is the
      Unified Guidance's rule of a common value below all detects, which it calls "an
      imperfect remedy" (§17.3.2); a source informs the ruling but does not make it.
    status: open
  - id: g_missing_key_rule
    statement: >-
      What applies when a well's context key is missing is not established. The guideline
      document has not been read; one option is 'undefined = most conservative'. The
      author's draft blocks such wells with a message.
    affects: [ch_exceedance, k_guidelines]
    blocking: [build, acceptance]
    resolution_route: Read the guideline document; domain review; a ruling by the professional of record.
    status: open
  - id: g_guideline_edition
    statement: The guideline edition and site context the regulator requires are not confirmed, and the guideline document has not been read.
    affects: [o_guideline_edition, k_guidelines]
    blocking: [acceptance]
    resolution_route: Ask the regulator through the owner; domain-knowledge-intake records the edition.
    status: open
  - id: g_min_record
    statement: The minimum record length for a trend class is not adopted.
    affects: [ch_trend, k_min_record]
    blocking: [build]
    resolution_route: Expert judgment of the professional of record.
    status: open
  - id: g_decision_rules
    statement: No decision rules for sampling changes have been elicited or adopted.
    affects: [ch_screening, k_decision_rules]
    blocking: [build, acceptance]
    resolution_route: Elicitation from the professional of record through domain-knowledge-intake; otherwise rule the evidence-only option.
    status: open

rulings:
  - id: r_tier
    decision: Assign consequence tier T3_professional_reliance for regulatory reporting.
    status: proposed
    authority: owner
    scope: [tier]
  - id: r_design
    decision: Adopt the consequential design choices as proposed.
    status: proposed
    authority: owner
    scope: [ch_upload, ch_exceedance, ch_trend, ch_site_map, ch_screening, ch_export, ch_provenance]
  - id: r_professional_method
    decision: Adopt the method answers proposed for the criterion source, units, comparison, averaging, the trend test, seasonality, the reference line and the screening inputs.
    status: proposed
    authority: accountable_professional
    scope: [ch_exceedance.criterion_instrument, ch_exceedance.unit_consistency, ch_exceedance.comparison_rule, ch_exceedance.averaging_and_statistic, ch_trend.test_method, ch_trend.seasonality, ch_well_detail.reference_values, ch_screening.rule_inputs, ch_screening.insufficient_evidence]
  - id: r_decision_rules
    decision: Adopt the elicited decision rules for sampling changes, identified by the hash in k_decision_rules.adopted_content. Not to be made until the rules exist (g_decision_rules).
    status: proposed
    authority: accountable_professional
    scope: [d_sampling_plan, k_decision_rules]
  - id: r_delegate_presentation
    decision: Delegate presentation and routine choices to the author, under the stated conditions.
    status: proposed
    authority: owner
    scope: [del_presentation]

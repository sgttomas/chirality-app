    attributes:
      id:
        identifier: true
        range: Identifier
      subject:
        range: string
        required: true
        description: Component or analysis identifier under test.
      oracle:
        range: OracleKind
        required: true
      source:
        range: SourceReference
      locator:
        range: string
      inputs:
        range: TestInput
        multivalued: true
        inlined_as_list: true
      parameters:
        range: ParameterBinding
        multivalued: true
        inlined_as_list: true
      expected:
        range: ExpectedValue
        multivalued: true
        inlined_as_list: true
        required: true
      confirmation:
        range: string
        description: Outstanding confirmation before the test may be relied on.

  TestInput:
    annotations:
      level: verification
    attributes:
      port:
        range: string
        required: true
      values:
        range: Any
      asset:
        range: Asset
      node:
        range: DataNode

  ExpectedValue:
    annotations:
      level: verification
    attributes:
      output:
        range: string
        required: true
      value:
        range: Any
      tolerance:
        range: Tolerance
        inlined: true
      comparison:
        range: Comparison

  PropertyTest:
    mixins:
      - Claimable
    annotations:
      level: verification
    attributes:
      id:
        identifier: true
        range: Identifier
      subject:
        range: string
        required: true
      statement:
        range: string
        required: true
      check:
        range: Expression
      input_domain:
        range: string

  DataContractCheck:
    annotations:
      level: verification
    attributes:
      id:
        identifier: true
        range: Identifier
      subject:
        range: DataNode
        required: true
      rules:
        range: DataRule
        multivalued: true
        inlined_as_list: true

  ReviewRequirement:
    mixins:
      - Claimable
    annotations:
      level: verification
    attributes:
      gate:
        range: ReviewGate
        required: true
      examiner:
        range: Examiner
        required: true
      subject:
        range: string
      required:
        range: boolean

  # ---------- implementation bindings ----------
  BuildProfile:
    annotations:
      level: implementation
    attributes:
      target:
        range: BuildTarget
        required: true
      runtimes:
        range: RuntimePin
        multivalued: true
        inlined_as_list: true
      materialization:
        range: Materialization
        multivalued: true
        inlined_as_list: true
      access:
        range: Access
      hosting_region:
        range: string
      theme:
        range: Theme
        inlined: true

  RuntimePin:
    annotations:
      level: implementation
    attributes:
      name:
        range: string
        required: true
      version:
        range: string
      version_tbd:
        range: Gap
      lockfile:
        range: Asset

  Materialization:
    annotations:
      level: implementation
    attributes:
      analysis:
        range: Analysis
        required: true
      strategy:
        range: MaterializationStrategy
        required: true
      over_state:
        range: StateVariable
        multivalued: true

  Theme:
    annotations:
      level: implementation
    attributes:
      framework_theme:
        range: string
      primary_color:
        range: string
      font:
        range: string

# Interactive data application family ontology (0.1.0)
#
# The namespace below is a placeholder.
#
# This LinkML file is the formal source of the ontology. The JSON Schema
# app-spec.schema.json is generated from it by ../tools/project_schema.py. ONTOLOGY.md explains the classes, relations and their
# relationship to the Chirality thesis; PROJECTION.md states the projection rules
# and what the JSON Schema cannot express.
#
# Class annotation `level` marks the thesis distinction (Chapter 3 §3.2.1):
#   domain          - what the application is about (work or domain entities and knowledge)
#   representation  - what the application is (the specified data flow, views, controls)
#   implementation  - implementation conveniences that must not acquire authority over meaning
#   epistemic       - grounds, gaps, conflicts and rulings (Chapter 3 §3.2.2)
#   verification    - checks and their oracles

id: https://chirality.ai/ns/app-family
name: app_family
title: Interactive data application family ontology
description: >-
  Classes, relations and constraints for specifying interactive data applications
  of this family (environmental monitoring explorers,
  spatial time-series maps, public-health dashboards, quality control charts,
  inspection and risk tools, decision support and simulators). A specification
  written against this ontology is a representation of an intended application;
  it does not establish that the application is adequate for its intended use.
version: 0.1.0-draft
prefixes:
  linkml: https://w3id.org/linkml/
  appf: https://chirality.ai/ns/app-family/
  prov: http://www.w3.org/ns/prov#
  sosa: http://www.w3.org/ns/sosa/
  qudt: http://qudt.org/schema/qudt/
  dcat: http://www.w3.org/ns/dcat#
  dcterms: http://purl.org/dc/terms/
  csvw: http://www.w3.org/ns/csvw#
  schema: http://schema.org/
default_prefix: appf
default_range: string
imports:
  - linkml:types

# --------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------
types:
  Identifier:
    typeof: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: Local identifier, unique across all elements of one specification.
  ElementPath:
    typeof: string
    pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)*$"
    description: An element identifier optionally followed by a dotted slot path, e.g. map_so2.color_scale.
  Expression:
    typeof: string
    description: >-
      Expression in the appspec expression language. State
      variables are written $id; metrics and result fields by identifier.
  UcumCode:
    typeof: string
    description: Unit in UCUM case-sensitive syntax, e.g. mg/L, [ppb], km2, %, a, 1.
  Sha256:
    typeof: string
    pattern: "^[a-f0-9]{64}$"
  IsoDuration:
    typeof: string
    pattern: "^P(\\d+Y)?(\\d+M)?(\\d+W)?(\\d+D)?(T(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?$"
    description: ISO 8601 duration with calendar semantics, e.g. P1M is one calendar month.

# --------------------------------------------------------------------------
# Enumerations
# --------------------------------------------------------------------------
enums:
  Standing:
    description: Thesis epistemic labels (Chapter 3 §3.2.2); useful where a consumer needs them, not exhaustive.
    permissible_values:
      FACT: {description: Based on direct observation or an accurately cited source within its scope.}
      ASSUMPTION: {description: A provisional basis for reasoning; remains distinct from observation even when adopted.}
      PROPOSAL: {description: A candidate interpretation or design choice not yet adopted.}
      TBD: {description: Missing information; never replaced by an invented value.}
  WarrantKind:
    permissible_values:
      observed: {description: Seen in an identified artifact (deployed app HTML, source code at a revision, data file).}
      documented: {description: Stated by an identified source (paper, standard, manual, package documentation).}
      inferred: {description: Reasoned from evidence; not independently established.}
      derived: {description: Calculated from identified inputs by an identified method.}
      expert_judgment: {description: Attributable judgment of an identified domain expert.}
      owner_direction: {description: The owner's identified words.}
      ruling: {description: An attributable decision by the relevant authority.}
  ConsequenceTier:
    description: Proportionate-review tiers, keyed to intended reliance, not app type.
    permissible_values:
      T0_illustrative: {description: Teaching or demonstration; no reliance beyond illustration.}
      T1_exploratory: {description: Public or analyst exploration; explicit non-use for compliance or decisions.}
      T2_decision_support: {description: Results inform consequential decisions by identified decision makers.}
      T3_professional_reliance: {description: Results relied on in regulated or professional work (compliance, inspection, public-health reporting).}
  Archetype:
    description: Composable application patterns found in a survey of public data apps.
    permissible_values:
      explorer: {description: One curated dataset; filters drive linked views.}
      indicator_surveillance: {description: Indicators by geography and time with comparators and release vintages.}
      spatiotemporal_map: {description: Map as primary view and input; layers, time stepping, interpolated surfaces.}
      live_monitoring: {description: Status of a changing source against thresholds with freshness.}
      qc_compliance: {description: Measurements against limits or criteria; rules; exceedance.}
      calculator: {description: Typed inputs to a deterministic function; little or no dataset.}
      model_simulator: {description: Parameterised model run; optional scenario comparison.}
      decision_support: {description: Alternatives against objectives; consequence tables; trade-offs.}
      analysis_workbench: {description: User-supplied or fetched data through a staged pipeline.}
      teaching_demo: {description: Concept illustration, often seeded and narrative.}
  ArchetypeRole:
    permissible_values:
      primary: {}
      secondary: {}
  MethodFamily:

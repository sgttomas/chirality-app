# --------------------------------------------------------------------------
# Classes
# --------------------------------------------------------------------------
classes:

  Any:
    class_uri: linkml:Any
    description: Any JSON value.

  # ---------- mixins ----------
  Claimable:
    mixin: true
    description: Grounds and scoped standing of a specified element (thesis Chapter 3 §3.2.2).
    annotations:
      level: epistemic
    attributes:
      basis:
        range: Warrant
        multivalued: true
        inlined_as_list: true
        description: Grounds for the element - sources, observations, derivations or rulings.
      standing:
        range: Standing
        description: Scoped label where useful. A label is not its supporting evidence.
      adopted_by:
        range: Ruling
        description: Ruling that adopted this element under uncertainty, if any.

  # ---------- root ----------
  AppSpec:
    tree_root: true
    description: >-
      Declarative specification of one interactive data application. It is a
      proposal until an external, content-addressed acceptance record identifies it;
      it never records its own acceptance.
    close_mappings:
      - prov:Plan
    annotations:
      level: representation
    attributes:
      appspec_version:
        range: string
        required: true
        pattern: "^0\\.1$"
        description: Specification format version this document conforms to.
      ontology_version:
        range: string
        description: Ontology release the specification was written against.
      app:
        range: AppIdentity
        required: true
        inlined: true
      purpose:
        range: Purpose
        required: true
        inlined: true
      consequence:
        range: ConsequenceAssessment
        inlined: true
      domain:
        range: DomainModel
        inlined: true
      data_sources:
        range: DataSource
        multivalued: true
        inlined_as_list: true
      transforms:
        range: Transform
        multivalued: true
        inlined_as_list: true
      components:
        range: AnalysisComponent
        multivalued: true
        inlined_as_list: true
        description: Registry entries (interfaces and pinned implementations) the analyses bind to.
      analyses:
        range: Analysis
        multivalued: true
        inlined_as_list: true
      metrics:
        range: Metric
        multivalued: true
        inlined_as_list: true
      levers:
        range: Lever
        multivalued: true
        inlined_as_list: true
      scenarios:
        range: Scenario
        multivalued: true
        inlined_as_list: true
      objectives:
        range: Objective
        multivalued: true
        inlined_as_list: true
      state:
        range: StateVariable
        multivalued: true
        inlined_as_list: true
      controls:
        range: Control
        multivalued: true
        inlined_as_list: true
      interactions:
        range: Interaction
        multivalued: true
        inlined_as_list: true
      views:
        range: View
        multivalued: true
        inlined_as_list: true
      color_scales:
        range: ColorScale
        multivalued: true
        inlined_as_list: true
      layout:
        range: Layout
        inlined: true
      content:
        range: TextBlock
        multivalued: true
        inlined_as_list: true
      assets:
        range: Asset
        multivalued: true
        inlined_as_list: true
      messages:
        range: Message
        multivalued: true
        inlined_as_list: true
      exports:
        range: Export
        multivalued: true
        inlined_as_list: true
      references:
        range: SourceReference
        multivalued: true
        inlined_as_list: true
      provenance:
        range: ProvenancePolicy
        inlined: true
      verification:
        range: VerificationPlan
        inlined: true
      gaps:
        range: Gap
        multivalued: true
        inlined_as_list: true
      conflicts:
        range: Conflict
        multivalued: true
        inlined_as_list: true
      rulings:
        range: Ruling
        multivalued: true
        inlined_as_list: true
      fidelity_decisions:
        range: FidelityDecision
        multivalued: true
        inlined_as_list: true
      build_profile:
        range: BuildProfile
        inlined: true
        description: Implementation bindings. Must not change the meaning of any semantic element.

  # ---------- identity, purpose, consequence ----------
  AppIdentity:
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      title:
        range: string
        required: true
      display_title:
        range: string
      short_description:
        range: string
      app_version:
        range: string
      sector:
        range: string
      keywords:
        range: string
        multivalued: true
      owner:
        range: string
        description: Accountable owner (person or role) of the application's purpose and acceptance.
      spec_licence:
        range: string
      lineage:
        range: LineageLink
        multivalued: true
        inlined_as_list: true

  LineageLink:
    mixins:
      - Claimable
    annotations:
      level: epistemic
    attributes:
      relation:
        range: LineageRelation
        required: true
      target_title:
        range: string
      target_url:
        range: uri
      source_repository:
        range: uri
      source_revision:
        range: string
      observed_at:
        range: date
      notes:
        range: string

  Purpose:
    annotations:
      level: domain
    attributes:
      intended_use:
        range: string
        required: true
      questions:
        range: Question
        multivalued: true
        inlined_as_list: true
      decisions_supported:
        range: string
        multivalued: true
      intended_users:
        range: UserRole
        multivalued: true
        inlined_as_list: true
      non_uses:
        range: string
        multivalued: true
        description: Uses the application must not be relied on for.
      archetypes:
        range: ArchetypeUse
        multivalued: true
        inlined_as_list: true

  Question:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      text:
        range: string
        required: true
      answered_by:
        range: View
        multivalued: true

  UserRole:
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      name:
        range: string
        required: true
      description:
        range: string

  ArchetypeUse:
    annotations:
      level: representation
    attributes:
      archetype:
        range: Archetype
        required: true
      role:
        range: ArchetypeRole

  ConsequenceAssessment:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      tier:
        range: ConsequenceTier
        required: true
      rationale:
        range: string
      error_consequences:
        range: string
        multivalued: true
      detectability:
        range: string
        description: How readily a wrong result would be noticed by the intended users.
      affected_parties:
        range: string
        multivalued: true
      accountable_role:
        range: string
      ruling:
        range: Ruling

  # ---------- domain ----------
  DomainModel:
    annotations:
      level: domain
    attributes:
      entity_types:
        range: EntityType
        multivalued: true
        inlined_as_list: true
      observable_properties:
        range: ObservableProperty
        multivalued: true
        inlined_as_list: true
      criteria:
        range: Criterion
        multivalued: true
        inlined_as_list: true
      classification_schemes:
        range: ClassificationScheme
        multivalued: true
        inlined_as_list: true
      methods:
        range: Method
        multivalued: true
        inlined_as_list: true
      assumptions:
        range: Assumption
        multivalued: true
        inlined_as_list: true
      parameter_tables:
        range: ParameterTable
        multivalued: true
        inlined_as_list: true
      definitions:
        range: Definition
        multivalued: true
        inlined_as_list: true
      caveats:
        range: Caveat
        multivalued: true
        inlined_as_list: true
      knowledge_packs:
        range: KnowledgePackRef
        multivalued: true
        inlined_as_list: true

  EntityType:
    mixins:
      - Claimable
    close_mappings:
      - sosa:FeatureOfInterest
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
        required: true
      description:
        range: string
      geometry:
        range: GeometryKind
      crs:
        range: string
        description: Coordinate reference system of entity geometry, e.g. EPSG:4326.
      instances_from:
        range: DataNode
        description: Data node that enumerates the instances (e.g. a station registry).

  ObservableProperty:
    mixins:
      - Claimable
    exact_mappings:
      - sosa:ObservableProperty
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
        required: true
      symbol:
        range: string
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      value_semantics:
        range: ValueSemantics
      definition:
        range: string

  Quantity:
    annotations:
      level: domain
    attributes:
      value:
        range: double
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      tbd:
        range: Gap
        description: The value is missing; the referenced gap states why and with what consequence.

  CurrencyUnit:
    annotations:
      level: domain
    attributes:
      currency:
        range: string
        required: true
        pattern: "^[A-Z]{3}$"
        description: ISO 4217 code.
      price_year:
        range: integer
      scale:
        range: double
        description: Multiplier, e.g. 1000 for thousands.

  Criterion:
    mixins:
      - Claimable
    description: >-
      An issued or required value against which observations are compared. A
      statistically estimated control limit is a Result, not a Criterion.
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
        required: true
      criterion_type:
        range: CriterionType
        required: true
      observable:
        range: ObservableProperty
      bound:
        range: Bound
        required: true
      value:
        range: Quantity
        inlined: true
      lower:
        range: Quantity
        inlined: true
      upper:
        range: Quantity
        inlined: true
      averaging_period:
        range: IsoDuration
      statistic:
        range: AggregationStatistic
      jurisdiction:
        range: string
      instrument:
        range: SourceReference
        description: Issuing document.
      edition:
        range: string
      effective_date:
        range: date
      applicability:
        range: string

  ClassificationScheme:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
      applies_to:
        range: string
      classes:
        range: ClassBin
        multivalued: true
        inlined_as_list: true

  ClassBin:
    annotations:
      level: domain
    attributes:
      label:
        range: string
        required: true
      lower:
        range: double
      upper:
        range: double
      lower_inclusive:
        range: boolean
      upper_inclusive:
        range: boolean
      color:
        range: string

  Method:
    mixins:
      - Claimable
    description: >-
      A domain-level method or idealization (e.g. Shewhart individuals chart,
      ordinary kriging). Verification that a component computes it correctly does
      not establish its applicability (thesis worked example).
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      name:
        range: string
        required: true
      family:
        range: MethodFamily
      description:
        range: string
      assumptions:
        range: Assumption
        multivalued: true
      applicability:
        range: string
        multivalued: true
      limitations:
        range: string
        multivalued: true
      references:
        range: SourceReference
        multivalued: true

  Assumption:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      statement:
        range: string
        required: true
      applies_to:
        range: ElementPath
        multivalued: true
      consequence_if_violated:
        range: string
      disclosed_in:
        range: TextBlock

  ParameterTable:
    mixins:
      - Claimable
    description: Keyed table of domain parameter values with per-row grounds (e.g. demographic presets by action and subpopulation).
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      title:
        range: string
      keys:
        range: string
        multivalued: true
      columns:
        range: Field
        multivalued: true
        inlined_as_list: true
      rows:
        range: Any
        multivalued: true
        description: Records as mappings of column name to value.
      dataset:
        range: DataNode
      row_basis:
        range: RowWarrant
        multivalued: true
        inlined_as_list: true

  RowWarrant:
    annotations:
      level: epistemic
    attributes:
      match:
        range: Any
        required: true
        description: Mapping of key column to value identifying the rows.
      basis:
        range: Warrant
        multivalued: true
        inlined_as_list: true

  Definition:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      term:
        range: string
        required: true
      definition:
        range: string
        required: true
      symbol:
        range: string
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit

  Caveat:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      statement:
        range: string
        required: true
      applies_to:
        range: ElementPath
        multivalued: true
      display:
        range: TextBlock

  KnowledgePackRef:
    description: Reference to an accepted, versioned domain knowledge pack (workflow domain-knowledge-intake).
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      version:
        range: string
        required: true
      sha256:
        range: Sha256
      location:
        range: string
      items_used:
        range: string
        multivalued: true

  # ---------- data ----------
  DataNode:
    abstract: true
    mixins:
      - Claimable
    description: Anything that yields a dataset or result other nodes can consume.
    close_mappings:
      - prov:Entity
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      title:
        range: string
      description:
        range: string
      schema:
        range: TableSchema
        inlined: true

  DataSource:
    abstract: true
    is_a: DataNode
    close_mappings:
      - dcat:Dataset
    attributes:
      kind:
        designates_type: true
        range: string
        required: true
      provider:
        range: string
      licence:
        range: string
      citation:
        range: SourceReference
      vintage:
        range: Vintage
        inlined: true

  BundledDataset:
    is_a: DataSource
    description: A snapshot shipped with the application and identified by content hash.
    attributes:
      asset:
        range: Asset
        required: true
      format:
        range: DataFormat
        required: true
      parse:
        range: ParseOptions
        inlined: true
      row_count:
        range: integer

  DataProductSource:
    is_a: DataSource
    description: A versioned data product produced upstream of the application (not by the builder).
    attributes:
      product_id:
        range: string
        required: true
      product_version:
        range: string
        required: true
      location_template:
        range: string
      partition_keys:
        range: string
        multivalued: true
      manifest_sha256:
        range: Sha256
      refresh:
        range: RefreshPolicy
        inlined: true

  UploadSource:
    is_a: DataSource
    description: Data the user supplies at run time, governed by a declared contract.
    attributes:
      formats:
        range: DataFormat
        multivalued: true
        required: true
      max_size_mb:
        range: double
      parse:
        range: ParseOptions
        inlined: true
      sheets:
        range: SheetContract
        multivalued: true
        inlined_as_list: true
      rules:
        range: DataRule
        multivalued: true
        inlined_as_list: true
      example:
        range: DataSource
      template:
        range: Asset
      control:
        range: Control

  ExternalServiceSource:
    is_a: DataSource
    attributes:
      endpoint:
        range: string
        required: true
      request_parameters:
        range: Any
      auth_secret:
        range: string
        description: Name of a secret supplied by the deployment; never the secret itself.
      refresh:
        range: RefreshPolicy
        inlined: true
      on_failure:
        range: ServiceFailure
      terms:
        range: string

  GeneratedSource:
    is_a: DataSource
    attributes:
      component:
        range: AnalysisComponent
        required: true
      seed:
        range: integer
      seed_from:
        range: StateVariable

  Vintage:
    annotations:
      level: epistemic
    attributes:
      retrieved_at:
        range: date
      period_start:
        range: string
      period_end:
        range: string
      quality_level:
        range: string
      extraction:
        range: string

  ParseOptions:
    annotations:
      level: representation
    attributes:
      delimiter:
        range: string
      header:
        range: boolean
      decimal:
        range: string
      encoding:
        range: string
      na_values:
        range: string
        multivalued: true
      quote:
        range: string

  SheetContract:
    annotations:
      level: representation
    attributes:
      name:
        range: string
        required: true
      required:
        range: boolean
      schema:
        range: TableSchema
        inlined: true

  DataRule:
    annotations:
      level: verification
    attributes:
      id:
        identifier: true
        range: Identifier
      rule:
        range: Expression
        required: true
      message:
        range: Message
      severity:
        range: Severity

  RefreshPolicy:
    annotations:
      level: representation
    attributes:
      mode:
        range: RefreshMode
        required: true
      interval:
        range: IsoDuration
      stale_after:
        range: IsoDuration
      show_freshness:
        range: boolean

  TableSchema:
    close_mappings:
      - csvw:Schema
    annotations:
      level: representation
    attributes:
      fields:
        range: Field
        multivalued: true
        inlined_as_list: true
      primary_key:
        range: string
        multivalued: true
      foreign_keys:
        range: ForeignKey
        multivalued: true
        inlined_as_list: true
      missing_values:
        range: string
        multivalued: true
      crs:
        range: string

  Field:
    mixins:
      - Claimable
    close_mappings:
      - csvw:Column
    annotations:
      level: representation
    attributes:
      name:
        range: string
        required: true
      title:
        range: string
      type:
        range: FieldType
      format:
        range: string
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      observable:
        range: ObservableProperty
      role:
        range: FieldRole
      semantics:
        range: ValueSemantics
      constraints:
        range: FieldConstraints
        inlined: true
      aggregation:
        range: AggregationBasis
        inlined: true
      description:
        range: string

  FieldConstraints:
    annotations:
      level: representation
    attributes:
      required:
        range: boolean
      unique:
        range: boolean
      minimum:
        range: double
      maximum:
        range: double
      enum:
        range: Any
        multivalued: true
      pattern:
        range: string

  AggregationBasis:
    annotations:
      level: representation
    attributes:
      statistic:
        range: AggregationStatistic
        required: true
      period:
        range: IsoDuration
      from_resolution:
        range: IsoDuration

  ForeignKey:
    annotations:
      level: representation
    attributes:
      fields:
        range: string
        multivalued: true
        required: true
      reference_node:
        range: DataNode
        required: true
      reference_fields:
        range: string
        multivalued: true

  # ---------- transforms ----------
  Transform:
    abstract: true
    is_a: DataNode
    description: Deterministic data operation from a closed vocabulary; ComponentTransform is the registered escape hatch.
    attributes:
      kind:
        designates_type: true
        range: string
        required: true
      inputs:
        range: DataNode
        multivalued: true

  SelectSourceTransform:
    is_a: Transform
    description: Chooses among sources by ordered conditions (e.g. upload takes precedence over example data).
    attributes:
      cases:
        range: SourceCase
        multivalued: true
        inlined_as_list: true
        required: true
      otherwise_empty:
        range: boolean

  SourceCase:
    annotations:
      level: representation
    attributes:
      when:
        range: Expression
        required: true
      source:
        range: DataNode
        required: true

  SelectFieldsTransform:
    is_a: Transform
    attributes:
      mappings:
        range: FieldMapping
        multivalued: true
        inlined_as_list: true
        required: true
      keep_others:
        range: boolean

  FieldMapping:
    annotations:
      level: representation
    attributes:
      target:
        range: string
        required: true
      source_field:
        range: string
      source_field_from:
        range: StateVariable
        description: The source field name is the value of this state variable (user column-role mapping).
      expression:
        range: Expression

  ParseTransform:
    is_a: Transform
    attributes:
      field:
        range: string
        required: true
      to_type:
        range: FieldType
        required: true
      format:
        range: string
      timezone:
        range: string
      on_error:
        range: ParseOnError

  FilterTransform:
    is_a: Transform
    attributes:
      condition:
        range: Expression
        required: true

  SortTransform:
    is_a: Transform
    attributes:
      by:
        range: SortKey
        multivalued: true
        inlined_as_list: true
        required: true

  SortKey:
    annotations:
      level: representation
    attributes:
      field:
        range: string
        required: true
      order:
        range: SortOrder
      nulls:
        range: NullsOrder

  DropMissingTransform:
    is_a: Transform
    attributes:
      fields:
        range: string
        multivalued: true
        required: true

  SplitHeadTransform:
    is_a: Transform
    description: Labels the first n rows (in current order) and the remainder, e.g. calibration and monitoring phases.
    attributes:
      n:
        range: integer
      n_expression:
        range: Expression
      label_field:
        range: string
        required: true
      head_label:
        range: string
        required: true
      tail_label:
        range: string
        required: true

  TemporalAggregateTransform:
    is_a: Transform
    attributes:
      time_field:
        range: string
        required: true
      period:
        range: IsoDuration
        required: true
      group_by:
        range: string
        multivalued: true
      statistics:
        range: FieldStatistic
        multivalued: true
        inlined_as_list: true
        required: true
      completeness_min:
        range: double
        description: Minimum fraction of expected sub-period values required; otherwise the aggregate is missing.
      completeness_tbd:
        range: Gap

  FieldStatistic:
    annotations:
      level: representation
    attributes:
      field:
        range: string
        required: true
      statistic:
        range: AggregationStatistic
        required: true
      output_field:
        range: string
      percentile:
        range: double

  GapFillTransform:
    is_a: Transform
    attributes:
      fields:
        range: string
        multivalued: true
        required: true
      method:
        range: GapFillMethod
      method_tbd:
        range: Gap
      max_gap:
        range: IsoDuration

  JoinTransform:
    is_a: Transform
    attributes:
      right:
        range: DataNode
        required: true
      keys:
        range: string
        multivalued: true
        required: true
      how:
        range: JoinHow

  DeriveTransform:
    is_a: Transform
    attributes:
      derivations:
        range: Derivation
        multivalued: true
        inlined_as_list: true
        required: true

  Derivation:
    annotations:
      level: representation
    attributes:
      field:
        range: string
        required: true
      expression:
        range: Expression
        required: true
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit

  ReprojectTransform:
    is_a: Transform
    attributes:
      from_crs:
        range: string
      to_crs:
        range: string
      crs_tbd:
        range: Gap
      x_field:
        range: string
      y_field:
        range: string

  ComponentTransform:
    is_a: Transform
    attributes:
      component:
        range: AnalysisComponent
        required: true
      parameters:
        range: ParameterBinding
        multivalued: true
        inlined_as_list: true

  # ---------- analysis components and analyses ----------
  AnalysisComponent:
    mixins:
      - Claimable
    description: >-
      Registry entry for a versioned implementation with a typed interface. The
      escape hatch that keeps the builder reading only the specification closure.
    close_mappings:
      - schema:SoftwareSourceCode
    related_mappings:
      - prov:SoftwareAgent
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      version:
        range: string
        required: true
      title:
        range: string
      implements:
        range: Method
      implementation:
        range: Implementation
        inlined: true
        required: true
      inputs:
        range: Port
        multivalued: true
        inlined_as_list: true
      parameters:
        range: ParameterSpec
        multivalued: true
        inlined_as_list: true
      outputs:
        range: Port
        multivalued: true
        inlined_as_list: true
      determinism:
        range: Determinism
        required: true
      tolerance:
        range: Tolerance
        inlined: true
      preconditions:
        range: Precondition
        multivalued: true
        inlined_as_list: true
      known_answer_tests:
        range: KnownAnswerTest
        multivalued: true
      known_limitations:
        range: string
        multivalued: true

  Implementation:
    annotations:
      level: implementation
    attributes:
      language:
        range: LanguageKind
        required: true
      runtime_version:
        range: string
      package:
        range: string
      package_version:
        range: string
      entry_point:
        range: string
      source_repository:
        range: uri
      source_revision:
        range: string
      licence:
        range: string
      bundle_sha256:
        range: Sha256
      bundle_tbd:
        range: Gap

  Port:
    annotations:
      level: representation
    attributes:
      name:
        range: string
        required: true
      kind:
        range: PortKind
        required: true
      value_type:
        range: ValueType
      schema:
        range: TableSchema
        inlined: true
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      required:
        range: boolean
      description:
        range: string

  ParameterSpec:
    annotations:
      level: representation
    attributes:
      name:
        range: string
        required: true
      value_type:
        range: ValueType
        required: true
      default:
        range: Any
      domain:
        range: Domain
        inlined: true
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      required:
        range: boolean
      description:
        range: string

  Tolerance:
    annotations:
      level: verification
    attributes:
      absolute:
        range: double
      relative:
        range: double

  Precondition:
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      condition:
        range: Expression
        required: true
      message:
        range: Message
      on_fail:
        range: PreconditionFailure

  Analysis:
    mixins:
      - Claimable
    description: Use of a component in this application, with bound inputs, parameter values and grounds.
    related_mappings:
      - prov:Activity
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      title:
        range: string
      component:
        range: AnalysisComponent
        required: true
      method:
        range: Method
      inputs:
        range: PortBinding
        multivalued: true
        inlined_as_list: true
      parameters:
        range: ParameterBinding
        multivalued: true
        inlined_as_list: true
      outputs:
        range: Result
        multivalued: true
        inlined_as_list: true
      preconditions:
        range: Precondition
        multivalued: true
        inlined_as_list: true
      recompute:
        range: Recompute
        inlined: true
      result_semantics:
        range: string
        multivalued: true
        description: Explicit statements of result meaning not visible in the interface (e.g. limits frozen from phase I).

  PortBinding:
    annotations:
      level: representation
    attributes:
      port:
        range: string
        required: true
      node:
        range: DataNode
      state:
        range: StateVariable
      field_map:
        range: FieldMapping
        multivalued: true
        inlined_as_list: true

  ParameterBinding:
    mixins:
      - Claimable
    description: Exactly one of value, expression, from_state or tbd (semantic rule R-PB1).
    annotations:
      level: representation
    attributes:
      name:
        range: string
        required: true
      value:
        range: Any
      expression:
        range: Expression
      from_state:
        range: StateVariable
      tbd:
        range: Gap
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      note:
        range: string

  Recompute:
    annotations:
      level: representation
    attributes:
      mode:
        range: RecomputeMode
        required: true
      trigger:
        range: Control

  Result:
    is_a: DataNode
    description: A named output of an analysis.
    attributes:
      port:
        range: string
        required: true
      result_type:
        range: ResultType
        required: true
      raster:
        range: RasterSpec
        inlined: true

  RasterSpec:
    annotations:
      level: representation
    attributes:
      crs:
        range: string
      resolution:
        range: Quantity
        inlined: true
      extent:
        range: string
      mask:
        range: string
      value_unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit

  Metric:
    mixins:
      - Claimable
    description: A defined quantity reported to users, with its formula, rounding and missing-value policy.
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
        required: true
      symbol:
        range: string
      unit:
        any_of:
          - range: UcumCode
          - range: CurrencyUnit
      expression:
        range: Expression
      from_node:
        range: DataNode
      from_field:
        range: string
      rounding:
        range: Rounding
        inlined: true
      clamp_min:
        range: double
      clamp_max:
        range: double
      missing_when:
        range: Expression
      missing_display:
        range: string
      format:
        range: string
      description:
        range: string

  Rounding:
    annotations:
      level: representation
    attributes:
      mode:
        range: RoundingMode
        required: true
      digits:
        range: integer

  Lever:
    mixins:
      - Claimable
    description: A decision variable or management action the application lets users vary.
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
        required: true
      description:
        range: string
      mechanism:
        range: string
      parameters:
        range: StateVariable
        multivalued: true
      analyses:
        range: Analysis
        multivalued: true
      cost_metrics:
        range: Metric
        multivalued: true

  Scenario:
    mixins:
      - Claimable
    annotations:
      level: representation
    attributes:
      id:
        identifier: true
        range: Identifier
      label:
        range: string
        required: true
      role:
        range: ScenarioRole
        required: true
      description:
        range: string
      overrides:
        range: ParameterBinding
        multivalued: true
        inlined_as_list: true
      applies_to:
        range: Analysis
        multivalued: true
      derived_from:
        range: Scenario
      levers:
        range: Lever
        multivalued: true

  Objective:
    mixins:
      - Claimable
    annotations:
      level: domain
    attributes:
      id:
        identifier: true
        range: Identifier
      statement:
        range: string
        required: true
      direction:
        range: Direction

[package]
name = "chirality-app-v4"
version = "0.0.0-skeleton"
description = "Chirality App v4 walking skeleton (APP-V4-GRAPH-CLOSURE-20261004)"
edition = "2021"
publish = false

[lib]
name = "chirality_app_v4_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulldown-cmark = { version = "=0.13.4", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
uuid = "=1.23.1"
getrandom = "=0.4.2"
jsonschema = { version = "=0.58.5", default-features = false }

# Hashing the 240 MB supplier binary (HOSTING §7.2) is slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3

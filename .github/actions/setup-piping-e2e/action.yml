name: Setup Piping E2E
description: Pinned source-mode desktop browser dependencies
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: projects/chirality-piping/package-lock.json

    - name: Setup pinned Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        targets: wasm32-unknown-unknown

    - name: Cache pinned wasm-bindgen CLI
      id: wasm-bindgen-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: ${{ runner.os }}-wasm-bindgen-cli-0.2.123

    - name: Install pinned wasm-bindgen CLI
      if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.123 --locked

    - name: Cache Cargo registry and WASM target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/
          projects/chirality-piping/core/model_operations/operation_applier/target
        key: ${{ runner.os }}-rust-1.97.1-${{ hashFiles('projects/chirality-piping/core/model_operations/operation_applier/Cargo.lock', 'projects/chirality-piping/core/loads/self_weight_wasm/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-rust-1.97.1-

    - name: Install project dependencies
      shell: bash
      run: npm ci
      working-directory: projects/chirality-piping

    # The desktop build is deliberately offline. Populate the complete
    # locked graphs, including host/transitive dependencies, before building.
    - name: Fetch complete locked WASM dependency graphs
      shell: bash
      run: |
        cargo fetch --locked --manifest-path core/model_operations/operation_applier/Cargo.toml
        cargo fetch --locked --manifest-path core/loads/self_weight_wasm/Cargo.toml
      working-directory: projects/chirality-piping

    - name: Build desktop WASM engine
      shell: bash
      run: npm run build:wasm:desktop
      working-directory: projects/chirality-piping

    - name: Resolve pinned Playwright version
      id: playwright-version
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
        test -n "${version}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
      working-directory: projects/chirality-piping

    - name: Cache Playwright Chromium
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Configure canonical Ubuntu package sources
      shell: bash
      run: |
        set -euo pipefail
        source /etc/os-release
        test -n "${VERSION_CODENAME}"
        test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
        sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
        Types: deb
        URIs: https://archive.ubuntu.com/ubuntu/
        Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
        Components: main restricted universe multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: https://security.ubuntu.com/ubuntu/
        Suites: ${VERSION_CODENAME}-security
        Components: main restricted universe multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF

    - name: Install Chromium system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
      working-directory: projects/chirality-piping

    - name: Install Chromium and system dependencies
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
      working-directory: projects/chirality-piping

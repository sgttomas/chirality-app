name: App v4

on:
  workflow_call:
    inputs:
      full_suite:
        description: Run the full product route, as a manual dispatch does (nightly caller).
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TEST_THREADS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CHIRALITY_CODEX_EXPECTED_SHA256: 030316ecfbb41f4e7946e584b0063ef333b7a36cd312ba349f2f6869e39b62cc

defaults:
  run:
    working-directory: app

concurrency:
  group: app-v4-${{ github.event.pull_request.number || github.ref }}
  # Only the newest PR candidate needs verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# Each macOS job restores third-party Rust build output in its setup and saves it
# last; repository crates are never cached (tools/ci/rust_dep_cache.py).
# Pull requests split the focused checks across parallel macOS jobs. Every
# focused lib cohort filter appears in exactly one shard and still runs as its
# own serial libtest process. A new focused cohort joins the shard with the
# shorter recorded runtime. Manual dispatch and the nightly caller's full_suite
# input take the full route instead.
jobs:
  rust-integration:
    name: Rust compile, integration and lib shard A
    if: github.event_name != 'workflow_dispatch' && !inputs.full_suite
    # Match the tested arm64 environment and system Git no-lazy-fetch contract.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LIB_COHORTS: >-
          role_supply child_roles::tests native_child_guidance::tests
          startup_request_tests desktop_setup_confirmation p3_role_set_tests
          p2_production_catalog_tests recovery_reads::tests observer_journal
          observation_custody_tests checkpoint_recorder checkpoint_lapse
          checkpoint_custody trial_reads_route_to_the_home_holding_the_trial_conversation
          model_turn ordinary_model model_rerouted execution_custody_tests records::durability_tests
          record_relations records_index u_store_2 recovery::store::tests stop_records
          a15_single_entry a15_native::tests
          act_control::a15::tests::native_presentation_failure_
          act_control::a15::tests::native_adapter_three_buttons_only_the_middle_captures
          file_act role_observations host_tick after_end_file_lapse
          role_r3 home_qualified_hot_run process_group_custody access_provider
          runtime_session::workflow_root_tests::supply_dispatch_tests
          runtime_session::workflow_root_tests::trial_restart_source_tests
          hosting::reading_gate_tests native_local_provider::
          hosting::access_settings::tests native_secure_entry::tests
          tc2_mode_turn_carries_the_end_notice_with_its_collaboration_mode
          v10_r1_notice_accepted_but_never_written_stays_pending
          handoff_notice_sources_survive_native_error_and_observation_loss
          hosting::conversation_transport_tests::attachment_outcome_tests
          hosting::conversation_transport_tests::attachment_host_final_reread_
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
      - id: setup
        uses: ./.github/actions/app-v4-setup
        with:
          rust-cache-job: rust-integration
      - name: Build App frontend
        run: |
          npm run build
      - name: Compile every Rust test target once
        # Supersedes the separate `cargo check --tests` pass; later runs reuse these artifacts.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --tests --no-run
      - name: Every library test is in a pull-request cohort or left to the full route
        # Lists the lib test target the step above built; standard-library Python only (no YAML library here).
        # tools/ci/lib_cohort_exclusions.txt says what is left out and why.
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list > "$RUNNER_TEMP/lib-tests.txt"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --list --ignored > "$RUNNER_TEMP/lib-ignored.txt"
          python ../tools/ci/check_lib_cohorts.py --list "$RUNNER_TEMP/lib-tests.txt" --ignored-list "$RUNNER_TEMP/lib-ignored.txt"
      - name: Clippy correctness and suspicious lints
        # Gates only these deny-level groups; every other lint stays a warning.
        run: |
          rustup component add clippy --toolchain 1.97.1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Focused persistence and authority boundaries
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
              --test attachments --test catalog_adapter --test failed_turn_closure --test external_trace --test trace_receiving --test swbpipe_receiving \
              --test act_storage --test recovery_startup --test access_integration \
              --test policy_standing --test decision_standing --test record_semantics --test record_relations \
              --test native_backend_smoke --test native_history --test history_integration --test steering_integration --test decide_flow --test role_lifecycle --test attested_reference_packaging --test schema_validation --test menu_capability \
              --test hosting_contract --test runtime_integration -- --test-threads=1
      - name: Record schemas and connector presentation (Rust fixtures)
        # Web tests that run Rust tests built by the compile step above, offline and without the supplier;
        # validate-records skips its Codex handshake case here, which the full route runs.
        run: node --test tests/validate-records.test.mjs tests/connector-route-presentation.test.mjs tests/connector-source-presentation.test.mjs
      - name: Focused lib cohorts (shard A)
        # One process per cohort, as before: some tests read process-wide state set by others.
        run: |
          set -f
          for cohort in $LIB_COHORTS; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "$cohort" -- --test-threads=1
          done
      - name: Save compiled third-party Rust dependencies
        if: ${{ !cancelled() }}
        uses: ./.github/actions/app-v4-rust-cache-save
        with:
          key: ${{ steps.setup.outputs.rust-cache-key }}
          already-cached: ${{ steps.setup.outputs.rust-cache-hit }}

  rust-lib-node:
    name: Lib shard B and Node presentation
    if: github.event_name != 'workflow_dispatch' && !inputs.full_suite
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LIB_COHORTS: >-
          supplier_0167_tests delegation_availability::tests
          execution_compatibility::report::tests::declared_delegation_reads_
          execution_compatibility::report::tests::an_undeclared_workflow_reads_undeclared_
          execution_compatibility::report::tests::a_host_operation_without_a_connected_host_
          runtime_session::workflow_root_tests::the_requirement_check_inventory_
          continuation_context::tests history_bridge conversation_roles::tests
          workflow_role_tests desktop_startup instruction_seed_tests
          workflow_catalog_tests recorded_replay_tests native_delivery::tests
          native_projection_delivery observer_rebuild
          native_history_error_content_is_not_durable workflow_reselection
          trial_authoring_source_tests records_access record_lines records_store
          records_export records_retention records_inspect placement_homes_tests installation::tests connector_route_store
          recovery::tests records_continuity fleet_ reply_close native_requests::tests
          call_custody after_run_end chat_workflow native_links startup_refusal
          native_conversation_links::delegation::tests
          recovery_root_cold_ waiting_requests_tests::
          runtime_session::workflow_root_tests::library_entries_tests
          stop_bound_tests home_hold::tests session_liveness::tests local_process_lock_tests
          prepared_turn_refusal_is_typed_only_for_a_correlated_native_error saved_working_folder_ sent_working_folder_
          isolation_resolves_a_relative_home_where_the_child_does
          act_control::a15::tests::listed_a15_
          act_control::native_statement::worst_case_fallbacks
          working_files::tests
          runtime_session::workflow_root_tests::proposal_disclosure_tests
          model_catalog
          handoff_send_tests
          hosting::probe::tests app_quit::tests codex_stop::tests native_lifecycle_confirmation::
          hosting::successor::tests::lt12
          stalled_probe_does_not_hold_app_writer_and_is_bounded
          j3_end_writes_run_ended_and_the_next_ordinary_turn_carries_the_notice_once
          runtime_session::workflow_root_tests::selected_chain_disclosure_tests
          runtime_session::workflow_root_tests::action_result_tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
      - id: setup
        uses: ./.github/actions/app-v4-setup
        with:
          rust-cache-job: rust-lib-node
      - name: Build App frontend
        run: |
          npm run build
      - name: Focused lib cohorts (shard B)
        # One process per cohort, as before: some tests read process-wide state set by others.
        run: |
          set -f
          for cohort in $LIB_COHORTS; do
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib "$cohort" -- --test-threads=1
          done
      - name: Standalone terminal identity
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib terminal_exchange_actual_selected_and_unselected_roundtrip -- --test-threads=1
      - name: Desktop setup presentation
        run: node --test tests/desktop-setup.test.mjs
      - name: Role history and portable export verification
        run: node --test tests/conversation-roles.test.mjs tests/verify-records-bag.test.mjs tests/process-group-custody.test.mjs tests/access-provider.test.mjs tests/fork-admission.test.mjs tests/continue-as-send.test.mjs tests/records-retention.test.mjs
      - name: Workflow and fleet presentation
        run: node --test tests/workflow-selection.test.mjs tests/requirement-check.test.mjs tests/run-panel.test.mjs tests/workflow-library.test.mjs tests/library-entries.test.mjs tests/registration-review.test.mjs tests/proposed-run-disclosure.test.mjs tests/selected-chain-disclosure.test.mjs tests/workflow-action-result.test.mjs tests/attachment-outcome.test.mjs tests/fleet-records.test.mjs tests/observer-attachment.test.mjs tests/run-journey.test.mjs tests/make-journey.test.mjs tests/journey-navigation.test.mjs tests/included-workflows.test.mjs tests/workflow-text.test.mjs tests/run-offers.test.mjs tests/trials.test.mjs tests/clean-trial-restart.test.mjs tests/workflow-drafts.test.mjs tests/workflow-supply-dispatch.test.mjs
      - name: Native history and conversation presentation
        run: node --test tests/native-history.test.mjs tests/native-activity.test.mjs tests/conversation-panel.test.mjs tests/recovery-custody.test.mjs tests/waiting-requests.test.mjs tests/native-waiting.test.mjs tests/history-continue-navigation.test.mjs tests/request-activity-navigation.test.mjs tests/model-choice.test.mjs tests/trial-continue-model-choice.test.mjs tests/ordinary-send-hold.test.mjs tests/reading-sentences.test.mjs tests/host-reads.test.mjs tests/request-cards.test.mjs tests/request-card-words.test.mjs tests/prepared-message-navigation.test.mjs tests/codex-controls.test.mjs tests/plan-mode.test.mjs tests/presentation.test.mjs tests/recorded-replay.test.mjs tests/stop-not-sent.test.mjs tests/local-model-settings.test.mjs
      - name: File-act arrival presentation
        # Each file runs Rust tests of the library target the cohorts above built, offline (the full route
        # runs both files through npm test).
        run: node --test tests/file-act-arrival.test.mjs tests/file-act-panel.test.mjs
      - name: Save compiled third-party Rust dependencies
        if: ${{ !cancelled() }}
        uses: ./.github/actions/app-v4-rust-cache-save
        with:
          key: ${{ steps.setup.outputs.rust-cache-key }}
          already-cached: ${{ steps.setup.outputs.rust-cache-hit }}

  sources-packaging:
    name: Schemas, successor feature, packaging and examination
    if: github.event_name != 'workflow_dispatch' && !inputs.full_suite
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
      - id: setup
        uses: ./.github/actions/app-v4-setup
        with:
          rust-cache-job: sources-packaging
      - name: Build App
        run: npm run build
      - name: Supplier carriage detector regressions (no supplier required)
        run: |
          python3 supplier_checks/test_records_delivery.py
          python3 supplier_checks/test_local_auth.py
          python3 supplier_checks/test_recorded_replay.py
          python3 supplier_checks/test_recordings.py
          python3 supplier_checks/test_intake.py
          python3 supplier_checks/swbpipe_projection_test.py
          python3 supplier_checks/swbpipe_receiving_test.py
          python3 supplier_checks/swbpipe_receiving_v4_test.py
          python3 supplier_checks/swbpipe_receiving_v4_pr30_test.py
          python3 supplier_checks/swbpipe_hash_receiving_test.py
          python3 -m unittest discover -s tests -p 'child_role_carrier_test.py'
          python3 -B -m unittest discover -s ../app/examination/native_support -p 'test_native_sheet_cancel.py'
          python3 -B -m unittest discover -s ../app/examination/native_support -p 'test_native_attended*.py'
          node ../app/examination/native_support/test_native_attended_manager.cjs
      - name: Packaging and examination behavior against selected App inputs
        # Group B examination suites run in always-on repository checks.
        run: >-
          python -m pytest -q           tests/terms_position_test.py tests/package_successor_test.py tests/production_inputs_test.py tests/notice_receipts_test.py tests/notice_resources_test.py tests/font_notice_test.py tests/notice_transitive_test.py tests/supplier_notice_observations_test.py tests/supplier_notice_selectors_test.py
          tests/examination_repin_test.py
          && python3 -B tests/candidate_identity_test.py
      - name: Staged distribution successor
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib s2_ -- --test-threads=1
      - name: Installed integrity and S4 evidence (synthetic source fixtures)
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib installed_custody::tests -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib hosting::successor::tests::installed_s4 -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib production_cannot_be_overridden_by_development_fields -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib compiled_successor_does_not_take_the_desktop_development_fallback -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib the_release_environment_route_never_takes_the_default_store_for_anything_but_the_childs_home -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib the_release_environment_route_refuses_a_relative_or_empty_home_and_admits_an_absolute_one -- --test-threads=1
      - name: Development model address is absent from the release configuration (fixture supplier)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib dev_model_address -- --test-threads=1
      - name: Publisher build selection (synthetic inputs, default None)
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib publisher_recipe:: -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features distribution-successor --lib publisher_selection::tests -- --test-threads=1
      - name: SEAL-C offline signing preparation (invented metadata only)
        run: python3 -B -m unittest discover -s ../app/packaging/seal_c -p 'test_prepare.py' -v
      - name: SEAL-C provider transition and native caller gates (source fixtures)
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib capture_seal -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib seal_c_enrollment -- --test-threads=1
      - name: Connected static packaging
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example distribution-static
          DISTRIBUTION_STATIC_BIN="$PWD/src-tauri/target/debug/examples/distribution-static" python -m pytest -q packaging/static_distribution/test_connected.py packaging/static_distribution/test_inventory.py packaging/static_distribution/test_s1_value_model.py
      - name: Save compiled third-party Rust dependencies
        if: ${{ !cancelled() }}
        uses: ./.github/actions/app-v4-rust-cache-save
        with:
          key: ${{ steps.setup.outputs.rust-cache-key }}
          already-cached: ${{ steps.setup.outputs.rust-cache-hit }}

  product:
    name: App v4 product
    if: github.event_name == 'workflow_dispatch' || inputs.full_suite
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
      - id: setup
        uses: ./.github/actions/app-v4-setup
        with:
          rust-cache-job: product
      - name: Prepare selected assessment supplier in scratch storage
        env:
          SUPPLIER_ROOT: ${{ runner.temp }}/app-v4-supplier
          CHIRALITY_CODEX_HOME: ${{ runner.temp }}/app-v4-codex-home
        run: |
          test "$(uname -m)" = arm64
          /usr/bin/git --no-lazy-fetch --version
          mkdir -p "$SUPPLIER_ROOT" "$CHIRALITY_CODEX_HOME"
          curl --fail --location --retry 2 \
            https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-package-aarch64-apple-darwin.tar.gz \
            --output "$SUPPLIER_ROOT/supplier.tgz"
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['SUPPLIER_ROOT'])
          archive = root / 'supplier.tgz'
          if archive.stat().st_size != 166340155:
              raise SystemExit('supplier archive size mismatch')
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != 'af45ed45d940d7998809622c1c0296d3098ed7d7fad695284422c228bd454517':
              raise SystemExit('supplier archive integrity mismatch')
          with tarfile.open(archive, 'r:gz') as package:
              members = package.getmembers()
              paths = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  if (path.is_absolute() or '..' in path.parts or not path.parts
                          or member.name in paths or not (member.isfile() or member.isdir())):
                      raise SystemExit('unsafe supplier archive member')
                  paths.add(member.name)
              vendor = root / 'vendor'
              vendor.mkdir()
              package.extractall(vendor, members=members, filter='data')
          PY
          echo "$SUPPLIER_ROOT/vendor/codex-path" >> "$GITHUB_PATH"
          export CHIRALITY_CODEX_BIN="$SUPPLIER_ROOT/vendor/bin/codex"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          binary = Path(os.environ['CHIRALITY_CODEX_BIN'])
          with binary.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != os.environ['CHIRALITY_CODEX_EXPECTED_SHA256']:
              raise SystemExit('supplier executable integrity mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CHIRALITY_CODEX_BIN={binary}\n')
          PY
      - name: Build App
        run: npm run build
      - name: Supplier carriage detector regressions (no supplier required)
        run: |
          python3 supplier_checks/test_records_delivery.py
          python3 supplier_checks/test_local_auth.py
          python3 supplier_checks/test_recorded_replay.py
          python3 supplier_checks/test_recordings.py
          python3 supplier_checks/test_intake.py
          python3 supplier_checks/swbpipe_projection_test.py
          python3 supplier_checks/swbpipe_receiving_test.py
          python3 supplier_checks/swbpipe_receiving_v4_test.py
          python3 supplier_checks/swbpipe_receiving_v4_pr30_test.py
          python3 supplier_checks/swbpipe_hash_receiving_test.py
          python3 -m unittest discover -s tests -p 'child_role_carrier_test.py'
          python3 -B -m unittest discover -s ../app/examination/native_support -p 'test_native_sheet_cancel.py'
          python3 -B -m unittest discover -s ../app/examination/native_support -p 'test_native_attended*.py'
          node ../app/examination/native_support/test_native_attended_manager.cjs
      - name: Sandbox and approval settings at the pin (pinned supplier, loopback stub, no model)
        env:
          LEVEL_SCRATCH: ${{ runner.temp }}
          LEVEL_REQUIRE_LIVE: '1'
        run: python3 supplier_checks/level/test_level_live.py
      - name: Full Rust suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Standalone terminal identity and connected static packaging
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib terminal_exchange_actual_selected_and_unselected_roundtrip -- --test-threads=1
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example distribution-static
          DISTRIBUTION_STATIC_BIN="$PWD/src-tauri/target/debug/examples/distribution-static" python -m pytest -q packaging/static_distribution/test_connected.py packaging/static_distribution/test_inventory.py packaging/static_distribution/test_s1_value_model.py
      - name: Role history and portable export verification
        run: node --test tests/conversation-roles.test.mjs tests/verify-records-bag.test.mjs tests/process-group-custody.test.mjs tests/access-provider.test.mjs tests/fork-admission.test.mjs tests/continue-as-send.test.mjs tests/records-retention.test.mjs
      - name: Workflow and fleet presentation
        run: node --test tests/workflow-selection.test.mjs tests/requirement-check.test.mjs tests/run-panel.test.mjs tests/workflow-library.test.mjs tests/library-entries.test.mjs tests/registration-review.test.mjs tests/proposed-run-disclosure.test.mjs tests/selected-chain-disclosure.test.mjs tests/workflow-action-result.test.mjs tests/attachment-outcome.test.mjs tests/fleet-records.test.mjs tests/observer-attachment.test.mjs tests/run-journey.test.mjs tests/make-journey.test.mjs tests/journey-navigation.test.mjs tests/included-workflows.test.mjs tests/workflow-text.test.mjs tests/run-offers.test.mjs tests/trials.test.mjs tests/clean-trial-restart.test.mjs tests/workflow-drafts.test.mjs tests/workflow-supply-dispatch.test.mjs
      - name: Native history and conversation presentation
        run: node --test tests/native-history.test.mjs tests/native-activity.test.mjs tests/conversation-panel.test.mjs tests/recovery-custody.test.mjs tests/waiting-requests.test.mjs tests/native-waiting.test.mjs tests/history-continue-navigation.test.mjs tests/request-activity-navigation.test.mjs tests/model-choice.test.mjs tests/trial-continue-model-choice.test.mjs tests/ordinary-send-hold.test.mjs tests/reading-sentences.test.mjs tests/host-reads.test.mjs tests/request-cards.test.mjs tests/request-card-words.test.mjs tests/prepared-message-navigation.test.mjs tests/codex-controls.test.mjs tests/plan-mode.test.mjs tests/presentation.test.mjs tests/recorded-replay.test.mjs tests/stop-not-sent.test.mjs tests/local-model-settings.test.mjs
      - name: Node schemas and presentation with mandatory supplier
        run: |
          test -x "$CHIRALITY_CODEX_BIN"
          npm test
      - name: Python receiving and custody behavior
        run: python -m pytest -q tests
      - name: Save compiled third-party Rust dependencies
        if: ${{ !cancelled() }}
        uses: ./.github/actions/app-v4-rust-cache-save
        with:
          key: ${{ steps.setup.outputs.rust-cache-key }}
          already-cached: ${{ steps.setup.outputs.rust-cache-hit }}

  result:
    name: App v4 checks
    needs: [rust-integration, rust-lib-node, sources-packaging, product]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the event's product verification to succeed
        working-directory: .
        env:
          FULL_ROUTE: ${{ github.event_name == 'workflow_dispatch' || inputs.full_suite }}
          FOCUSED: ${{ needs.rust-integration.result }} ${{ needs.rust-lib-node.result }} ${{ needs.sources-packaging.result }}
          FULL: ${{ needs.product.result }}
        run: |
          if [ "$FULL_ROUTE" = true ]; then
            test "$FULL" = success && test "$FOCUSED" = 'skipped skipped skipped'
          else
            test "$FOCUSED" = 'success success success' && test "$FULL" = skipped
          fi

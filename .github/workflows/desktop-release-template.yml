name: Desktop Unsigned Artifact Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/desktop-release-template.yml"
      - ".github/workflows/desktop-release-template.yml.disabled"
      - "projects/chirality-app-dev/frontend/**"
      - "projects/chirality-app-dev/docs/**"
      - "projects/chirality-app-dev/chirality.project.json"
      - "projects/chirality-runtime/**"
      - "agents/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-unsigned-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-unsigned-macos:
    name: Verify unsigned macOS artifact
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'artifact-proof') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block release workload pending deferred S0 qualification
        shell: bash
        run: |
          echo "::error::Deferred S0 qualification must supply accepted consume-only packaged-security inputs before release packaging can proceed."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            projects/chirality-runtime/package-lock.json
            projects/chirality-app-dev/frontend/package-lock.json

      - name: Install and build shared runtime
        working-directory: projects/chirality-runtime
        run: |
          npm ci
          npm run build

      - name: Install frontend dependencies
        working-directory: projects/chirality-app-dev/frontend
        run: npm ci

      - name: Verify unsigned build posture
        shell: bash
        run: |
          set -euo pipefail
          if env | grep -Eq '^(CSC_LINK|CSC_KEY_PASSWORD|APPLE_ID|APPLE_APP_SPECIFIC_PASSWORD|APPLE_TEAM_ID)='; then
            echo "::error::Signing or notarization credentials must not be present in this CI-only workflow."
            exit 1
          fi
          if [[ "${CSC_IDENTITY_AUTO_DISCOVERY}" != "false" ]]; then
            echo "::error::Automatic signing identity discovery must remain disabled."
            exit 1
          fi
          echo "This job creates an unsigned/adhoc CI artifact only." >> "${GITHUB_STEP_SUMMARY}"

      - name: Run release-target policy tests
        working-directory: projects/chirality-app-dev/frontend
        run: >-
          npm test --
          src/__tests__/scripts/dmg-packaging-policy.test.ts
          src/__tests__/scripts/desktop-release-workflow.test.ts

      - name: Build unsigned macOS DMG
        working-directory: projects/chirality-app-dev/frontend
        run: npm run desktop:dist

      - name: Verify unsigned artifact
        shell: bash
        working-directory: projects/chirality-app-dev/frontend
        run: |
          set -euo pipefail

          app_path="dist/mac-arm64/Chirality.app"
          executable_path="${app_path}/Contents/MacOS/Chirality"
          instruction_summary="artifacts/harness/instruction-root-integrity/latest/summary.json"
          verification_root="artifacts/release-verification"
          staged_sdk_proof_root="${verification_root}/packaged-agent-sdk/staged"
          mounted_sdk_proof_root="${verification_root}/packaged-agent-sdk/mounted"

          [[ -d "${app_path}" ]] || {
            echo "::error::Missing packaged app at ${app_path}"
            exit 1
          }
          [[ -x "${executable_path}" ]] || {
            echo "::error::Missing packaged executable at ${executable_path}"
            exit 1
          }
          [[ -f "${instruction_summary}" ]] || {
            echo "::error::Missing instruction-root integrity summary."
            exit 1
          }

          dmg_count="$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          [[ "${dmg_count}" = "1" ]] || {
            echo "::error::Expected exactly one macOS DMG, found ${dmg_count}."
            exit 1
          }
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' -print | head -n 1)"

          mkdir -p "${verification_root}"
          node ./scripts/verify-packaged-dependency-boundary.mjs >"${verification_root}/packaged-dependency-boundary.json"
          node -e '
            const fs = require("node:fs");
            const summary = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (summary.status !== "PASS") {
              throw new Error(`packaged dependency boundary status is ${summary.status}`);
            }
          ' "${verification_root}/packaged-dependency-boundary.json"

          node -e '
            const fs = require("node:fs");
            const summary = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (summary.status !== "pass") {
              throw new Error(`instruction-root integrity status is ${summary.status}`);
            }
          ' "${instruction_summary}"

          run_packaged_sdk_proof() {
            local bundle_root="${1}"
            local output_root="${2}"
            local proof_label="${3}"
            local summary_path="${output_root}/summary.json"

            node ./scripts/verify-packaged-agent-sdk-runtime.mjs \
              --bundle-root "${bundle_root}" \
              --output-root "${output_root}"
            [[ -f "${summary_path}" ]] || {
              echo "::error::Missing ${proof_label} packaged Agent SDK summary at ${summary_path}."
              exit 1
            }
            node -e '
              const fs = require("node:fs");
              const summary = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const proofLabel = process.argv[2];
              if (summary.status !== "pass") {
                throw new Error(`${proofLabel} packaged Agent SDK status is ${summary.status}`);
              }
              if (summary.proofMode !== "scripted-no-live-provider") {
                throw new Error(`${proofLabel} packaged Agent SDK proof mode is ${summary.proofMode}`);
              }
            ' "${summary_path}" "${proof_label}"
          }

          run_packaged_sdk_proof \
            "${app_path}/Contents/Resources" \
            "${staged_sdk_proof_root}" \
            "staged app"

          archs="$(lipo -archs "${executable_path}")"
          [[ " ${archs} " == *" arm64 "* ]] || {
            echo "::error::Packaged executable is not arm64: ${archs}"
            exit 1
          }

          minimum_version="$(plutil -extract LSMinimumSystemVersion raw "${app_path}/Contents/Info.plist")"
          minimum_major="${minimum_version%%.*}"
          [[ "${minimum_major}" =~ ^[0-9]+$ && "${minimum_major}" -ge 15 ]] || {
            echo "::error::LSMinimumSystemVersion must be 15.0.0 or later; found ${minimum_version}."
            exit 1
          }

          assert_no_release_signature() {
            local target="${1}"
            local evidence_path="${2}"
            codesign --display --verbose=4 "${target}" >"${evidence_path}" 2>&1 || true
            if grep -q '^Authority=' "${evidence_path}"; then
              echo "::error::Developer/release signing authority found on CI-only artifact: ${target}"
              exit 1
            fi
            local team_identifier
            team_identifier="$(sed -n 's/^TeamIdentifier=//p' "${evidence_path}" | head -n 1)"
            if [[ -n "${team_identifier}" && "${team_identifier}" != "not set" ]]; then
              echo "::error::Signing team identifier found on CI-only artifact: ${target}"
              exit 1
            fi
          }

          assert_no_notarization_ticket() {
            local target="${1}"
            local evidence_path="${2}"
            if xcrun stapler validate "${target}" >"${evidence_path}" 2>&1; then
              echo "::error::CI-only artifact unexpectedly has a valid notarization ticket: ${target}"
              exit 1
            fi
          }

          assert_no_release_signature "${app_path}" "${verification_root}/staged-app-codesign.txt"
          assert_no_notarization_ticket "${app_path}" "${verification_root}/staged-app-stapler.txt"
          assert_no_release_signature "${dmg_path}" "${verification_root}/dmg-codesign.txt"
          assert_no_notarization_ticket "${dmg_path}" "${verification_root}/dmg-stapler.txt"
          hdiutil verify "${dmg_path}" >"${verification_root}/dmg-verify.txt"

          mount_root="$(mktemp -d "${RUNNER_TEMP}/chirality-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "${mount_root}" -quiet >/dev/null 2>&1 || true
            rmdir "${mount_root}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "${mount_root}" "${dmg_path}" >/dev/null
          mounted_app="${mount_root}/Chirality.app"
          mounted_executable="${mounted_app}/Contents/MacOS/Chirality"
          [[ -d "${mounted_app}" && -x "${mounted_executable}" ]] || {
            echo "::error::DMG does not contain Chirality.app."
            exit 1
          }
          run_packaged_sdk_proof \
            "${mounted_app}/Contents/Resources" \
            "${mounted_sdk_proof_root}" \
            "read-only mounted DMG app"
          assert_no_release_signature "${mounted_app}" "${verification_root}/mounted-app-codesign.txt"
          assert_no_notarization_ticket "${mounted_app}" "${verification_root}/mounted-app-stapler.txt"

          dmg_sha256="$(shasum -a 256 "${dmg_path}" | awk '{print $1}')"
          executable_sha256="$(shasum -a 256 "${executable_path}" | awk '{print $1}')"
          mounted_executable_sha256="$(shasum -a 256 "${mounted_executable}" | awk '{print $1}')"
          [[ "${mounted_executable_sha256}" = "${executable_sha256}" ]] || {
            echo "::error::Mounted DMG app does not match the verified staged app."
            exit 1
          }

          node - "${verification_root}/summary.json" "${dmg_path}" "${dmg_sha256}" "${app_path}" "${executable_sha256}" "${mounted_executable_sha256}" "${archs}" "${minimum_version}" <<'NODE'
          const fs = require('node:fs');
          const [
            outputPath,
            dmgPath,
            dmgSha256,
            appPath,
            executableSha256,
            mountedExecutableSha256,
            archs,
            minimumSystemVersion
          ] = process.argv.slice(2);
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(
              {
                schema: 'chirality-desktop-unsigned-artifact-proof/v1',
                status: 'pass',
                scope: 'ci-artifact-only',
                signing: 'unsigned-or-adhoc-no-authority',
                notarization: 'no-valid-stapled-ticket',
                dmg: { path: dmgPath, sha256: dmgSha256 },
                app: {
                  path: appPath,
                  executableSha256,
                  mountedExecutableSha256,
                  mountedIdentityMatches: mountedExecutableSha256 === executableSha256,
                  archs: archs.split(/\s+/).filter(Boolean),
                  minimumSystemVersion
                },
                packagedDependencyBoundary:
                  'artifacts/release-verification/packaged-dependency-boundary.json',
                instructionRootSummary:
                  'artifacts/harness/instruction-root-integrity/latest/summary.json',
                packagedAgentSdkProofs: {
                  staged:
                    'artifacts/release-verification/packaged-agent-sdk/staged/summary.json',
                  mounted:
                    'artifacts/release-verification/packaged-agent-sdk/mounted/summary.json'
                }
              },
              null,
              2
            )}\n`
          );
          NODE

          cleanup
          trap - EXIT
          echo "Unsigned macOS artifact verification passed." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload unsigned CI artifact and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: chirality-desktop-macos-arm64-unsigned
          path: |
            projects/chirality-app-dev/frontend/dist/*.dmg
            projects/chirality-app-dev/frontend/artifacts/release-verification/**
            projects/chirality-app-dev/frontend/artifacts/harness/instruction-root-integrity/latest/summary.json
          if-no-files-found: error
          retention-days: 7

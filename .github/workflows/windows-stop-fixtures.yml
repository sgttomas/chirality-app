name: Supplemental Windows generation Stop fixtures

on:
  pull_request:
    paths:
      - .github/workflows/windows-stop-fixtures.yml
      - .gitattributes
      - app/examination/windows_platform/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop-fixtures:
    name: Hosted native-AMD64 P03 (supplemental)
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'core.autocrlf'
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require preinstalled Python and execute bound P03 fixture
        shell: pwsh
        env:
          FIXTURE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command python -CommandType Application -ErrorAction Stop
          & $python.Source -I -B -c "import sys; assert sys.version_info >= (3,9), 'preinstalled Python >=3.9 required'"
          if ($LASTEXITCODE -ne 0) { throw 'Preinstalled Python unavailable; no acquisition permitted' }
          & $python.Source -I -B app/examination/windows_platform/run_hosted_p03.py --source-commit $env:FIXTURE_SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'P03 failed/refused; inspect bounded raw evidence' }
      - name: Retain source identities and bounded raw channels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-stop-fixture-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/windows-stop-fixture-evidence/
          if-no-files-found: warn
          retention-days: 14

name: governance-harness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selection_mode: ${{ steps.selection.outputs.selection_mode }}
      run_product: ${{ steps.selection.outputs.run_product }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select checks from the complete PR change
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/ci/select_checks.py select --event "$EVENT"
          --base "$BASE" --head "$HEAD"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository-check dependencies
        run: python -m pip install pyyaml pytest
      - name: Deliverable structure and utility behavior
        run: |
          python -m tools.deliverables --project . check > deliverable-check.json
          python -m pytest -q tools/deliverables/test_cli.py
          python -m pytest -q tools/ci/test_selection.py
      - name: Conflict, credential and private-term checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          TERMS_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE=HEAD^1; fi
          python tools/validation/validate_conflict_markers.py --base "$BASE" --head HEAD
          python tools/validation/validate_run_record_leaks.py --base "$BASE" --head HEAD
          REQUIRE=()
          if [ "$TERMS_REQUIRED" = true ]; then REQUIRE=(--require-terms); fi
          python tools/validation/validate_private_terms.py --base "$BASE" --head HEAD "${REQUIRE[@]}"
  app-v4:
    needs: repository-checks
    if: needs.repository-checks.outputs.run_product == 'true'
    uses: ./.github/workflows/app-v4.yml
  harness:
    name: harness
    needs: [repository-checks, app-v4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/select_checks.py gate

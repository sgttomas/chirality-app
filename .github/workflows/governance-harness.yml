name: governance-harness
on:
  pull_request:
  # Merge-queue candidates take the same selection and gate as pull requests.
  # Path filters do not apply, so the required "harness" check always reports.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Each queue candidate runs in its own group, keyed by run, so neither a
  # superseded PR run nor a manual dispatch on the queue branch can replace it.
  # Only superseded pull_request runs are cancelled.
  group: governance-harness-${{ github.event.pull_request.number || github.event_name == 'merge_group' && format('queue-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selection_mode: ${{ steps.selection.outputs.selection_mode }}
      run_product: ${{ steps.selection.outputs.run_product }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select checks from the complete PR change
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          python3 tools/ci/select_checks.py select --event "$EVENT"
          --base "$BASE" --head "$HEAD"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository-check dependencies
        run: python -m pip install pyyaml pytest jsonschema==4.26.0
      - name: Deliverable structure and utility behavior
        run: |
          python tools/ci/select_checks.py inventory
          python tools/ci/check_execution_layout.py
          python tools/ci/execution_inputs.py
          python tools/ci/check_documentary_sources.py
          python app/tests/check_git_checkout_bytes.py
          python -m pytest -q tools/ci/test_execution_layout.py
          python -m pytest -q app/tests/group_b*test.py app/tests/deliverable_path_test.py
          python -m tools.deliverables --project . check > deliverable-check.json
          python -m tools.instruction_resources --check
          python -m unittest tools.test_instruction_resources
          python app/examination/repin.py --check
          python -m pytest -q tools/deliverables/test_cli.py
          python -m pytest -q tools/ci/test_selection.py
          python -m pytest -q tools/test_run_recorded_prototype.py
          python -m pytest -q tools/test_role_prototype_output.py
          python -m pytest -q tools/validation/test_library_v2_1_operational_adoption.py
          python -m pytest -q tools/validation/test_library_v3_operational_adoption.py
          python -m pytest -q tools/validation/test_document_metadata.py
      - name: Conflict and credential checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE=HEAD^1; fi
          python tools/validation/validate_conflict_markers.py --base "$BASE" --head HEAD
          python tools/validation/validate_run_record_leaks.py --base "$BASE" --head HEAD
  app-v4:
    needs: repository-checks
    if: needs.repository-checks.outputs.run_product == 'true'
    uses: ./.github/workflows/app-v4.yml
  harness:
    name: harness
    needs: [repository-checks, app-v4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/select_checks.py gate

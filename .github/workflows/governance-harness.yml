name: governance-harness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides the route on its own so product jobs do not wait for repository checks.
  change-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      selection_mode: ${{ steps.selection.outputs.selection_mode }}
      run_product: ${{ steps.selection.outputs.run_product }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select checks from the complete PR change
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/ci/select_checks.py select --event "$EVENT"
          --base "$BASE" --head "$HEAD"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
  # Tests the pull request merged with main (the event's merge commit), so that a
  # command main adds runs against a tree that has its file. Selection, the
  # product jobs and the gate stay on the head.
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Name the commits under test
        env:
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          tested=$(git rev-parse HEAD)
          echo "Tested commit: $tested"
          if [ "$EVENT" = pull_request ]; then
            merged_base=$(git rev-parse HEAD^1)
            merged_head=$(git rev-parse HEAD^2)
            echo "It merges the pull request head $merged_head"
            echo "with the base $merged_base"
            echo "Event base: $PR_BASE"
            test "$tested" = "$EVENT_SHA" && test "$merged_head" = "$PR_HEAD" || {
              echo "The tested commit is not the event's merge of the pull request head."; exit 1; }
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository-check dependencies
        run: python -m pip install pyyaml pytest jsonschema==4.26.0
      - name: Deliverable structure and utility behavior
        run: |
          python tools/ci/select_checks.py inventory
          python tools/ci/check_execution_layout.py
          python app/tests/check_git_checkout_bytes.py
          python -m pytest -q tools/ci/test_execution_layout.py tools/ci/test_nightly_report.py
          python -m pytest -q app/tests/group_b*test.py
          python -m pytest -q app/tests/examination_repin_test.py
          python -m tools.deliverables --project . check > deliverable-check.json
          python -m unittest tools.test_instruction_resources
          python app/examination/repin.py --check
          python -m pytest -q tools/deliverables/test_cli.py
          python -m pytest -q tools/ci/test_selection.py
          python -m pytest -q tools/ci/test_rust_dep_cache.py
          python -m pytest -q tools/ci/test_web_test_listing.py
          python -m pytest -q tools/ci/test_lib_cohorts.py
          python -m pytest -q tools/ci/test_check_records_presence.py
          python -m pytest -q tools/validation/test_library_v2_1_operational_adoption.py
          python -m pytest -q tools/validation/test_library_v3_operational_adoption.py
          python -m pytest -q tools/validation/test_document_metadata.py
          python -m pytest -q tools/library_workflows
      # These examine the pull request's own change, base to head, read from Git
      # objects rather than the checkout, so they keep the head as before.
      - name: Conflict and credential checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then BASE="${HEAD_SHA}^1"; fi
          python tools/validation/validate_conflict_markers.py --base "$BASE" --head "$HEAD_SHA"
          python tools/validation/validate_run_record_leaks.py --base "$BASE" --head "$HEAD_SHA"
  app-v4:
    needs: change-selection
    if: needs.change-selection.outputs.run_product == 'true'
    uses: ./.github/workflows/app-v4.yml
  harness:
    name: harness
    needs: [change-selection, repository-checks, app-v4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require every selected job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci/select_checks.py gate

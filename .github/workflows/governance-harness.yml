name: Release projection CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Release projection checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Range checks inspect only the candidate changes.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - name: Install pinned validation dependencies
        run: python -m pip install -r tools/ci/requirements.txt
      - name: Public source and catalog integrity
        run: |
          python tools/ci/validate_release_projection.py
          python tools/validation/validate_agent_instructions.py --json
          python tools/validation/validate_skill_metadata.py .agents/skills --json
          python tools/validation/validate_workflow_metadata.py --public-export --json
      - name: Projection and instruction-contract regressions
        run: >-
          python -m pytest -q
          tools/ci/test_release_projection.py
          tools/validation/test_validate_agent_instructions.py
          tools/validation/test_four_role_contract.py
          tools/validation/test_validate_conflict_markers.py
          tools/validation/test_validate_run_record_leaks.py
      - name: Changed-file conflict and credential checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            BASE_REF=HEAD^
          fi
          python tools/validation/validate_conflict_markers.py --base "$BASE_REF" --head HEAD
          python tools/validation/validate_run_record_leaks.py --base "$BASE_REF" --head HEAD

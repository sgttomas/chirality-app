id: DEL-03-04
name: Host boundary and integration guide
needs:
- from: doc:docs/HOST_INTEGRATION.md
  condition: The ownership table of section 1 and the ten-item new-host checklist of section 10
    are the comparison basis for the guide's completeness.
- from: DEL-03-01
  condition: The catalog contract states what every entry declares, what a read returns with its
    standing and basis, and a map of what is generated from the catalog, checked against it or
    hand-built on each surface.
  gating: true
- from: DEL-03-02
  condition: The proposal contract states the one validation and application route, the proposal
    lifecycle, stale refusal, unchanged targets, one effect for a repeated submission, the unknown
    outcome, and the old and new values a host's view presents.
  gating: true
- from: DEL-03-03
  condition: The external receiving definition states the channel's disabled, enabled and unavailable
    states, what the person's enablement does and does not grant, and that the external channel
    follows the same route and policy.
  gating: true
- from: DEL-02-01
  condition: A workflow carries a portable declared part (inputs, required host tools, checkpoints
    requiring a human act, outputs and evidence) with its prose method and a source-qualified identity,
    and the four role meanings are stated for App and host receiving.
  gating: true
- from: DEL-02-03
  condition: A missing required tool yields an explicit unsupported outcome, a checkpoint's act is
    recorded only when performed, and a workflow can be transferred to a host and refined back
    with its source identity kept.
  gating: true
- from: DEL-02-04
  condition: Role guidance is supplied additively to the harness's own instructions, with its source
    identity and supplied bytes inspectable and its unenforced limits stated.
  gating: true
- from: DEL-04-01
  condition: The operation policy states the direct, proposal and reserved distinctions, the acts
    reserved to a person, "accept" as the word for a proposal decision, and which values are adopted
    and which still open.
  gating: true
- from: DEL-04-02
  condition: The grant in force is visible per class of operation and recorded with each run, and
    a direct application shows its origin with the host's undo and later-checking routes.
  gating: true
- from: DEL-04-03
  condition: A human act is recorded bound to its content, scope and purpose with actor apart from
    recorder and lapses visibly when the content changes, and a run record links the host's receipts
    by reference.
  gating: true
- from: DEL-05-01
  condition: The loop requirements state the model choice with no default, the destination and credential
    boundary, catalog-schema validation before domain validation, the handling of malformed and
    truncated calls, and a responsive interface.
  gating: true
- from: DEL-05-02
  condition: The panel requirements state the conversation, workflow, proposal and check interactions
    and that the agent's work appears in the host's own tables and views.
  gating: true
- from: DEL-07-01
  condition: Retained PEC material is constructed compatibility material, never a live, qualified
    or adopted service; its record tier reports what its cited file states and its presence tier never
    supports reliance.
  gating: false
- from: DEL-07-02
  condition: Connector receiving distinguishes current, absent, stale, partial and failing material,
    shows the source, standing, coverage and freshness of retained PEC material actually consumed,
    and names the source-file recovery route.
  gating: true
- from: DEL-08-01
  condition: The Domains receiving contract states request and result meanings, source references,
    standing and freshness, and that a search hit establishes no admission.
  gating: true
- from: DEL-08-02
  condition: The later research-to-design contribution states the provider, query-tool, workflow,
    host and App contributions with their owners and points of need, and that the first activity
    needs no connector.
  gating: true
- from: DEL-01-01
  condition: The supplier boundary states the native surfaces available for optional external access,
    and observes for each App turn the guidance supplied and the model and destination the supplier
    reported, handing them to the record writer.
  gating: true
- from: DEL-09-06
  condition: The contribution account lists every question put to SWBPIPE and every answer, commitment
    and contribution received, each with its standing.
  gating: true
- from: DEL-09-09
  condition: The external control case suite is defined (access never enabled, unavailable and enabled;
    inspect, submit, accept and receipt; stale, retarget, duplicate, lost acknowledgment and unknown
    outcome).
  gating: true
- from: external:OI-003
  condition: The owner, with the host contract owner, decides whether the catalog-extension promise
    is retained, narrowed or deferred.
  when: Before the guide states an extension criterion.
- from: external:OI-021
  condition: The owner chooses the operation, the autonomy permitted and the candidate environment
    of the first connected activity.
  when: Before the guide names that activity's operation.
code_paths: []

id: DEL-03-01
name: Capability catalog and read-basis contract
needs:
- from: DEL-04-01
  condition: The operation policy names the classes an operation may carry (none, may apply within
    granted autonomy, proposal only, reserved to the person), marks each concrete value as adopted
    or still open, and names the acts reserved to a person.
  gating: true
- from: DEL-04-03
  condition: A recorded human act has a stated field set (actor, recorder, bound content, scope and
    purpose) and is shown as lapsed when its bound content changes, so a read's standing can carry
    it by reference.
  gating: false
- from: DEL-03-02
  condition: A change request cites the basis of the reads it relied on, and every state the host
    reports for it names that same basis, so the read-to-action basis fixtures have a later action
    to follow.
  gating: false
- from: external:DEP-001
  condition: SWBPIPE publishes its capability catalog and supplies its own operations, tables, diagnostics,
    availability reasons and read basis.
  when: Before conformance is stated for that host.
- from: external:OI-003
  condition: The owner, with the host contract owner, decides whether the catalog-extension promise
    is retained, narrowed to defined generated surfaces or deferred.
  when: Before the extension criterion is fixed or the capability claimed.
- from: external:OI-014
  condition: The App/shared contract owners, with the affected host and consumer owners, agree where
    the catalog schemas are placed, how a host serializes its catalog and reads, and the content-identity
    method and its designation.
  when: Before a schema implementation or a conformance claim depends on them.
- from: external:OI-021
  condition: The owner chooses the operation, the autonomy permitted and the candidate environment
    of the first connected activity, and rules any operation-specific class.
  when: Before a live joined examination.
code_paths:
- app/src-tauri/src/catalog.rs
- app/src-tauri/resources/catalog_adapter/manifest.json
- app/src-tauri/resources/catalog_adapter/catalog.*
- app/src-tauri/resources/catalog_adapter/edition_change_event.*
- app/src-tauri/resources/catalog_adapter/read_result.*
- app/src-tauri/resources/swbpipe_receiving/swbpipe-profile-documents.json
checks:
# catalog_adapter.rs is one check file shared with DEL-03-02, DEL-03-03, DEL-05-01, DEL-05-02.
# Here: the cases on the schema registry, catalog and read documents, and schema checks before
# domain checks.
- app/src-tauri/tests/catalog_adapter.rs
- app/src-tauri/tests/swbpipe_receiving.rs

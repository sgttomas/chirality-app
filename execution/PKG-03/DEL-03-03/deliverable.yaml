id: DEL-03-03
name: Local external-agent receiving adapter
needs:
- from: DEL-03-01
  condition: The catalog states each operation's identity, version, availability reasons and exposure
    on the external surface, and a read carries its content, standing and basis, with the non-success
    results (unavailable, not permitted, not exposed, channel not enabled, error) kept distinct;
    and the shared fixture catalogue and simulated host are reachable over both native paths, an
    MCP tool path and a command-line path.
  gating: false
- from: DEL-03-02
  condition: A change request binds its targets and relied-on basis, and the state a host reports
    for it distinguishes queued, accepted, applied with a receipt, the refusals (stale, invalid,
    not permitted, identity conflict) and an unknown outcome, with one effect per item for a repeated
    submission.
  gating: false
- from: DEL-04-01
  condition: The operation policy names the acts reserved to a person, including enabling and disabling
    external access, treats routine tool permission as no human act, and applies the same to every
    channel.
  gating: true
- from: DEL-01-01
  condition: The App owns a stock Codex child whose native MCP tool calls, command executions and
    MCP server status reach the App as observed items, at the supplier version that deliverable
    selects; and the model and destination the supplier reported are handed over at the scope at
    which they were reported.
  gating: true
- from: DEL-01-02
  condition: A request in flight when Codex stops or the App relaunches is reported as interrupted
    with its last observed state, apart from one that completed.
  gating: true
- from: DEL-02-03
  condition: Checkpoint recording names the events (a proposal queued, a request recorded, an act
    observed or declined, an item leaving, an observation lost or recovered) that an observation
    on the external channel is an input to; a checkpoint's act is recorded only when performed,
    and a hold exists only in the governance phase.
  gating: false
- from: DEL-04-02
  condition: The grant in force for a class of operation is shown as an established or an unestablished
    state with its settings reference, so a dispatch can state the grant it was made under.
  gating: false
- from: DEL-02-01
  condition: A workflow declares each checkpoint with its required act, subject class and reached-when,
    for carriage on the external channel in the governance phase.
  gating: false
- from: external:DEP-001
  condition: The host offers a catalog-derived machine-local MCP server or command-line interface,
    a facility by which the person enables it and which returns a capture-evidence reference, and
    its route, receipts and act records.
  when: Before a connected journey, its examination or a host-enforcement claim relies on them.
- from: external:DEP-001
  condition: The App external-host integration owner and the host owner settle the native path,
    transport, caller authentication and wire schemas of the receiving interface.
  when: Before an implementation or a qualification depends on that interface.
code_paths:
- app/src-tauri/src/external_adapter.rs
- app/src-tauri/resources/catalog_adapter/channel_status.*
- app/src-tauri/resources/catalog_adapter/external_dispatch_record.*
- app/src-tauri/resources/catalog_adapter/checkpoint_observation.*
checks:
- app/src-tauri/tests/catalog_adapter.rs

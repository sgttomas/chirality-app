id: DEL-03-02
name: Proposal, validation and outcome contract
needs:
- from: DEL-03-01
  condition: The catalog gives each operation a stable identity and version, its arguments, effects
    and declared errors, and every read carries its basis (workspace identity, generation, model
    revision, canonical content identity) and a content identity for each subject.
  gating: false
- from: DEL-04-01
  condition: The operation policy distinguishes direct application under a grant, proposal and reserved
    acts, names accepting and rejecting a proposal as the person's acts and withdrawing as the proposer's,
    and marks an operation with no adopted class as open.
  gating: true
- from: DEL-02-01
  condition: A workflow has a source-qualified identity (kind, origin, source root, name, revision)
    that a change request's origin can name, and declares each checkpoint with its required act,
    subject class and reached-when.
  gating: false
- from: DEL-04-02
  condition: The grant in force for a class of operation is shown as an established or an unestablished
    state with its value and its settings reference, so a request can state its standing at drafting.
  gating: false
- from: external:DEP-001
  condition: SWBPIPE's one route validates and applies every change, records acceptance and application
    with a receipt, assigns each change item a content identity, states its de-duplication scope
    and answers an observation by proposal identity.
  when: Before an integration or a witness relies on that host.
- from: external:OI-014
  condition: The App/shared contract owners place the shared proposal contract against its actual
    consumers.
  when: Before structural or production allocation.
- from: external:DEP-001
  condition: Each proposal's old and new values, affected objects and reason are supplied in the
    form the host's own proposal view presents.
  direction: downstream
  gating: false
code_paths:
- app/src-tauri/src/proposal.rs
- app/src-tauri/resources/catalog_adapter/proposal.*
- app/src-tauri/resources/catalog_adapter/proposal_state.*
- app/src-tauri/resources/swbpipe_receiving/swbpipe-corpus-mapping.json
- app/contract_inputs/PKG-03/DEL-03-02/Work/prototype/swbpipe_corpus_map.py
checks:
- app/contract_inputs/PKG-03/DEL-03-02/Work/prototype/proposal_states.py
- app/contract_inputs/PKG-03/DEL-03-02/Work/prototype/swbpipe_corpus_map.py
- app/src-tauri/tests/catalog_adapter.rs
- app/src-tauri/tests/swbpipe_receiving.rs

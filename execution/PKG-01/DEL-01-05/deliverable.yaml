id: DEL-01-05
name: Native ChatGPT sign-in and oMLX/local-provider access
needs:
- from: DEL-01-01
  condition: A Codex child is started for each home; the App adds no credential to its
    environment and removes the inherited variables on its list of names for that start path; the
    supplier's account, model and configuration methods and a conversation's provider selection
    are carried unchanged; and the destination Codex reports for a turn is available.
  gating: true
- from: DEL-01-01
  condition: The embedding protocol qualification on the identified candidate and what Codex
    requires of a provider at the pin are stated, with published requirements kept apart from
    observed capability.
  gating: true
  when: Qualification of the account, provider and local-server interfaces and the handoff to the
    host loop contract
- from: external:OpenAI ChatGPT sign-in service
  condition: The Codex-managed ChatGPT sign-in completes in the system browser for the person's
    own account.
  when: Sign-in on the candidate
- from: external:local model server
  condition: A local model server serves the Responses interface at the configured endpoint and
    accepts the key the person holds.
  when: A local conversation and the substitution of a second server
code_paths:
- app/src-tauri/src/access.rs
- app/src-tauri/src/access_settings.rs
# access_provider.rs is shared with DEL-02-04. Here: admission of the providers Codex reports
# from the person's settings. The use of a provider's metadata for role guidance is DEL-02-04's.
- app/src-tauri/src/access_provider.rs
- app/src-tauri/src/auth_rpc.rs
- app/src-tauri/src/oauth_control.rs
- app/src-tauri/src/provider_create.rs
- app/src-tauri/src/provider_endpoint.rs
- app/src-tauri/src/provider_endpoint_confirmation.rs
- app/src-tauri/src/config_resource_continuation.rs
- app/src-tauri/src/home_resources.rs
- app/src-tauri/src/native_local_provider.rs
# The development model address: a startup input the release configuration never consults.
- app/src-tauri/src/dev_model_address.rs
- app/src-tauri/src/native_secure_entry.rs
- app/src-tauri/src/model_catalog.rs
- app/src-tauri/src/desktop_setup_confirmation.rs
# desktop_startup.rs is shared with DEL-01-01. Here: preparation of the homes and the saved
# desktop setup. Selection of the supplier binary and its start are DEL-01-01's.
- app/src-tauri/src/desktop_startup.rs
- app/src-tauri/resources/runtime_core/access.conversation-selection.schema.json
# hosting.rs, runtime_session.rs, lib.rs and App.tsx are shared. Here: the account and provider
# calls, a conversation's selection state, and the commands and mounting of the surfaces below.
- app/src-tauri/src/hosting.rs
- app/src-tauri/src/runtime_session.rs

id: DEL-01-02
name: Durable execution and request recovery
needs:
- from: DEL-01-01
  condition: Each Codex child's start, readiness, stop and exit are reported with their generation;
    every server request has a register entry from receipt and an unfamiliar one has its explicit
    error written at once; no App rule answers a tool-permission request affirmatively; an unobserved
    response is reported unknown; and the processes the supplier started are counted at a stop
    or an exit.
  gating: true
- from: DEL-01-05
  condition: Every conversation belongs to exactly one App-owned Codex home, and each home has
    a stable identity that survives a relaunch.
  gating: true
- from: DEL-01-04
  condition: The interrupt control, the question before a quit, and Stop Codex and Restart Codex
    are offered to the person, and with live work only the person's confirmation in a native question
    lets the quit or stop proceed.
  gating: true
- from: DEL-02-03
  condition: An interrupt, a Codex stop, a quit and a relaunch each leave a workflow run open
    and recoverable as the same run.
  gating: false
- from: DEL-04-01
  condition: Routine tool permission is the person's own Codex setting and never stands for a
    reserved act; evidence of one act establishes no other, and no independently evidenced act
    is refused for want of another.
  gating: false

id: DEL-01-04
name: Native requests, outcomes and attachments
needs:
- from: DEL-01-01
  condition: Native views require DEL-01-01's actual stock Codex hosting boundary, selected supplier identity,
    generated protocol types and protocol qualification. SEAL-C signing-stage use also consumes the compiled
    publisher subject and installed-integrity boundary in Work/SEAL_C_KEYCHAIN_TRANSITION.md. The initially
    None-gated keychain selection was admitted 2026-11-03; selection alone does not activate keychain access.
  gating: true
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-01-02
  condition: Receive the actual session/request interface, observed and recovered execution state and outstanding
    requests from App DEL-01-02; route native responses through its interface while leaving durable settlement
    and recovery ownership there.
  gating: true
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-02-02
  condition: Receive from DEL-02-02 source-qualified draft identity, draft/registration/collision/refusal
    transitions, the A15 descriptor bound to the exact reviewed content (one reviewed draft, one entry reviewed
    in place, or several library entries) and the run-start text and run-end line for the turns this slice
    composes.
  gating: false
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-04-01
  condition: Consume the adopted operation-policy and human-act distinction interface carried by App DEL-04-01
    when implementing and checking UI labels and attribution; actual adopted policy must exist for the affected
    operation.
  gating: true
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-04-03
  condition: Consume the content-bound act/run-record and recording interface, distinct actor/subject evidence
    and supplied content-change lapse standing owned by App DEL-04-03 for faithful native presentation/recording.
  gating: false
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: external:OI-001
  condition: Reserved-act matters not covered by the first-increment ruling (APP-V4-FIRST-INCREMENT-20260928-DECISION-1
    D2) stay with the owner and App/SWB contract owners before operation-policy production contracts; operation-specific
    additions remain open under OI-021. This slice consumes the adopted policy through CLM-005 (DEP-01-04-011)
    and decides no reserved list.
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: external:OI-008
  condition: 'Met 2026-10-10: the owner''s OI-008 ruling places file and record writes, Codex interaction
    and act capture in the Rust host, with the web view presenting and sending only what the person initiates.
    UI and attachment-storage details remain open (ScopeOfWork TBD-003).'
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: external:OI-012
  condition: The App implementation owner supplies the remaining OI-012 decisions, the implementation and
    qualification pins for an identified candidate, before protocol generation and qualification. The 0.158.0
    definition pin (DECISION-1 D4) is re-examined before implementation; no historical pin is adopted.
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: external:OI-014
  condition: The App/shared contract owners must place shared contracts/components against actual consumer
    responsibilities and agree ownership before any common implementation at the structural/production allocation
    point of need.
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: external:DEP-005
  condition: Obtain the pinned suppliers' published interfaces and configured endpoints needed by the respective
    implementation/qualification witnesses; the selected supplier basis and environment remain to be defined.
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: external:Person performing the positive human-act case and separate faithful recorder
  condition: For the positive VER-005 qualification case, obtain evidence of the person actually performing
    the act on identified content and a separate recorder preserving it, with decision actor distinct from
    recorder.
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-01-03
  condition: Receive the collaboration mode (sent explicitly after plan mode was used) and the plan-mode
    element, item anchors and delegation availability supplied by App DEL-01-03 when composing the turns
    this slice sends.
  gating: true
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-01-05
  condition: 'Receive the model-selection state and the reported Codex account from App DEL-01-05: the selection
    state for showing that no model is selected until the person chooses, and the account used for the person''s
    identity at act capture.'
  gating: true
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-04-02
  condition: Receive the checkpoint overlay and standing facets defined by App DEL-04-02, which this slice
    places in the App (OUT-002).
  gating: false
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-02-03
  condition: Receive the checkpoint display meanings defined by App DEL-02-03, whose behaviour in the App
    this slice owns (OUT-002).
  gating: false
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-02-04
  condition: Receive the role list App DEL-02-04 supplies (with the registry default preselected and clearable,
    and no role allowed) for the new-conversation role offer; the role stays fixed for the conversation.
  gating: false
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-01-01
  condition: App v4 DEL-01-04 consumes this deliverable's stock supplier boundary for its own named production
    responsibility; the receiving act remains with that owner.
  gating: true
  evidence: execution/PKG-01/DEL-01-01/ScopeOfWork.md
- from: DEL-01-02
  condition: Provide state/request interfaces and observed events with explicitly unknown outcomes to the
    App-v4 DEL-01-04 receiving UI.
  gating: true
  evidence: execution/PKG-01/DEL-01-02/ScopeOfWork.md
- from: DEL-01-03
  condition: Supply this slice's plan-mode element, item anchors and delegation availability to App DEL-01-04,
    which composes turns and request cards from them.
  gating: true
  evidence: execution/PKG-01/DEL-01-03/ScopeOfWork.md
- from: DEL-02-02
  condition: Supply App v4 DEL-01-04 with this workspace's draft, registration and selection contract and,
    for turn composition, the run-start text and run-end line with their supply-check record; DEL-01-04
    declares them upstream.
  gating: false
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-02-04
  condition: App v4 DEL-01-04 receives this deliverable's role list and guidance-changed signal for its
    new-conversation role offer and declares them upstream in its own register.
  gating: false
  evidence: execution/PKG-02/DEL-02-04/ScopeOfWork.md
- from: DEL-04-01
  condition: DEL-04-01 supplies the distinction of the registration act (A15) to DEL-01-04, whose App act
    control captures it; it consumes nothing from DEL-01-04.
  gating: true
  evidence: execution/PKG-04/DEL-04-01/ScopeOfWork.md
- from: DEL-04-03
  condition: DEL-04-03 supplies the shared human-act/run-record format and meaning consumed by App DEL-01-04,
    which the source states declares it upstream in its own register.
  gating: false
  evidence: execution/PKG-04/DEL-04-03/ScopeOfWork.md

id: DEL-01-04
name: Native requests, outcomes and attachments
needs:
- from: DEL-01-01
  condition: Every server request has a register entry that can be listed and answered, with a
    refused answer reported with its reason and each settlement with its origin; native frames
    arrive unchanged; and on an installed build the result of the App's own installed-integrity
    check is available.
  gating: true
- from: DEL-01-02
  condition: The state of each conversation, its turns and its outstanding requests is reported
    after a window is lost, a Codex restart and a relaunch, with unknown outcomes stated; a live
    turn can be interrupted; live work can be listed before a quit or a Codex stop; and an opaque
    tag can be attached to a conversation and looked up.
  gating: true
- from: DEL-01-03
  condition: The plan-mode element for a turn is offered as plan, default, not offered with its
    reason, or no model selected, and a native item can be referred to by an item anchor. For a
    request card to name who asks, the host's view of a Codex process gives its descendants, each
    with its thread, its parent and, once its thread has been read, the role and nickname Codex
    reports for it.
  gating: true
- from: DEL-01-05
  condition: For a conversation, whether a model is selected, which, and the person's last explicit
    choice for the project are reported, and the Codex account is reported as Codex reports it
    or as not reported.
  gating: true
- from: DEL-02-02
  condition: A draft is named by its location and name, with the content identity of its content,
    and each change of its standing is reported; for a registration of one draft, one library entry
    or several entries, the exact reviewed content of each is named for the person's act to bind;
    and the run-start text and the run-end line for a turn are supplied.
  gating: false
- from: DEL-02-03
  condition: A run ends only by the person's explicit run end, and each arrival at a declared
    checkpoint is recorded with its bound subject, purpose and scope, with the request for the act
    where one can be identified and the act only when the person performs it.
  gating: false
- from: DEL-02-04
  condition: The conversation roles are listed with the default for a new conversation, and an
    open conversation whose guidance has since changed is reported as changed, naming the file.
  gating: false
- from: DEL-04-01
  condition: Each act kind has a name and wording, a stated actor requirement and whether a decline
    exists for it, and a proposal decision is worded "accept".
  gating: true
- from: DEL-04-02
  condition: For each arrival at a declared checkpoint the checkpoint overlay gives one
    disposition, taken from the run record's checkpoint entries, with waiting never meaning that the
    run is held; and the standing of a result is given as received and no stronger, as current or
    historical, checks passed, limitations and lapse, with missing evidence and unobserved outcomes
    explicit.
  gating: false
- from: DEL-04-03
  condition: A human act and a declined act can be written as direct-capture records that bind
    actor, recorder, content identity, scope and purpose and cite capture evidence; a record can
    be validated; and an act whose bound content changed is reported as lapsed.
    Where a project's records are read from is decided by the records store, which gives no
    location, in the store or in the project folder, while the project's link to the store is
    unresolved.
  gating: true
- from: DEL-06-02
  condition: A decision package is a project file that states the exact act requested of the
    person, its subject, purpose and basis, and each alternative with its consequences, and a
    pending package is shown as its file states them.
  gating: false
- from: DEL-01-06
  condition: The installed App is signed with the same Developer ID team and bundle identifier
    in every release, so that keychain items written by one release are readable by the next.
  gating: true
  when: Keychain protection on an installed build
- from: external:person or examining agent operating the act control
  condition: A person confirms each act in the native confirmation while an examiner observes. In
    an agent-operated journey examination as the release target defines it, the examining agent
    confirms instead the acts of VER-005 and VER-008, on examination material only; its capture is
    then a synthetic examination artifact that establishes no person's decision. The protection act
    and the confirmation of a lowered policy (VER-009) are the person's and never an agent's.

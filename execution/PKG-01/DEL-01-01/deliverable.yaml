id: DEL-01-01
name: Stock Codex hosting and supplier contract
needs:
- from: external:DEP-005
  condition: Codex 0.167.0 is published as a stock macOS arm64 distribution whose release archive
    digest the supplier publishes, with its App Server protocol and the generators that emit that
    protocol's types.
- from: external:DEP-005
  condition: A named local model server, independent of the App and importing no App code, is
    available to run the provider route against. This need does not apply to 4.0.0, because the
    owner decided on 14 November 2026 that the local model server is not offered in 4.0.0 and comes
    in a later update.
  when: Examining the provider requirement account
- from: DEL-01-05
  condition: A conversation on the candidate can be started through a configured local server, with
    the provider selection reported. This need does not apply to 4.0.0, because the owner decided on
    14 November 2026 that the local model server is not offered in 4.0.0 and comes in a later
    update.
  gating: false
  when: Examining the embedding protocol and the provider requirement account on the candidate
- from: DEL-01-05
  condition: Each App-owned Codex home exists before a child is started for it, has a stable identity
    that is neither a credential nor a filesystem path, and carries the person's settings and the
    App's start-up traffic settings the child is to start with.
  gating: true
- from: DEL-01-06
  condition: The installed package carries the supplier's vendor tree byte-equal to the published
    one, and the App's signature carries the bundle identifier and Developer ID team that the build
    compiles as its publisher identity.
  gating: true
  when: Verifying the supplier on an installed production build
- from: DEL-04-03
  condition: The run-record format has entries for a turn's model and destination, for supplied
    guidance and for tool-permission settlements, and its writer appends them.
  gating: false
code_paths:
- app/src-tauri/resources/supplier/0.167.0
- app/src-tauri/resources/hosting
- app/src-tauri/resources/distribution-reference
- app/src-tauri/resources/distribution-development-reference
- app/src-tauri/resources/distribution-successor

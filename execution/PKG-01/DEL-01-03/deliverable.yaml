id: DEL-01-03
name: Native plans, tools and delegation views
needs:
- from: DEL-01-01
  condition: Native plan, tool and delegation items reach the views unchanged with their generation
    and receipt position; each ready announcement carries the version identity record, its verification
    result and the declared capabilities; and the model list, configuration and thread reads the
    views need can be made through the boundary.
  gating: true
- from: DEL-01-02
  condition: A window that re-attaches resumes from its position or receives a snapshot and a
    gap marker; after a generation closes the conversation's state is read back from Codex; and
    the register state of an item's request is reported.
  gating: true
- from: DEL-01-05
  condition: The model and provider selected for a conversation are reported, or that none is
    selected.
  gating: true
  when: Reading delegation availability and offering the plan-mode element
- from: DEL-02-04
  condition: A thread that was given TASK guidance is identified as such, with whether its no-delegation
    limit is enforced by the supplier, stated and not enforced, or not known.
  gating: false
code_paths:
- app/src-tauri/src/native_items.rs
- app/src-tauri/src/native_history.rs
- app/src-tauri/src/delegation_availability.rs
- app/src-tauri/resources/runtime_core/npt.plan-revision.schema.json
- app/src/NativeActivity.tsx
- app/src/PlanMode.tsx
# NativeHistory.tsx is shared with DEL-01-04. Here: reading pages of native items from Codex
# history. Finding a conversation and continuing it are DEL-01-04's.
- app/src/NativeHistory.tsx
# hosting.rs, host_tick.rs, runtime_session.rs, lib.rs and App.tsx are shared. Here: the
# delegation availability reads, the view state held for a conversation, and the commands
# and mounting of these views.
- app/src-tauri/src/hosting.rs
- app/src-tauri/src/host_tick.rs
- app/src-tauri/src/runtime_session.rs
- app/src-tauri/src/lib.rs
- app/src/App.tsx
checks:
- app/src-tauri/tests/native_history.rs
- app/src-tauri/tests/history_integration.rs
- app/src-tauri/src/hosting.rs
- app/src-tauri/src/hosting_manual_history_tests.rs
- app/tests/native-activity.test.mjs
- app/tests/native-history.test.mjs
- app/tests/conversation-panel.test.mjs
- app/tests/plan-mode.test.mjs
- app/tests/request-cards.test.mjs
- app/tests/request-activity-navigation.test.mjs

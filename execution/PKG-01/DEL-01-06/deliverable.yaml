id: DEL-01-06
name: macOS packaging and distribution evidence
needs:
- from: DEL-01-01
  condition: The pin names one published Codex distribution; the expected inventory of its vendor
    tree, with the supplier source commit that distribution names, is available to the build; and an
    installed App checks its own Codex against that inventory and the compiled publisher identity
    and reports the result.
  gating: true
- from: external:chirality-app-v4:DEP-005
  condition: The supplier's public source at the commit the distribution names holds the lockfiles
    and build files that name, at exact versions and revisions, the packages and native sources its
    executables are built from, and each locked package's archive or licence file at the locked
    revision is obtainable with the owner's permission.
  when: Establishing the notices of the components inside the supplier's executables
- from: DEL-02-02
  condition: The workflows a release ships are registered by the release, each at its shipped
    revision, and a library entry counts as a shipped revision only when it is byte-equal to it.
  gating: false
- from: DEL-02-04
  condition: The default guidance documents and the role set shipped with a release have a
    maintained source, and the packaged guidance equals that source byte for byte.
  gating: false
- from: DEL-01-04
  condition: The keychain service and access group that keychain protection uses are stated, so
    that any entitlement the App's own code needs for it can be named.
  gating: true
  when: Signing a package that offers keychain protection
- from: DEL-09-01
  condition: A built candidate can be identified in a candidate identification record, and a native
    packaged-application check can be run and recorded with the package it observed.
  gating: false
- from: external:chirality-app-v4:DEP-005
  condition: The Tauri 2 bundler builds the macOS bundle, and writes the bundle's Contents/Info.plist
    as an XML property list of at most 64 KiB in the form the release tools read whole, with its five
    identity fields present as strings; a binary property list, or one outside that form, stops the
    build at its info_plist_not_read or info_plist_whole check, and a missing or mistyped identity
    field at that field's named check.
- from: external:Apple Developer ID signing and notary service
  condition: The App's own code and the disk image that carries the App are signed with the
    owner's Developer ID, and the App and the disk image are each notarised and a ticket issued
    for stapling to each.
- from: external:chirality-app-v4:DEP-004
  condition: OpenAI publishes, or gives the owner directly, its written position on distributing
    an App that uses its sign-in.
  when: Before public release beyond owner use
- from: external:owner
  condition: The owner's Developer ID certificate and notary profile are in the keychain of the
    machine that signs, and the owner states whether the supplier's position applies to the offering.
- from: external:owner
  condition: The Developer ID provisioning profile the owner supplies is the Apple-issued file, of at
    most 256 KiB, its CMS envelope read only with definite lengths and in the declared structure, as
    the release README's enforced list states, with its property list as the one primitive OCTET
    STRING under id-data, in the XML form the tools read whole, each field the tools read of its type;
    the signing run refuses at step 2 a profile outside the admitted form and names the applicable kind
    (not established, malformed or mismatch).
  when: Signing a package that embeds a provisioning profile
code_paths:
- app/packaging/**
# Font licence texts shipped beside the fonts; their index and check are under app/packaging/font_notice.
- app/src/fonts/LICENSE-*.txt
- app/src-tauri/tauri.conf.json
# The limitations list ships byte for byte as release/LIMITATIONS.md; the host reads it there.
- docs/RELEASE_LIMITATIONS_4.0.0.md
- app/src-tauri/src/release_limitations.rs
# build.rs and build_support compile the publisher identity into the App. The check that uses
# the compiled identity on an installed App is DEL-01-01's.
- app/src-tauri/build.rs
- app/src-tauri/build_support/**
checks:
- app/tests/supplier_notice_observations_test.py
- app/tests/supplier_notice_selectors_test.py
- app/tests/production_inputs_test.py
- app/tests/notice_receipts_test.py
- app/packaging/sqlite_notice/check.py
- app/tests/package_successor_test.py
- app/tests/terms_position_test.py
- app/src-tauri/tests/attested_reference_packaging.rs
- app/packaging/notices/check.py
- app/tests/notice_resources_test.py
- app/packaging/font_notice/check.py
- app/tests/font_notice_test.py
- app/packaging/notices/transitive.py
- app/tests/notice_transitive_test.py
- app/packaging/notices/package_texts.py
- app/packaging/notices/coverage.py
- app/tests/notice_coverage_test.py
- app/packaging/supplier_notices/crates.py
- app/packaging/supplier_notices/voice.py
- app/tests/supplier_crate_notices_test.py
- app/tests/group_b_packaging_test.py
- app/tests/compiled_selection_packaging_test.py
- app/packaging/seal_c/test_prepare.py
- app/packaging/static_distribution/test_connected.py
- app/tests/release_build_test.py
- app/tests/owner_release_test.py
- app/tests/release_fixtures.py
- app/tests/owner_fixtures.py
- app/tests/group_b_legacy_pkg_rules_test.py
- app/tests/release_limitations_resource_test.py

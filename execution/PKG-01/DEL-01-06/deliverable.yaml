id: DEL-01-06
name: macOS packaging and distribution evidence
needs:
- from: DEL-01-01
  condition: Packaging consumes DEL-01-01's identified stock Codex binary and App hosting basis, receiving
    S4 installed observation and signing facts under Work/INSTALLED_INTEGRITY_S4_SIGNING_JOIN.md and publisher
    input/build binding under Work/PUBLISHER_BUILD_SELECTION_JOIN.md. The compiled publisher requirement
    remains None; actual publisher selection, package record/installer binding (FP-2/W-4) and packaged qualification
    are not supplied.
  gating: true
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: external:chirality-app-v4:OI-011
  condition: Receive the OI-011 owners' definition of signing, notarisation and required Codex entitlements
    for the selected App/Codex candidate before the packaged distribution witness; OI-011 remains open.
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: external:chirality-app-v4:DEP-005
  condition: Production uses applicable selected Codex/Tauri packaging interfaces, with actual version and
    environment to be defined before respective implementation/qualification witnesses.
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: external:chirality-app-v4:DEP-004
  condition: Before public release beyond owner use, obtain through the owner an identified official supplier
    publication or direct response, retained with source/date/custody, release/sign-in scope and the owner's
    applicability disposition; OI-007 remains open and DEP-004 unconfirmed. Anthropic/Claude terms apply
    only if that sign-in need arises.
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: external:SWBPIPE
  condition: Useful reusable packaging knowledge may be received from external SWBPIPE through its actual
    human-relayed coordination route.
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: DEL-01-01
  condition: App v4 DEL-01-06 consumes this deliverable's stock supplier boundary for its own named production
    responsibility; the receiving act remains with that owner.
  gating: true
  evidence: execution/PKG-01/DEL-01-01/ScopeOfWork.md
- from: package:PKG-09
  condition: Supply the packaged App candidate and its local install/launch evidence to App PKG-09 for joined
    examination.
  direction: downstream
  gating: false
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: external:chirality-app-v4:DEP-004
  condition: The owner's public distribution decision consumes the applicable written supplier position
    (an identified official publication or direct response retained with source/date/custody, release/sign-in
    scope and owner applicability disposition); the distribution decision itself remains separate.
  direction: downstream
  gating: false
  evidence: execution/PKG-01/DEL-01-06/ScopeOfWork.md
- from: DEL-09-01
  condition: Supply reusable examination support and evidence interfaces to the named owner of DEL-01-06
    for its own scoped work.
  gating: false
  evidence: execution/PKG-09/DEL-09-01/ScopeOfWork.md

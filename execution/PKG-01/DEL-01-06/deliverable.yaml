id: DEL-01-06
name: macOS packaging and distribution evidence
needs:
- from: DEL-01-01
  condition: The pin names one published Codex distribution; the expected inventory of its vendor
    tree is available to the build; and an installed App checks its own Codex against that inventory
    and the compiled publisher identity and reports the result.
  gating: true
- from: DEL-02-02
  condition: The workflows a release ships are registered by the release, each at its shipped
    revision, and a library entry counts as a shipped revision only when it is byte-equal to it.
  gating: false
- from: DEL-02-04
  condition: The default guidance documents and the role set shipped with a release have a
    maintained source, and the packaged guidance equals that source byte for byte.
  gating: false
- from: DEL-01-04
  condition: The keychain service and access group that keychain protection uses are stated, so
    that any entitlement the App's own code needs for it can be named.
  gating: false
  when: Signing a package that offers keychain protection
- from: DEL-09-01
  condition: A built candidate can be identified in a candidate identification record, and a native
    packaged-application check can be run and recorded with the package it observed.
  gating: false
- from: external:chirality-app-v4:DEP-005
  condition: The Tauri 2 bundler builds the macOS bundle, and Apple's Developer ID signing and
    notary service sign and notarise it.
- from: external:chirality-app-v4:DEP-004
  condition: OpenAI publishes, or gives the owner directly, its written position on distributing
    an App that uses its sign-in.
  when: Before public release beyond owner use
- from: external:owner
  condition: The owner's Developer ID certificate and notary profile are in the keychain of the
    machine that signs, and the owner states whether the supplier's position applies to the offering.
code_paths:
- app/packaging/**
- app/src-tauri/tauri.conf.json
# build.rs and build_support compile the publisher identity into the App. The check that uses
# the compiled identity on an installed App is DEL-01-01's.
- app/src-tauri/build.rs
- app/src-tauri/build_support/**
checks:
- app/tests/supplier_notice_observations_test.py
- app/tests/production_inputs_test.py
- app/tests/notice_receipts_test.py
- app/packaging/sqlite_notice/check.py
- app/tests/package_successor_test.py
- app/tests/terms_position_test.py
- app/src-tauri/tests/attested_reference_packaging.rs
- app/packaging/notices/check.py
- app/tests/notice_resources_test.py
- app/packaging/font_notice/check.py
- app/tests/font_notice_test.py
- app/packaging/notices/transitive.py
- app/tests/notice_transitive_test.py
- app/tests/group_b_packaging_test.py
- app/tests/compiled_selection_packaging_test.py
- app/packaging/seal_c/test_prepare.py
- app/packaging/static_distribution/test_connected.py
- app/tests/group_b_legacy_pkg_rules_test.py

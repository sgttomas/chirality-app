id: DEL-08-01
name: Domains query, admission and freshness contract
needs:
- from: DEL-07-02
  condition: Connector standing has a published form with an envelope, a condition and a claim tier and
    a reason for each; with no response the condition is absent and the envelope and tier are unknown;
    and reliance is supported only by an adopted envelope, a current condition and the connector's reliable
    tier, which for Domains is admitted.
  gating: true
- from: DEL-07-02
  condition: With Domains material absent, stale or not admitted, the App shows the limitation and gives
    the source-file route for the affected question, whatever the state of PEC.
  gating: false
- from: DEL-05-01
  condition: The host-loop receiving contract has a host's agent send data only to the model service the
    person selected and to destinations the person has allowed, records and shows every destination contacted,
    and has cases for an allowed, a requested and a disallowed destination.
  gating: true
- from: external:DEP-003
  condition: A Domains query tool answers a research question under an identified query contract with
    located source passages, each carrying its source reference, the revision indexed and its admission
    state, and an admitting party supplies the admission basis naming each admitted source, its revision
    and its intended use.
  when: Before fixtures are prepared on admitted test sources and before any result is relied on as research
    context. Who builds the provider and who admits sources are unallocated.
code_paths: []
# The two receiving-record fixtures sit in DEL-08-02's folder and are this deliverable's product:
# records in its format. DEL-08-02 reads them through its need and does not list them.
checks: []

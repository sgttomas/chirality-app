id: DEL-08-02
name: Later research-to-design receiving activity
needs:
- from: DEL-08-01
  condition: A Domains receiving record has an identity and gives each result an identity, its source
    reference, its indexed and current revisions, its admission state and a standing that says whether
    it supports reliance; no response is recorded as absent with no results; and fixtures cover an admitted
    current source, a located source that is not admitted, a stale source and no response.
  gating: true
- from: DEL-02-01
  condition: A workflow package's declared part states its expected inputs, required tools, checkpoints,
    returned outputs and returned evidence, each required tool is a host operation or a harness capability,
    and a reader reports what a package declares.
  gating: true
- from: DEL-04-01
  condition: Each act kind has one name and a stated performer, evidence of one kind never establishes
    another, a request is never the act, and a record that names its recorder as the decision actor is
    not conformant.
  gating: true
- from: DEL-04-03
  condition: An act record carries the person who decided apart from the recorder, the subject's content
    identity with the method that produced it and the capture evidence, and shows the act as lapsed when
    the bound content changes.
  gating: false
- from: external:DEP-003
  condition: A Domains query tool answers under an identified query contract over admitted test sources,
    and can be made unavailable, return a hit that is not admitted and return a source revised after it
    was indexed.
  when: Before the witness of the joined activity. Who builds the provider and who admits sources are
    unallocated.
- from: external:SWBPIPE
  condition: The host's agent calls the Domains query tool through a research workflow, the host gives
    each candidate a content identity, presents the candidate to the person and captures the person's
    decision with an evidence reference, and its owner answers the handoff's questions.
  when: Before the witness of the joined activity.
code_paths:
- app/contract_inputs/PKG-08/DEL-08-02/Work/research.context-account.schema.json
checks:
- app/contract_inputs/PKG-08/DEL-08-02/Work/prototype/check_rtd.py

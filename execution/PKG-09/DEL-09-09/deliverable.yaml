id: DEL-09-09
name: External control and catalog-extension trace
needs:
- from: DEL-03-01
  condition: The catalog states each operation's meaning and read basis, and a map names, for each
    surface, what is generated from the catalog and what adapter work a new operation takes.
  gating: false
- from: DEL-03-02
  condition: A proposal is bound to its read basis, is refused with a reason when stale, stays queued
    until the host records acceptance and application, and a repeated submission has one effect.
  gating: false
- from: DEL-03-03
  condition: The App's Codex can inspect host content and submit a proposal over the machine-local
    interface the host selected, makes no host request while access is not enabled, and reports
    a disabled or unavailable channel as such.
  gating: false
- from: DEL-04-01
  condition: The operation policy names the acts reserved to a person, including enabling external
    access, and applies the same to every channel.
  gating: true
- from: DEL-04-02
  condition: The grant in force for a run is displayed in states the three channels can be compared
    on.
  gating: false
- from: DEL-04-03
  condition: An acceptance read from the host is recorded with actor, recorder, bound content, scope
    and purpose, and is shown as lapsed when its content changes.
  gating: false
- from: DEL-05-01
  condition: The embedded-loop requirements state how an embedded tool reaches a catalog operation,
    so the embedded channel can be compared with the other two.
  gating: false
- from: DEL-02-03
  condition: A compatibility report states, for each surface, whether a workflow's required tools
    and checkpoints are supported.
  gating: false
- from: DEL-09-01
  condition: Result records bind candidate, harness, model and model-server configuration and date
    with one of five outcomes, keep definition, replay, live and native evidence apart, and refuse
    a rehearsal record as a case result.
  gating: true
- from: external:DEP-001
  condition: SWBPIPE provides an identified host candidate with its external interface, a facility
    by which the person enables that interface and which returns a capture-evidence reference, its
    views with old and new values, origins and receipts, and the fixture set-up and reset the cases
    need.
  when: Before any live case.
- from: external:person and engineer
  condition: The person enables external access on the host, and the engineer accepts the submitted
    proposal in SWBPIPE while the examiner observes.
- from: external:owner hold on SWBPIPE joins
  condition: The owner resumes SWBPIPE UI-SUCCESSOR work.
  when: Before any live case.
- from: external:OI-003
  condition: The owner, with the host contract owner, decides whether the catalog-extension promise
    is retained, narrowed or deferred.
  when: Before the extension criterion is verified.
- from: external:OI-021
  condition: The owner chooses the operation, the autonomy permitted and the candidate environment
    of the first connected activity.
  when: Before any live case.
- from: external:OI-003
  condition: The trace of one new operation and the work account go to the owner and the host contract
    owner as evidence for the extension decision.
  direction: downstream
  gating: false
code_paths:
- app/src-tauri/src/external_trace.rs
- app/src-tauri/src/trace_receiving.rs
- app/src-tauri/resources/external_trace/manifest.json
- app/src-tauri/resources/external_trace/own-code-inputs.json
- app/src-tauri/resources/external_trace/xt-*
- app/src-tauri/resources/external_trace/receiving/**
- app/src-tauri/resources/external_trace/regressions/**
checks:
- app/src-tauri/tests/external_trace.rs
- app/src-tauri/tests/trace_receiving.rs
- app/src-tauri/tests/trace_integration.rs

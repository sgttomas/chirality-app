id: DEL-09-12
name: Practitioner validation and feedback disposition
needs:
- from: DEL-01-06
  condition: An installable macOS package of an identified App candidate exists for the owner to use.
  gating: true
- from: DEL-04-01
  condition: The operation policy names the acts reserved to a person, so an owner's act in use is
    recorded as that act and a routine permission is not.
  gating: true
- from: DEL-09-01
  condition: A candidate identification record names the build the owner used, and verification records
    are marked apart from validation.
  gating: true
- from: DEL-10-02
  condition: Each practice note brought to a stage or selected-method discussion traces to the owner's
    actual disposition, with its actor and scope, or is shown as pending.
  when: After a method observation from validation in use has been routed to DEL-10-02 as a practice
    note; its disposition completes that observation's entry in the feedback dispositions.
  gating: false
- from: external:OI-016
  condition: The owner chooses the work and the period of their use at the time; neither is fixed
    in advance.
  when: Before any use counts as validation.
- from: external:owner as practitioner
  condition: The owner does the chosen work in the Chirality App and reports what they observed;
    the owner's work in SWBPIPE is held outside 4.0.0.
- from: external:DEP-001
  condition: SWBPIPE provides an identified host candidate the owner can do the chosen work in.
  when: Before validation in SWBPIPE.
- from: external:OI-021
  condition: The owner chooses the operation, the autonomy permitted and the candidate environment
    of the first connected activity.
  when: Before validation of a connected activity.
code_paths: []
checks: []

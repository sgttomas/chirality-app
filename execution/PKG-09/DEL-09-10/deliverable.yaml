id: DEL-09-10
name: Optional connector consumption witness
needs:
- from: DEL-07-02
  condition: With a connector feed limited, stale, partial, failing or absent, the App shows the feed's
    coverage, freshness and limits, marks the conclusions it does not support, and offers the source-file
    route; each connector's availability is handled independently, including PEC absent with a stale
    Domains index.
  gating: true
- from: DEL-08-01
  condition: The Domains query, admission and freshness contract has fixtures for an unavailable source
    and for an index older than its sources.
  gating: true
- from: DEL-09-01
  condition: Result records bind candidate, configuration and date, allow a part to be declared not
    applicable before the run, and keep replay, browser and native evidence apart.
  gating: true
- from: external:receiving consumer and connector provider
  condition: The provider has released the connector with its qualification evidence, and the receiving
    consumer has recorded its adoption for a stated coverage.
  when: Only for a connector the receiving consumer has adopted.
code_paths: []
checks: []

id: DEL-09-06
name: Connected activity contract and workflow round trip
needs:
- from: DEL-01-01
  condition: For each thread and turn, the guidance actually carried to the supplier is observed by
    content identity, with the model and destination the supplier reported, and handed with its origin
    to the record writer; a destination reported for a thread is not attributed to a turn no report
    names.
  gating: true
- from: DEL-02-01
  condition: A workflow carries a portable declared part (expected inputs, required host tools, checkpoints
    requiring a human act, returned outputs and evidence) with its prose method, a source-qualified
    identity and its revision across App and host receiving.
  gating: true
- from: DEL-02-02
  condition: A workflow received or refined in the App stays a draft until the person's reviewed,
    explicit registration, and a same-name entry from another origin is never silently rebound.
  gating: true
- from: DEL-02-03
  condition: A workflow carried from the App to a host arrives with the same identity, revision and
    bytes and a trace telling apart what was selected, resolved, supplied, adopted and observed;
    an adaptation has a new identity derived from the original; a host-origin workflow is opened
    in the App with its origin and revision unchanged and refined as a draft; a host that cannot
    receive a declared element produces an explicit unsupported result; and a checkpoint's act is
    recorded only when performed, with a hold only in the governance phase.
  gating: true
- from: DEL-03-01
  condition: The catalog states each operation's meaning and read basis in a form the App and a host
    can both read.
  gating: true
- from: DEL-03-02
  condition: A proposal is validated and applied through one route, a stale proposal is refused after
    an intervening edit, and each application has one outcome with its receipt.
  gating: true
- from: DEL-03-03
  condition: Over the external channel the App can inspect host content and submit a proposal, and
    a disabled channel is reported as disabled.
  gating: true
- from: DEL-04-01
  condition: The operation policy names the acts reserved to a person and the values an operation
    class may take.
  gating: true
- from: DEL-04-02
  condition: The autonomy granted for a run is visible by operation class, and a directly applied
    operation shows its origin mark and the undo route the host supplies.
  gating: true
- from: DEL-04-03
  condition: Act and run records bind each act to actor, content, scope and purpose, keep an earlier
    act in the history when its content changes, and show its standing as lapsed; and a run record
    holds the model used with its observed destination for each turn.
  gating: true
- from: DEL-05-01
  condition: The loop states which model serves a turn and records the destination each turn's content
    went to.
  gating: true
- from: DEL-05-02
  condition: The panel shows proposed rows with old and new values in the host's own tables.
  gating: true
- from: DEL-09-01
  condition: Result records bind candidate, harness, model and model-server configuration and date
    with one of five outcomes, mark replay apart from live observation and native apart from browser
    evidence, and refuse a record with a missing product input as a pass or failure and a rehearsal
    record as a case result.
  gating: true
- from: external:DEP-001
  condition: SWBPIPE delivers its catalog source and schema at an identified revision, provides
    an identified host candidate that can receive an App workflow, run the first activity and return
    its own receipts, and states the operation policy that candidate has adopted (its reserved list,
    its routine-permission treatment and its default for model changes).
  when: The catalog before catalog receiving; the candidate and its adopted policy before any round-trip
    case.
- from: external:OI-021
  condition: The owner, through the SWBPIPE session and with the App owner, chooses the operation,
    the autonomy permitted, the candidate environment and the externally supplied interfaces of the
    first activity, and any addition
    to the reserved acts or routine-permission treatment that operation needs.
  when: Before the activity definition is closed and before any round-trip case is run.
- from: external:person performing the checkpoint act
  condition: A person performs the declared checkpoint act and the acceptance in the round trip while
    the examiner observes.
- from: external:DEP-001
  condition: Through the human, the App relays its questions and the reviewed workflow to the SWBPIPE
    session.
  direction: downstream
  gating: false
code_paths:
- app/supplier_checks/swbpipe_catalog_receiving.py
- app/supplier_checks/swbpipe_catalog_v4_receiving.py
- app/supplier_checks/swbpipe_catalog_v4_pr30_receiving.py
- app/supplier_checks/swbpipe_catalog_v4_pr40_receiving.py
- app/supplier_checks/swbpipe_hash_receiving.py
- app/supplier_checks/swbpipe_projection.py
- app/supplier_checks/swbpipe_projection_v4.py
checks:
- app/supplier_checks/swbpipe_receiving_test.py
- app/supplier_checks/swbpipe_receiving_v4_test.py
- app/supplier_checks/swbpipe_receiving_v4_pr30_test.py
- app/supplier_checks/swbpipe_hash_receiving_test.py
- app/supplier_checks/swbpipe_projection_test.py

id: DEL-09-01
name: Candidate examination infrastructure and evidence protocol
needs:
- from: DEL-01-01
  condition: Exchanges recorded from the stock supplier exist, each naming the supplier pin it was
    captured at, and a built candidate names the pin it was built with.
  gating: true
- from: DEL-01-06
  condition: Each targeted macOS package has an identity record linking the package to its App source
    revision, build identity and stock Codex binary (supplier pin).
  gating: false
  when: Before a result on the installed package route is relied on.
- from: external:independent reviewer
  condition: A reviewer separate from the candidate's author returns a review that names the candidate
    it examined and the model identities the host exposed.
- from: external:person performing a recorded act
  condition: A person actually performs an act whose subject and scope are evidenced, so that a record
    of it can be compared with the act; no human act is invented for a fixture.
  when: Before the record checks are relied on to show faithful recording of a performed act.
- from: external:browser engines
  condition: WebKit and Chromium engines are installed for the interface runner, with their versions
    readable.
code_paths:
- app/examination/check.py
- app/examination/rules.py
- app/examination/repin.py
- app/examination/admission/**
- app/examination/candidate_identity/**
- app/examination/support_identity/**
- app/examination/package_receiving/**
- app/examination/distribution_receiving/**
- app/examination/runner_support/**
- app/src-tauri/resources/external_trace/exam.result-record.*
checks:
- app/tests/group_b_support_test.py
- app/tests/group_b_admission_test.py
- app/tests/group_b_support_identity_test.py
- app/tests/group_b_support_identity_canonical_test.py
- app/tests/group_b_distribution_receiving_test.py
- app/tests/group_b_terminal_receiving_test.py
- app/tests/group_b_runner_test.mjs
- app/tests/candidate_identity_test.py
- app/tests/examination_repin_test.py

id: DEL-09-11
name: Later run reconstruction witness
needs:
- from: DEL-04-03
  condition: A run record carries workflow identity and version, conversation, model, autonomy settings,
    requested operations, observed outcomes and references to host receipts; an act record carries
    actor, recorder, bound content, scope and purpose; and an act is shown as lapsed when its content
    changes.
  gating: true
- from: DEL-04-01
  condition: The operation policy keeps accepting an edit, checking, engineering approval and professional
    reliance as distinct acts, so a record of one is not read as another.
  gating: false
- from: DEL-09-07
  condition: One V4-EXM-20 journey has run on identified candidates, and its dossier names the journey's
    date, everyone who took part in it, and the host receipt references for each change.
  gating: true
- from: DEL-09-01
  condition: Result records bind candidate, harness, model and model-server configuration and date
    with one of five outcomes, and distinguish blocked from not run.
  gating: true
- from: external:DEP-001
  condition: SWBPIPE keeps the receipts, hashes and origin marks of the source journey resolvable after
    the session that produced them has ended, and writes, for the source journey, a run record with
    the host project in the shared format that names the actor of each human act.
- from: external:separate reader
  condition: A named person or agent who took no part in the source journey reads the input set a week
    after it and returns an account.
code_paths: []
checks:
- app/contract_inputs/PKG-09/DEL-09-11/Work/prototype/run_standing_check.py
- app/contract_inputs/PKG-09/DEL-09-11/Work/prototype/rrm_compare.py

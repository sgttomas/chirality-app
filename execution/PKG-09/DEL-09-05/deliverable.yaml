id: DEL-09-05
name: Fleet coordination and longer-work recovery witness
needs:
- from: DEL-06-01
  condition: A brief carries purpose, basis, context, authority and tools, write scope and expected
    return; the work graph and coordination records are files; an observed native child is recorded
    with the identities Codex reported and its association, which is a brief referenced with its
    content identity, a brief referenced whose content does not match the reference, a brief
    reference not resolved, or no brief reference; and after
    a changed basis and an interruption the records still give ownership, returns awaiting review
    and continuation.
  gating: true
- from: DEL-06-02
  condition: The return, waiting and decision views are rebuilt from the records across sessions
    and show each wait with its cause; a decision package shows the exact act, its subject and basis,
    alternatives and consequences, and stays pending until a recorded act of the person decides it.
  gating: true
- from: DEL-01-03
  condition: The native views show each delegated child's identity and activity, including a child
    still active after its parent's turn has ended.
  gating: true
- from: DEL-01-04
  condition: The App act control is offered on a decision package for the decide act, choosing one
    alternative the package names; only the person's native confirmation captures, and content changed
    after the offer captures nothing; and each capture yields capture evidence and a record with
    the person's identity marked not verified.
  gating: true
- from: DEL-04-01
  condition: The operation policy names the acts reserved to a person and keeps them apart from routine
    tool permission.
  gating: true
- from: DEL-04-03
  condition: A decision record binds the act to its actor, recorder, package content identity and
    chosen alternative, cites resolvable capture evidence, and is shown as lapsed when the bound
    content changes.
  gating: true
- from: DEL-09-01
  condition: Result and review records have formats and checks that refuse a pass without a candidate,
    and a part that needs native evidence passes only on a native route.
  gating: true
- from: DEL-09-02
  condition: A native-step form exists on which the examiner records each step operated on the
    candidate, with who operated it and by what means.
  gating: true
- from: external:computer-use ability of the examining agent's harness
  condition: The examining agent can operate the candidate's shipped controls, including the act
    control, as a user would, through the computer-use ability native to its harness.
- from: external:DEP-005
  condition: The stock supplier is available at the pin the candidate was built with, with native
    delegation events readable.
- from: DEL-02-04
  condition: The guidance the App supplies to a conversation whose role may delegate has the agent
    write each brief, the work graph and its selector, returns, reviews, integrations and the decision
    package as files, and name each brief in the spawn prompt, so that the two delegations of the
    fixture appear on the graph from the person's use of the App alone; no shipped guidance says
    so yet.
  gating: true
code_paths: []
checks: []

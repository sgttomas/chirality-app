id: DEL-09-02
name: Standalone App candidate qualification
needs:
- from: DEL-01-01
  condition: The candidate hosts the stock supplier at one identified pin, and recorded exchanges
    captured at that pin are available for seam replay.
  gating: true
- from: DEL-01-02
  condition: Work and outstanding requests survive loss of the window; a stop interrupts the turn;
    a grant or denial settles its request; after a confirmed quit and relaunch the person can continue
    the conversation and see prior events, with turns interrupted by the quit and requests pending
    at the stop shown as such, and an unavailable outcome shown as unknown.
  gating: true
- from: DEL-01-03
  condition: The native views show a plan and its revisions, each tool outcome, and delegated children
    with their own state.
  gating: true
- from: DEL-01-04
  condition: Each request is shown with its outcome, and the act control captures an act a person
    performs and shows an unperformed act as not performed.
  gating: true
- from: DEL-01-05
  condition: ChatGPT sign-in and a local model server can be configured together, each can be chosen
    per conversation, and a new conversation has no model selected until the person chooses.
  gating: true
- from: DEL-01-06
  condition: An installable macOS package of the identified candidate exists with its package identity
    record and an install-and-launch observation.
  gating: true
  when: Before the native packaged witness.
- from: DEL-02-01
  condition: A workflow carries a declared part (inputs, tools, human checkpoints, outputs, evidence)
    and a source-qualified identity.
  gating: true
- from: DEL-02-02
  condition: Through the App alone a person can create, trial, review, register, reuse and refine
    a workflow, can carry out J1 with real execution, and can carry out J2 as one sequence across
    two sessions, no step requiring an agent to operate or explain an App control; changed material
    stays a draft until reviewed registration, a same-name entry from another origin neither overwrites
    nor rebinds a selection, and a saved workflow runs in a later session on new inputs under the
    person's workflow approval policy with the same source and revision.
  gating: true
- from: DEL-02-03
  condition: A human checkpoint in a workflow run is recorded only when the person performs it, and
    each act keeps its own meaning.
  gating: true
- from: DEL-04-01
  condition: The operation policy names the acts reserved to a person and keeps them apart from routine
    tool permission.
  gating: true
- from: DEL-04-03
  condition: Act and run records bind each act to its actor, content, scope and purpose, record a
    performed act faithfully with the actor distinct from the recorder, and show an unknown outcome
    as unknown.
  gating: true
- from: DEL-09-01
  condition: Result, review and change-impact records and the candidate identification record have
    formats and checks that refuse a record with a missing input or a mislabelled route, and a part
    that needs native evidence passes only on a native route.
  gating: true
- from: external:person operating the candidate
  condition: A person operates the candidate and performs the reviews, registrations, request
    answers, quit confirmation and sign-in that the journeys contain.
- from: external:OI-011
  condition: Signing, notarisation and supplier entitlements of the packaged candidate are decided
    by the App implementation owner with the SWBPIPE owner.
  when: Before the packaged distribution witness.
- from: external:DEP-005
  condition: The stock supplier's published protocol, a ChatGPT account, and a local model server
    presenting a compliant endpoint with its credential are available in the versions the candidate
    was built and configured for.
code_paths:
- app/examination/standalone/**
- app/examination/native_forms/**
- app/examination/sq_receiving/**
- app/examination/native_support/**
checks:
- app/examination/native_support/test_*.py
- app/tests/group_b_standalone_test.py
- app/tests/group_b_pre_run_inputs_test.py
- app/tests/group_b_native_forms_test.py
- app/tests/group_b_sq_receiving_test.py
- app/tests/group_b_sq_dossier_rules_test.py
- app/tests/group_b_package_successor_test.py
- app/tests/group_b_fixture_tools_test.py
- app/tests/group_b_fixture_preflight.py
- app/tests/group_b_fixture_consumer.rs

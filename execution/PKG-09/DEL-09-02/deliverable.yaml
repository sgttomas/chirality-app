id: DEL-09-02
name: Standalone App candidate qualification
needs:
- from: DEL-01-01
  condition: Receive supplier hosting/protocol contribution and scoped feature checks from DEL-01-01 before
    the relevant joined native/protocol witness; actual selected supplier identity must apply.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-01-02
  condition: Receive durable execution/request recovery contribution and focused recovery checks from DEL-01-02
    before V4-EXM-11 recovery observations on the same candidate; provider/rendered and settlement/acknowledgment
    distinctions stay explicit.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-01-03
  condition: Receive native planning/tool/delegation-view contribution and scoped feature checks from DEL-01-03
    before V4-EXM-10 native plan/revision and substantive tool observations.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-01-04
  condition: Receive native interaction-view contribution and scoped request/outcome checks from DEL-01-04
    before the joined request/grant/denial witness; outstanding requests and truthful outcomes require actual
    evidence.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-01-05
  condition: Before V4-EXM-12 (ChatGPT sign-in, API key and a local server configured concurrently, one
    conversation using each), receive DEL-01-05's identified account/provider inputs and focused native
    sign-in/concurrent-mode checks; a missing usable mode is an input gap or observed failure.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-01-06
  condition: Documentary terms receiving selects the explicit v3-terms successor for approved PK-R4/section
    9 without changing historical support or inferring release. Receive DEL-01-06's packaged candidate input
    and packaging evidence before the native packaged witness; signing/notarisation/entitlement disposition
    remains open under OI-011, and OI-007 public-release terms do not gate owner-use qualification.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-02-01
  condition: Receive workflow declarations and scoped feature evidence from DEL-02-01 before V4-EXM-10 declared
    inputs/tools/checkpoints/outputs/evidence and source-qualified identity examination.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-02-02
  condition: Receive complete workflow-making contribution and focused workflow evidence from DEL-02-02
    before the joined create/trial/review/register/reuse/refine witness; focused evidence does not substitute
    for the actual joined run.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-02-03
  condition: Receive capability/checkpoint execution contribution and scoped feature evidence from DEL-02-03
    before the joined workflow/checkpoint witness with each act retaining its separate meaning.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-04-01
  condition: Before the affected policy examination, receive DEL-04-01's adopted operation-policy representation
    and scoped feature evidence, carrying the first-increment D2/D3 rulings (ScopeOfWork TBD-001); only
    unruled operation-specific additions defer under OI-021, and actual-human-act, false-attribution and
    explicit-registration criteria apply.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-04-03
  condition: Receive content-bound act/run record contribution and scoped feature evidence from DEL-04-03
    before the positive actual-human-act and pending/unperformed-act witnesses, bound to actor/content/scope/purpose.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-09-01
  condition: Receive current reusable examination support and evidence protocol from DEL-09-01 before candidate/configuration/date
    outcome capture, native/browser distinction and independent examination; no second record protocol or
    prior component-pass substitution.
  gating: true
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: unknown
  condition: The respective executable witness requires the identified actual App candidate and applicable
    contributions; bind candidate revision/build, harness/model/server configuration and observation date,
    keeping all three named scenarios on the same candidate.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:Person performing the observed human act
  condition: The positive faithful-recording witness requires a person actually to perform the observed
    act; review, registration, grant and denial retain separate actors, content, scope, purpose and evidence.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:OI-021
  condition: Obtain a decision only for operation-specific additions to the adopted first-increment D2/D3
    policy, from the owner via the outside SWB session and the App/shared owner, before the connected-activity
    SoW and its affected contracts or examination criteria; only the dependent unruled criterion defers,
    and OI-001/OI-002 choices are not reopened.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:OI-008
  condition: 'Met 2026-10-10: the owner''s OI-008 ruling places file and record writes, Codex interaction
    and act capture in the Rust host and limits the web view to presentation and person-initiated sends,
    preserving main-process session/request ownership; qualification uses this disposition.'
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:OI-009
  condition: Before account integration, consume the owner and App implementation owner's separated-versus-shared
    Codex account-state disposition (OI-009, open); qualification does not assume the v3 overlay.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:OI-010
  condition: Obtain the App implementation owner's supported pinned-protocol account-behavior determination
    before the dependent API-key qualification witness; three access modes remain required.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:OI-011
  condition: Obtain the App implementation owner and SWB owner's signing/notarisation/Codex-entitlement
    disposition (OI-011, open) before the packaged distribution witness; packaging evidence arrives through
    DEL-01-06.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:OI-012
  condition: Receive DEL-01-01's development and generated-reference basis, reviewed SUP1 0.160.0 (its ScopeOfWork
    [S], CLM-003, REQ-006, TBD-002; local TBD-003), and bind the qualification pin to the actual candidate
    at build time under R23-22. Qualified distribution identity and App qualification remain owed; historical
    observations keep their pin.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: external:DEP-005
  condition: Receive the published stock protocol, packaging interfaces and compliant configured endpoints
    before their respective implementation/qualification witnesses; an actual usable mode and identified
    applicable version/configuration must exist for its witness.
  evidence: execution/PKG-09/DEL-09-02/ScopeOfWork.md
- from: DEL-01-01
  condition: App v4 DEL-09-02 receives the hosting/protocol contribution and scoped feature checks from
    this supplier boundary before its joined native/protocol witness; its acts are not transferred here.
  gating: true
  evidence: execution/PKG-01/DEL-01-01/ScopeOfWork.md
- from: DEL-01-02
  condition: Hand the durable execution/request-recovery contribution to App v4 DEL-09-02 for its recovery
    witness; the witness and its observations stay with DEL-09-02.
  gating: true
  evidence: execution/PKG-01/DEL-01-02/ScopeOfWork.md
- from: DEL-01-03
  condition: Hand this slice's native plan/tool/delegation views and focused checks to App DEL-09-02 before
    its witness; the witness stays with DEL-09-02.
  gating: true
  evidence: execution/PKG-01/DEL-01-03/ScopeOfWork.md
- from: DEL-01-04
  condition: Hand this slice's native interaction view and scoped request/outcome checks to App DEL-09-02
    before its joined request witness; the witness stays with DEL-09-02.
  gating: true
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-01-05
  condition: Hand the account/provider inputs and the focused sign-in and concurrent-mode checks to App
    DEL-09-02 for V4-EXM-12; the witness stays with DEL-09-02.
  gating: true
  evidence: execution/PKG-01/DEL-01-05/ScopeOfWork.md
- from: DEL-02-01
  condition: App v4 DEL-09-02 receives this portable workflow/role/checkpoint contract and shared allocation
    and declares it upstream in its own register; its acts are not transferred here.
  gating: true
  evidence: execution/PKG-02/DEL-02-01/ScopeOfWork.md
- from: DEL-02-02
  condition: Supply candidate-bound local workflow fixture results, focused evidence and remaining receiving
    limits to DEL-09-02 for independent joined standalone candidate qualification.
  gating: true
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-02-03
  condition: App v4 DEL-09-02 receives this slice's report, recording meanings and transfer contract and
    declares it upstream in its own register; its acts are not transferred here.
  gating: true
  evidence: execution/PKG-02/DEL-02-03/ScopeOfWork.md
- from: DEL-04-03
  condition: DEL-04-03 supplies the shared human-act/run-record format and meaning consumed by App DEL-09-02,
    which the source states declares it upstream in its own register.
  gating: true
  evidence: execution/PKG-04/DEL-04-03/ScopeOfWork.md
- from: DEL-09-01
  condition: Supply reusable examination support and evidence interfaces to the named owner of DEL-09-02
    for its own scoped work.
  gating: true
  evidence: execution/PKG-09/DEL-09-01/ScopeOfWork.md

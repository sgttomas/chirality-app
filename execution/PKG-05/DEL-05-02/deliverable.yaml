id: DEL-05-02
name: Host panel and shared interaction receiving
needs:
- from: DEL-05-01
  condition: The loop reports each message, each tool call received, rejected or dispatched with its
    outcome, each checkpoint arrival, relayed act and destination event as an event with its subject,
    actor, reporter and evidence, never itself a human act, and closes a destination request still
    unanswered when its turn fails with the cause "turn failed" and no grant.
  gating: false
- from: DEL-02-01
  condition: A workflow has a source-qualified identity with its holding library, each declared checkpoint
    names its required act, subject, purpose and scope, and each required tool has one of the named
    requirement outcomes with its necessity, so that selection can show them.
  gating: false
- from: DEL-02-03
  condition: A checkpoint arrival, the request for its act and the act are recorded as separate facts,
    the act only when the person performs it; in the current phase nothing is recorded as held.
  gating: false
- from: DEL-03-01
  condition: A read result carries its operation, catalog edition, basis, views and standing (current
    or historical, checks passed, known limitations) and is tied to the host that produced it, so
    that what a panel carries can be compared with the host's own table.
  gating: false
- from: DEL-03-02
  condition: A proposal's state carries, for each change item, the objects affected, the old and new
    values, the reason and its own disposition; a submission reports queued until the host records
    acceptance and application; and a host's refusal is never a person's rejection.
  gating: false
- from: DEL-04-01
  condition: Each act kind has one name, edit acceptance is labelled "accept" and never "approve", the
    acts reserved to the person are named, and a host has no classifier permission mode.
  gating: true
- from: DEL-04-02
  condition: A grant is shown in one of the named display states for each operation class and scope,
    and a host agent's destination settings, requests and destinations contacted have a defined display,
    kept apart from operation-class grants.
  gating: false
- from: DEL-04-03
  condition: A recorded human act carries its kind, decision actor, recorder, whether it was captured
    directly or recorded faithfully, its bound content and its lapse state.
  gating: false
- from: external:DEP-001
  condition: SWBPIPE supplies an identified host candidate with its panel, its tables and views, its
    proposal and check displays, stable references to positions in those views and, for the faithful-recording
    case, its capture record of an act a person actually performed.
  when: Before a case is executed on that host or conformance is stated for it.
- from: external:OI-013
  condition: The shared contract owner and the SWBPIPE implementation owner agree the boundary between
    host and common construction for the panel and choose how the panel is assembled.
  when: Before a shared or host implementation boundary is fixed.
- from: external:OI-014
  condition: The App/shared contract owners, with the consumers, agree the repeated purpose, ownership
    and placement of any common panel component.
  when: Before a component is built.
- from: external:OI-021
  condition: The owner chooses the operation, the autonomy permitted and the candidate environment
    of the first connected activity, and rules any operation-specific reserved act.
  when: Before a live joined examination.
code_paths:
# receiving.rs is shared with DEL-05-01. Here: receiving a panel's return input and the
# panel-to-host-table comparison. Tool calls, the model choice and destination requests
# are DEL-05-01's. The schema registry in catalog.rs is DEL-03-01's.
- app/src-tauri/src/receiving.rs
# The schema of a panel's return input.
- app/src-tauri/resources/catalog_adapter/PANEL_RETURN_INPUT.*
checks:
# Here: what a panel shows for a destination prompt closed by its turn's failure.
# catalog_adapter.rs is one check file shared with DEL-03-01, DEL-03-02, DEL-03-03, DEL-05-01.
# Here: the cases on panel receiving of a return input and the missing host evidence.
- app/src-tauri/tests/catalog_adapter.rs

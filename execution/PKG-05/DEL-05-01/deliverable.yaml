id: DEL-05-01
name: Minimal-loop and model receiving contract
needs:
- from: DEL-03-01
  condition: A catalog edition names its host and edition, and each entry declares its operation identity
    and version, its class, its exposure on the embedded surface and, for each argument, its name,
    whether it is required and a schema a received value can be checked against, including the
    choices of an enumeration and the form of a structured argument; an entry that reaches a network
    destination carries its external-contact declaration, and the catalog carries the destination-request
    entry and the results for a destination that is not allowed. The shared fixture catalogue supplies
    a conforming catalog to run cases on.
  gating: false
- from: DEL-03-02
  condition: A host outcome names one of the defined item states or refusals, a submission reports
    queued until the host records acceptance and application, a host's refusal is never a person's
    rejection, and an outcome that was not observed is reported as unknown.
  gating: false
- from: DEL-02-01
  condition: A workflow has a source-qualified identity with its holding library, and each declared
    checkpoint names one required act, when it is reached, its subject class, its purpose and its
    scope, so that a loop can associate a run and recognise an arrival.
  gating: false
- from: DEL-02-03
  condition: A checkpoint arrival, the request for its act and the act are recorded as separate facts,
    the act only when the person performs it; in the current phase nothing holds the run, and the
    hold a governance-phase workflow needs is defined for a loop to realise.
  gating: false
- from: DEL-04-01
  condition: Each act kind has one name and a stated performer, the acts reserved to the person
    are named, every catalog operation has one class value, and the route's treatment for a class
    and grant is defined, so that loop events and cases can keep the acts apart.
  gating: true
- from: DEL-04-02
  condition: Each settings version has its own identity and gives, for each operation class, the grant
    value, display state and scope and, for a host's agent, the destination settings, so that a dispatch
    can cite the settings it was made under.
  gating: false
- from: DEL-04-03
  condition: The run-record format has an entry for each destination contacted with the grant or list
    entry that allowed it, for each destination request, grant, decline and refusal, for a request
    closed unanswered with its cause and turn binding, and for an operation rejected before the host's
    validation with its kind.
  gating: false
- from: DEL-05-02
  condition: The panel contract names, for conversation, workflow selection, the proposal queue and
    checks, which of the loop's events a host panel shows, so that the account can state what a
    panel needs of the loop.
  gating: false
- from: DEL-01-05
  condition: The capability handoff identifies the interface the App's Codex requires of a local server,
    with its qualification limits, apart from a host's model interface.
  gating: true
- from: external:DEP-001
  condition: SWBPIPE supplies an identified host candidate with its native layer's routing and destination
    enforcement, its destination record, its custody of keys and sign-in credentials, its handling
    of invalid and truncated tool calls and the model interface its loop speaks.
  when: Before a case is run on that host; the local contract, fixtures and checker do not wait for
    it.
- from: external:DEP-001
  condition: The observations made on that host candidate, its responsiveness among them, are available
    with the candidate, configuration and environment they were made on.
  when: Before conformance is stated for that host.
- from: external:OI-013
  condition: The shared contract owner and the SWBPIPE implementation owner agree the host-specific
    construction and choose where the loop runs, how it parses and streams, how the conversation
    persists and how the panel is assembled.
  when: Before a shared or host implementation boundary is fixed.
- from: external:OI-014
  condition: The App/shared contract owners, with the affected consumers, decide whether any part of
    the loop is implemented once for several consumers and where shared contracts are placed.
  when: Before structural or production allocation.
code_paths:
# receiving.rs is shared with DEL-05-02. Here: receiving a host's assembled tool calls, the
# model choice and destination requests. Panel return inputs and the panel-to-host-table
# comparison are DEL-05-02's. The schema registry in catalog.rs is DEL-03-01's.
- app/src-tauri/src/receiving.rs
# The schemas of a received tool call and of a destination request.
- app/src-tauri/resources/catalog_adapter/LOOP_TOOL_CALL.*
- app/src-tauri/resources/catalog_adapter/LOOP_DESTINATION_REQUEST.*
checks:
# Here: the loop's closure of a destination request when its turn fails, which this deliverable
# defines.
- app/src-tauri/tests/failed_turn_closure.rs
# catalog_adapter.rs is one check file shared with DEL-03-01, DEL-03-02, DEL-03-03, DEL-05-02.
# Here: the cases on loop receiving of truncated, duplicate and sibling tool calls and of a
# destination request closed by its turn's failure.
- app/src-tauri/tests/catalog_adapter.rs

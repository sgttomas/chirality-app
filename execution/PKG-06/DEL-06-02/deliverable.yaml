id: DEL-06-02
name: Return, waiting and human-decision workspace
needs:
- from: DEL-06-01
  condition: The selected project's fleet records are read as one consistent snapshot giving every brief,
    graph revision and log entry with its source and recorder, which graph is current or why none is,
    which entries are App observations, and every part that could not be read as a limit; return, review
    and integration are separate records; and each kind of need has a stated rule for what satisfies
    it.
  gating: true
- from: DEL-04-01
  condition: Each act kind has one name and a stated performer; a decision on a proposal is labelled
    accept and never approve; and marking checked, accepting, approving, relying and deciding are separate
    acts of the person, evidence of one establishing no other.
  gating: true
- from: DEL-04-03
  condition: A decision record binds the act to its decision actor, its recorder, the package's content
    identity and the alternative chosen, and cites the request it answers; a correction is a new entry
    naming the one it corrects; lapse is reported by comparing the bound and the current content identity,
    with unknown where they are not comparable or not available; and an entry that cannot be read
    is reported as such and never used.
  gating: true
- from: DEL-04-03
  condition: A decision package file in the project is recorded as an act request that cites the file
    by path and content identity and carries its act kind, subject, purpose, alternatives and consequences.
  gating: true
- from: DEL-07-02
  condition: For each response, and for no response, a connector's receiving record carries the response's
    standing, a standing for each claim it carries and whether the source-file route is needed; each standing
    names its connector, conforms to the published form and says whether reliance is supported; and a standing
    that does not conform is treated as unknown.
  gating: true
  when: A declared connector need is evaluated and shown (AC-006)
- from: DEL-01-04
  condition: The App act control is offered on a decision package for the decide act, on the alternatives
    the package names and whether or not an arrival was recorded; only the person's confirmation captures;
    and each capture yields capture evidence and a direct-capture record with the person's observed
    identity marked not verified.
  gating: true
  when: The positive case of AC-004
- from: external:person deciding the matter
  condition: A person performs a decision on a pending package at the App act control, so that the positive
    case of AC-004 has a performed act and its record to present.
code_paths:
# fleet_views.rs is shared with DEL-06-01. Here: the queue, waiting and decision rows; current-graph
# selection and need-state rules are DEL-06-01's.
- app/src-tauri/src/fleet_views.rs
- app/src-tauri/src/decision_view.rs
# app/src-tauri/resources/connector_route/connector.standing.schema.json is DEL-07-02's published standing form.
# fleet_views.rs reads it to judge a connector need and this deliverable does not list it.
# app/src-tauri/schemas/checkpoint-record-entries.schema.json is DEL-02-03's. Its decisionPackageFile
# definition enforces the decision package this scope defines; the rest of the file is DEL-02-03's.
- app/src/FleetRecordsPanel.tsx
# runtime_session.rs, lib.rs and App.tsx are shared. Here: the read of the decision packages, the
# decision view command, the decision packages panel and the mounting of both panels.
- app/src-tauri/src/runtime_session.rs
- app/src-tauri/src/lib.rs
- app/src/App.tsx
checks:
# History notices on the person-facing RS readings, including empty results.
- app/tests/workflow-action-result.test.mjs
# fleet_views_tests.rs is shared with DEL-06-01. Here: the queue, waiting and decision-wait cases.
- app/src-tauri/src/fleet_views_tests.rs
- app/tests/fleet-records.test.mjs
- app/src-tauri/tests/decision_reader.rs
- app/src-tauri/tests/decision_standing.rs
- app/src-tauri/tests/reader_integration.rs
- app/src-tauri/src/records_portable_reconstruction_tests.rs

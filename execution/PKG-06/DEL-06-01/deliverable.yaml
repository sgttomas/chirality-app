id: DEL-06-01
name: Bounded delegation and current work-graph records
needs:
- from: DEL-01-03
  condition: Each sub-agent thread Codex starts from a conversation is offered with the identity, parent,
    role and nickname Codex reports and the source of each, in a form that can be used without reading
    the views' own state and checked against the Codex identities it was derived from.
  gating: true
- from: DEL-01-01
  condition: Each App-owned Codex home has a stable identity that is not a path, every request and response
    carries its generation, and a request whose response was never observed is reported with an unknown
    outcome.
  gating: true
- from: DEL-01-04
  condition: Continuing a conversation under another role opens a new conversation, forking one opens
    a copy, and each operation's request and Codex's result, with the source conversation and the new
    one, are available when it completes.
  gating: true
- from: DEL-04-03
  condition: A human-act record names its kind, its decision actor and its recorder, the content, scope
    and purpose it is bound to and the request it answers, and for a decision the package decided and
    the alternative chosen; a correction is a new entry naming the one it corrects; and an entry that
    cannot be read is reported as such and never used.
  gating: true
- from: DEL-04-03
  condition: The records store keeps one subtree for each project, outside every project working tree,
    and holds the App's coordination observations there; a project is attached by its stable identity
    and never on its path alone; an export package carries the store's files byte for byte; and records
    that entered by import are identified as quoted evidence of their source.
  gating: true
- from: DEL-02-04
  condition: A thread given TASK guidance is identified as such, with whether its no-delegation limit
    is enforced by the supplier, stated and not enforced, or not known.
  gating: false
code_paths:
- app/src-tauri/src/fleet_records.rs
- app/src-tauri/src/native_conversation_links.rs
- app/src-tauri/schemas/fleet.record.schema.json
- app/src-tauri/schemas/fleet.native-links.schema.json
# fleet_views.rs is shared with DEL-06-02. Here: current-graph selection and need-state rules;
# queue, waiting and decision rows are DEL-06-02's, as is FleetRecordsPanel.tsx.
- app/src-tauri/src/fleet_views.rs
# lib.rs is shared. Here: the command that reads the selected project's fleet records, and the
# calls that hand a fork or a continued conversation to the recorder.
- app/src-tauri/src/lib.rs
checks:
- app/src-tauri/src/fleet_records_tests.rs
# fleet_views_tests.rs is shared with DEL-06-02. Here: the cases on which graph is current and
# on the state of each need.
- app/src-tauri/src/fleet_views_tests.rs
- app/src-tauri/src/native_conversation_links_tests.rs
# conversation_roles_tests.rs is shared with DEL-01-04 and DEL-02-04. Here: the cases that record
# a fork and a continued conversation as related conversations.
- app/src-tauri/src/conversation_roles_tests.rs
# records_package_controls_tests.rs is DEL-04-03's. Here: the cases in which an imported fleet
# log stays quoted evidence.
- app/src-tauri/src/records_package_controls_tests.rs
- app/src-tauri/schemas/sync.py

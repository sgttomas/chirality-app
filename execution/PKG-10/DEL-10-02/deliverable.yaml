id: DEL-10-02
name: Proportionate undertaking controls and practice feedback
needs:
- from: DEL-10-01
  condition: The execution basis names the selected edition of the manual and of the shared roles and methods
    by release and recoverable identity, so that a brief can state its basis and a practice note can cite the
    section and edition it concerns.
  gating: true
- from: DEL-10-04
  condition: An accepted current version of the project dependency graph exists with its handoff and currency
    evidence, so that work is selected within its scope and currency. Where no accepted graph covers the work,
    authorized definition proceeds on the declared conditions.
  gating: false
- from: DEL-09-12
  condition: Each method observation from the owner's validating use arrives citing the section of the selected
    manual, its observed conditions and the existing work record that carries the work, with this deliverable
    named as its recipient.
  gating: false
- from: external:owner
  condition: The owner gives each practice note brought to a stage or selected-method discussion its disposition,
    which is a proposed manual revision, a departure scoped to this project, or no change.
  when: At the stage or selected-method discussion.
  gating: false
code_paths: []
checks: []

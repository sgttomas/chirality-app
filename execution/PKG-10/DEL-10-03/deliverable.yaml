id: DEL-10-03
name: Shared commitments and consumer responsibility account
needs:
- from: DEL-02-01
  condition: The shared allocation names, for every shared contract part, its semantic owner, its consumers,
    the responsibility they repeat, the maintenance consequence, each consumer's confirmation or its absence,
    and its placement or the statement that placement is undecided.
  gating: true
- from: DEL-02-03
  condition: A workflow carried between the App and a host keeps its identity, revision and bytes, with a trace
    that tells apart what was selected, resolved, supplied, adopted and observed, and a host that cannot receive
    a declared element produces an explicit unsupported result.
  gating: true
- from: DEL-02-04
  condition: The App's additive role-supply obligations are stated with the maintained source the packaged
    guidance is generated from, and each conversation start records the source and content identity of the
    guidance supplied, with adoption recorded as unknown.
  gating: true
- from: DEL-03-01
  condition: The generated-surface and adapter-responsibility map states, for the human interface, the embedded
    tools and the external interface, what is generated from the catalog, checked against it or hand-built,
    what each adapter implements and who receives each part.
  gating: true
- from: DEL-03-02
  condition: The lifecycle and route definition leaves domain truth and validation with the host, names the
    host as the producer of its proposal view and receipts, and leaves operation-specific policy additions
    open with their owner.
  gating: true
- from: DEL-04-01
  condition: Each value in the policy-class records has its decision basis and its consumers, and each undecided
    value is marked with its owner and the decision it awaits.
  gating: true
- from: DEL-04-03
  condition: The shared record meaning accounts for what each consumer reads from a record and what a host-agent
    run's record carries, and states no host contribution, adoption or policy decision that its owner has not
    evidenced.
  gating: true
- from: DEL-05-01
  condition: The allocation and open-choice account names each input the host loop needs with its owner and
    whether it is supplied, and each open choice with the owner who makes it and when it is needed, and allocates
    no common construction without a named, agreed repeated responsibility.
  gating: true
- from: DEL-05-02
  condition: The reusable-component allocation account states, for each candidate panel part, its actual consumers
    and whether a common component is agreed or still open.
  gating: true
- from: DEL-10-01
  condition: The selection in `AGENTS.md`, with the reference folder for the selected edition, names the selected
    edition of the manual and of the shared roles and methods by release and recoverable identity, so that
    the working-guidance entries of the responsibility map point at an identified edition.
  gating: true
- from: external:owners of the affected Root, Runtime, App and Piping consumers
  condition: The current source of each consumer that a proposed change of placement or supply affects is
    identified and readable at a named revision.
  when: Before the account's check of that change is relied on.
code_paths: []
checks: []

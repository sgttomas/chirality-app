id: DEL-10-01
name: Project execution basis and manual application
needs:
- from: doc:docs/PRD.md
  condition: PRD §0 identifies the accepted basis, the later directions that qualify it and where its acceptance
    records are archived.
- from: doc:execution/_Decomposition/checkpoint_snapshots/_LATEST_ACCEPTED.md
  condition: The pointer names the accepted final decomposition and gives the rule for reading it as amended
    by the accepted scope-change amendments.
- from: external:sgttomas/chirality-library Project Management manual
  condition: The selected Library release contains the Project Management manual in its Consolidated
    edition, including its chapter on development positions, so that the selected text is recovered
    from that release.
- from: external:sgttomas/chirality-library release
  condition: The selected Library release publishes its tag, commit and source archive digest, and contains
    the role files, the workflow index, the project-entry template and the document metadata schema.
- from: external:owner
  condition: The owner decides each consequential adoption or departure that the application account identifies.
  when: Before work relies on that adoption or departure.
- from: DEL-10-04
  condition: The project dependency graph names a node for every accepted deliverable and states each relationship
    with its condition and standing, so that the handoff can refer dependency questions to it.
  when: When the handoff refers a reader's dependency question to the graph.
  gating: false
code_paths:
- AGENTS.md
- CLAUDE.md
- init-prompt.md
- reference/library-v2.1.0/**
- reference/library-v3.0.0/**
- reference/library-v3.1.0/**
- reference/library-v3.3.0/**
- reference/library-v3.4.0/**
checks:
# test_library_v2_1_operational_adoption.py is shared with DEL-02-04. Here: the edition-selection
# assertions; the assertions on the packaged role set are DEL-02-04's.
- tools/validation/test_library_v2_1_operational_adoption.py
- tools/validation/test_library_v3_operational_adoption.py
- tools/validation/test_document_metadata.py

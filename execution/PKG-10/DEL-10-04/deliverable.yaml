id: DEL-10-04
name: Project production dependency DAG
needs:
- from: DEL-10-01
  condition: The execution basis identifies the accepted decomposition and the amendments it is read with,
    so that the node inventory is taken from the accepted allocation.
  gating: true
- from: doc:execution/_Decomposition/Deliverables.csv
  condition: The accepted decomposition lists the project's deliverables with their packages and interfaces;
    that list is the node inventory.
- from: doc:execution
  condition: Every deliverable locality holds a ScopeOfWork.md and a deliverable.yaml whose needs state that
    deliverable's upstream conditions.
- from: doc:execution/_Decomposition/External_Dependencies.csv
  condition: Each contribution awaited from outside the project is listed with its supplier, the contribution
    required, its point of need and its present satisfaction.
- from: doc:execution/_Decomposition/Open_Issues.csv
  condition: Each open matter bearing on an outside contribution is listed with its owner, its point of need
    and the resolution required.
- from: external:owner
  condition: The owner decides the graph's basis and accepts a version, each decision naming the exact content
    it covers, and decides any cut or merge of a cycle and the acceptance or rejection of a departure.
code_paths:
- tools/deliverables/**
checks:
- tools/deliverables/test_cli.py

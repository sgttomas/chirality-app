id: DEL-04-01
name: Operation-policy and human-act distinctions
needs:
- from: external:DEP-001
  condition: SWBPIPE names its human-act and operation classes, refuses an embedded or external agent's
    attempt at an act its policy reserves to the person, and returns its own evidence of each refusal
    and of how it treats a model change with and without a widened grant.
- from: external:OI-021
  condition: The owner, through the SWBPIPE session and with the App owner, decides any operation-specific
    addition to the reserved acts and the class of the first connected operation.
- from: external:owner with the host policy owner
  condition: The owner, with the host policy owner, adopts a consequence vocabulary for operation classes.

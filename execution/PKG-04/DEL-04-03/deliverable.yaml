id: DEL-04-03
name: Content-bound decisions and compact run records
needs:
- from: DEL-04-01
  condition: Each act kind has one name and a stated performer, the acts reserved to the person are named,
    and each operation class has one of five values, with "no policy basis" carrying its reason.
  gating: true
- from: DEL-04-02
  condition: Each settings version in force, requested or refused for a run is handed over when the run
    starts and at each change, with its identity, scope, grant values, display states, requester, setting
    actor and the control's confirmation or refusal.
  gating: false
- from: DEL-01-04
  condition: A person's act on App content is captured only by the App act control, which produces sealed
    capture evidence with its own identity and the person's identity as the App observes it, for the
    record to cite.
  gating: false
- from: DEL-01-01
  condition: For each thread and turn the supplier boundary hands over the identity of the guidance it
    carried, the model and destination the supplier reported, and each tool-permission settlement with
    the origin of its answer.
  gating: true
- from: DEL-01-02
  condition: Custody facts are handed over as observed events and stated unknowns, including a request
    that ended unanswered and an acknowledgement that was not observed.
  gating: false
- from: DEL-02-01
  condition: A workflow has a source-qualified identity whose revision changes with any byte, path or
    file of its package, and a declared checkpoint names the one act it requires.
  gating: false
- from: DEL-02-02
  condition: Each run's text is identified by its content identity with the state of its supply check,
    each selection is recorded with the approval policy requested and the evidence applied, and a registration
    names the reviewed draft and the prior revision.
  gating: false
- from: DEL-02-03
  condition: Checkpoint arrivals, act requests where one can be identified, counted acts, lapses and run
    ends are produced as entries the run log carries, and each compatibility report evaluated for a run
    is identified.
  gating: false
- from: DEL-02-04
  condition: The role guidance supplied at a conversation's start or a fork is identified by its source
    and content identity, with the limits it states and each observation that a stated limit was not
    kept.
  gating: false
- from: DEL-03-01
  condition: Each object or row of a read result carries a host-supplied content identity with the method
    that produced it, and the App computes no host identity.
  gating: false
- from: DEL-03-02
  condition: Each change item has a content identity and its own disposition, an outcome that was not
    observed is reported as unknown, and an applied change refers to the host's receipt.
  gating: false
- from: DEL-03-03
  condition: Each external dispatch the App observes is produced as a dispatch record naming the operation,
    the kind of request, the native status and the outcome with who reported it.
  gating: false
- from: DEL-05-01
  condition: A host agent's network-destination events (destination contacted, destination grant, destination
    declined) are reported with the grant or list entry that allowed each contact, and a destination
    request left unanswered when its turn fails is closed with that cause and no grant.
  gating: false
- from: external:DEP-001
  condition: SWBPIPE writes, for each host-agent run, a run record with the host project in the shared
    meaning, names the actor of each human act it records, and keeps its receipts, hashes and origin
    marks resolvable by reference.
- from: external:OI-011
  condition: The App is signed and a signing key for log checkpoints and export manifests is held in the
    operating system's keychain.

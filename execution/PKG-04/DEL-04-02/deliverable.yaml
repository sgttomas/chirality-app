id: DEL-04-02
name: Visible autonomy and result standing
needs:
- from: DEL-04-01
  condition: Every operation class has one of the five class values; a grant has a value of direct or
    propose with a scope and is effective only when the person set it and the control confirmed it,
    or under an adopted policy default; the acts reserved to the person are named; and each act kind
    has one name.
  gating: true
- from: DEL-04-03
  condition: The run record holds each settings version handed to it and returns it with its read state,
    and returns each human act with its kind, decision actor, recorder, bound content and lapse state.
  gating: false
- from: DEL-03-02
  condition: An agent's change carries its origin and the basis it relied on, a proposal reports queued
    until the host records acceptance and application, each change item has its own disposition, and
    an outcome that was not observed is reported as unknown.
  gating: false
- from: DEL-03-01
  condition: A read result carries whether it is current or historical, the checks it passed and its
    known limitations, with the basis it describes.
  gating: false
- from: DEL-02-03
  condition: Each arrival at a declared checkpoint, the request for its act where one can be identified,
    and the person's act are recorded, and the act is recorded as done only when the person performs
    it.
  gating: false
- from: DEL-05-01
  condition: A host agent's allowed destinations, the grants made during work and every destination
    contacted are reported as events, and a destination request left unanswered when its turn fails
    is closed with that cause and no grant.
  gating: false
- from: external:DEP-001
  condition: SWBPIPE supplies a control by which the person sets and changes the grant for an operation
    class, and for each directly applied change its origin mark, a route to undo it, a route to check
    it later and a receipt, with the standing of each result.
- from: external:OI-021
  condition: The owner, through the SWBPIPE session and with the App owner, decides any operation-specific
    addition to the reserved acts and the class of the first connected operation.
code_paths:
# standing.rs is shared with DEL-04-03. Here: item and joint standing, the checkpoint overlay, the
# standing facets and the comparison of settings versions. The lapse states and the comparison
# of content identities are DEL-04-03's.
- app/src-tauri/src/standing.rs
# act_policy.rs is shared with DEL-04-01. Here: the settings-in claim and the grant display
# states with their overlay. The act kinds, classes, grants, treatments, the resolver and the
# policy-class record claim are DEL-04-01's.
- app/src-tauri/src/act_policy.rs
- app/src-tauri/schemas/AS_SETTINGS_IN.schema.json
- app/src-tauri/resources/policy_standing/AS_SETTINGS_IN.valid.examples.json
- app/src-tauri/resources/policy_standing/AS_SETTINGS_IN.invalid.examples.json
# RunPanel.tsx is shared with DEL-01-04, DEL-02-02 and DEL-02-03. Here: the checkpoint overlay,
# the standing facets and the act labels. DEL-01-04 places them in the App's interface.
- app/src/RunPanel.tsx
checks:
# policy_standing.rs is one check file shared with DEL-04-01 and DEL-04-03. Here: the cases on
# grant display states, labels, the checkpoint overlay and the comparison of settings versions.
- app/src-tauri/tests/policy_standing.rs
- app/tests/run-panel.test.mjs
# Here: how a destination request closed by its turn's failure is shown in the settings.
- app/src-tauri/tests/failed_turn_closure.rs

id: DEL-07-02
name: Connector limitation and source-file recovery paths
needs:
- from: DEL-07-01
  condition: A PEC item is of one of two tiers, a record-tier claim derived from project files or a presence-tier
    statement that is advisory and never supports reliance; and retained PEC material is constructed
    compatibility material with no adoption behind it.
  gating: false
  when: Retained PEC material is shown or read
- from: DEL-08-01
  condition: A Domains result is admitted, located and not admitted, or unknown, and its freshness is
    current, stale or unknown against the source as it stands; only an admitted, current result supports
    reliance; and the fixtures are valid receiving records that cover an admitted current result, a located
    result that is not admitted, a stale result and no response, a fixture on an invented query contract
    or admission basis being marked simulated and counting toward none of the four.
  gating: false
  when: Domains material is assessed
- from: DEL-04-03
  condition: The records store keeps one subtree for each project, outside every project working tree
    and every Codex home; a project is attached by its stable identity and never on its path alone;
    and where the store cannot be written, recording is refused visibly and nothing is written elsewhere.
  gating: true
- from: doc:The project's source records for the affected question
  condition: The project's graphs, decisions, revisions and other records that bear on the affected question
    can be read as ordinary files or as Git objects at an identified revision.
  gating: false
  when: A question is taken along the source-file route
code_paths:
# connector_standing.rs and the standing form are shared with DEL-07-01. Here: everything but the
# PEC connector value and its record and presence tiers, which are DEL-07-01's.
- app/src-tauri/src/connector_standing.rs
- app/src-tauri/src/connector_route_store.rs
- app/src-tauri/src/connector_route_view.rs
- app/src-tauri/src/connector_source.rs
- app/src-tauri/src/connector_source_fs.rs
- app/src-tauri/src/connector_git.rs
- app/src-tauri/src/connector_git_process.rs
- app/src-tauri/src/connector_materialization.rs
- app/src-tauri/src/connector_reconstruction.rs
- app/src-tauri/src/connector_answer_only.rs
- app/src-tauri/resources/connector_route/*
# DEL-06-02's fleet_views.rs reads this standing form.
- app/src-tauri/resources/connector_route/connector.standing.schema.json
- app/src/ConnectorRoutePanel.tsx
- app/src/ConnectorSourcePanel.tsx
- app/src/ConnectorReconstruction.tsx
# records_store.rs is DEL-04-03's. Here: where a project's route accounts are placed and read,
# and the listing of accounts found in the project folder.
- app/src-tauri/src/records_store.rs
# lib.rs and App.tsx are shared. Here: the connector commands, the source and draft state they
# hold, and the mounting of the connector panels.
- app/src-tauri/src/lib.rs
- app/src/App.tsx
# r2_snapshot_proof.rs and its test serve no commitment of this scope (TBD-003) and are not listed.
checks:
- app/src-tauri/src/connector_route_store_tests.rs
- app/src-tauri/src/connector_source_tests.rs
- app/src-tauri/src/connector_git_tests.rs
- app/src-tauri/src/connector_materialization_tests.rs

id: DEL-02-03
name: Workflow execution compatibility and round-trip support
needs:
- from: DEL-02-01
  condition: A package's declared part is read with a reading for each category and element; the
    requirement outcome names, the pass rule and the checkpoint disposition names are each stated
    once; and a workflow has a source-qualified identity, with derived-from naming the original
    of an adaptation.
  gating: false
- from: DEL-02-02
  condition: A selected revision is resolved from the stored revision and verified against it at
    selection, at run preparation and at sending; a run text is composed for each run opened,
    with its content identity and the state of its supply check; and a refinement of an opened
    workflow is a draft that goes through review and registration.
  gating: false
- from: DEL-02-04
  condition: The role chosen for a conversation, or no role, is recorded at its start and stays
    fixed for the conversation's life.
  gating: false
- from: DEL-03-01
  condition: Each entry of a host's catalog edition declares a stable identity and a version and
    its exposure on each surface, and the host reports a new edition as an edition-change event.
  gating: false
- from: DEL-01-01
  condition: The supplier's native items reach receivers unchanged with their thread, turn and
    item identities, and the harness-capability account states what the selected supplier version
    supports.
  gating: true
- from: DEL-01-03
  condition: For a conversation, the delegation availability reading at the pin (present, missing,
    or not established with its reason) is offered with the model, provider and folder it answers
    for, without reading the delegation view's state.
  when: Before a declared agent-delegation requirement is checked.
  gating: false
- from: DEL-01-02
  condition: Custody facts (an observation lost and recovered, a Codex stop, a relaunch) are handed
    over as observed events with stated unknowns, and an opaque tag attached to a conversation
    is kept across a relaunch and can be looked up.
  gating: true
- from: DEL-01-04
  condition: The act control captures an act the person performs with its capture evidence and
    shows an unperformed act as not performed, and the run's state, its checkpoints and the
    control that ends a run are placed in the interface.
  gating: false
- from: DEL-04-01
  condition: Each act kind has one name and a stated performer, the acts reserved to a person are
    named, and routine tool permission never stands for a reserved act.
  gating: true
- from: DEL-04-03
  condition: Entries are written to a run's log through one writer and can be validated; a human
    act binds actor, recorder, content identity, scope and purpose; and an act whose bound content
    changed is reported as lapsed.
    Where a project's records are read from is decided by the records store, which gives no
    location, in the store or in the project folder, while the project's link to the store is
    unresolved.
  gating: false
- from: DEL-03-02
  condition: Each change item has a content identity and its own disposition, an item leaving
    a proposal and all items being decided are reported, and an outcome nobody observed is reported
    as unknown.
  gating: false
- from: DEL-03-03
  condition: What the adapter observes on the external channel about a declared checkpoint (a proposal
    queued, an act observed, an item leaving, an observation lost or recovered) is reported.
  gating: false
- from: DEL-04-02
  condition: Each grant has one display state, including set by the person and not yet confirmed,
    unconfirmed and refused.
  gating: false
- from: DEL-05-01
  condition: A host loop evaluates a declared checkpoint only against events it observed and
    records each arrival with its bound subject, purpose and scope, and the request for the act
    where one can be identified.
  gating: false
- from: external:person using the App
  condition: A person starts and ends runs and performs the acts that declared checkpoints require.
    In an agent-operated journey examination as the release target defines it, the examining agent
    performs these steps on examination material for control-and-record evidence only; the positive
    case with the person as actor (AC-003) needs the person.
- from: external:SWBPIPE implementation owner
  condition: The host publishes its catalog, runs its loop, receives a carried workflow package,
    delivers a host workflow's package with its origin, revision and act history, and offers
    the means for a person's act.
  when: Before a host case of the requirement check, checkpoint recording or transfer is run.
- from: external:App and shared contract owners
  condition: The owners of the shared contract parts decide where each part is placed.
  when: Before the check or the recording is implemented once for both the App and a host.
- from: external:owner
  condition: The owner decides when a workflow needs enforced checkpoints, and which connected
    operation comes first with the autonomy permitted for it.
  when: Before a hold is assigned to any checkpoint or claimed.
code_paths:
- app/src-tauri/src/execution_compatibility.rs
- app/src-tauri/src/compatibility_report.rs
- app/src-tauri/src/workflow_proposal_advisory.rs
- app/src-tauri/src/checkpoint_recorder.rs
- app/src-tauri/src/after_run_end.rs
- app/src-tauri/src/run_restart.rs
- app/src-tauri/src/record_supply.rs
- app/src-tauri/resources/workflow_role/compatibility-report.schema.json
- app/src-tauri/schemas/checkpoint-record-entries.schema.json
# The requirement check as the person's guide shows it; RunJourney.tsx (DEL-02-02's) mounts it.
- app/src/RequirementCheck.tsx
# runtime_session.rs, lib.rs and host_tick.rs are shared. Here: opening and ending a run, its
# run reference and tag, the occasions of the requirement check, and feeding observed items
# to the checkpoint recorder. Run preparation, run text and the supply check are DEL-02-02's;
# custody is DEL-01-02's; the record writer is DEL-04-03's.
- app/src-tauri/src/runtime_session.rs
- app/src-tauri/src/lib.rs
- app/src-tauri/src/host_tick.rs
# RunPanel.tsx is shared with DEL-01-04, DEL-02-02 and DEL-04-02. Here: what is shown of a
# run's state, its requirement report and its checkpoints.
- app/src/RunPanel.tsx

id: DEL-02-02
name: Workflow-making workspace and registration
needs:
- from: DEL-01-03
  condition: Receive DEL-01-03's native plans, revisions, tool and delegation presentation for the standalone
    workflow-making join, including delegation availability, descendant identities and on-demand child-thread
    reads that a delegated trial uses to link its sub-agent and show whether the workflow was given verbatim
    (WR TT-9).
  gating: true
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-01-04
  condition: Receive from DEL-01-04 native requests, outcomes, attachments, the draft-UI receiving interface
    and the App act control that captures registration with its evidence, plus placement of trial texts
    and bring-back transcripts in pre-filled person-sent messages and clean-trial conversations (NIR AT-8;
    WR TT-3, TT-10). The person performs the registration act.
  gating: false
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-02-01
  condition: Receive the portable declaration and shared-allocation contract from DEL-02-01 to define receiving
    joins before dependent behavior; preserve unresolved placement rather than presume common construction.
  gating: false
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-02-03
  condition: Receive DEL-02-03's capability/checkpoint execution and round-trip support for the standalone
    workspace join, preserving missing-capability, required-checkpoint and unknown-outcome conditions; for
    each run DEL-02-03 starts, this workspace composes the run-start text and App-written run-end line,
    records its content identity and checks it against Codex's history. Readable records alone do not resume
    a run or establish its current native source.
  gating: false
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-04-01
  condition: Consume the adopted operation-policy and human-act distinctions carried by DEL-04-01, including
    the wording and kind of the registration act (A15) the person performs through DEL-01-04's App act control;
    unresolved classes remain with the owner and host policy owner at their stated points of need.
  gating: true
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-04-03
  condition: Receive DEL-04-03's content-bound decision and compact run-record behavior, including the A15
    record kind bound to the exact reviewed content, for truthful review/registration presentation. Historical
    Bring back and Compare require same-project original WR/RS correspondence and unchanged source bytes;
    conflicts or missing boundaries remain read limits (Design §17).
  gating: false
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-01-02
  condition: Consume DEL-01-02's definitions of ending a run (distinct from interrupting a turn or stopping
    Codex) and its App-start reconciliation event for chained runs and interrupted registration attempts.
    Historical learning also requires REC source-home correspondence, original generation provenance and
    current native history from that source; missing or ambiguous source identity is unavailable (Design
    §17).
  gating: true
  evidence: execution/PKG-02/DEL-02-02/ScopeOfWork.md
- from: DEL-01-02
  condition: Serve App v4 DEL-02-02 with the definitions of a turn interrupt, a run end and a Codex stop,
    and App-start reconciliation; DEL-02-02 declares the consumption upstream.
  gating: true
  evidence: execution/PKG-01/DEL-01-02/ScopeOfWork.md
- from: DEL-01-03
  condition: Supply local native plan/tool interaction to App DEL-02-02 for its complete workflow-making
    journey; joined integration remains with the workflow-experience integration owner.
  gating: true
  evidence: execution/PKG-01/DEL-01-03/ScopeOfWork.md
- from: DEL-01-04
  condition: Supply native attachment and draft-transition receiving interactions, together with the receiving
    contract, and the App act control that captures workflow registration (A15), to App DEL-02-02 for its
    complete workflow-making workspace; the registration that follows is DEL-02-02's operation. Receive the opaque native act for lowering the process-local App assurance level; opportunistic A15 keychain sealing retains SEAL-C enrollment conditions.
  gating: false
  evidence: execution/PKG-01/DEL-01-04/ScopeOfWork.md
- from: DEL-02-01
  condition: App v4 DEL-02-02 receives this portable workflow/role/checkpoint contract and shared allocation
    and declares it upstream in its own register; its acts are not transferred here.
  gating: false
  evidence: execution/PKG-02/DEL-02-01/ScopeOfWork.md
- from: DEL-02-03
  condition: App v4 DEL-02-02 receives this slice's report, recording meanings and transfer contract and
    declares it upstream in its own register; its acts are not transferred here.
  gating: false
  evidence: execution/PKG-02/DEL-02-03/ScopeOfWork.md
- from: DEL-04-01
  condition: 'DEL-04-01 supplies the distinction of the registration act (A15: a person''s act with its
    own actor, subject and evidence) to DEL-02-02, whose registration it governs; it consumes nothing from
    DEL-02-02.'
  gating: true
  evidence: execution/PKG-04/DEL-04-01/ScopeOfWork.md
- from: DEL-04-03
  condition: DEL-04-03 supplies the shared human-act/run-record format and meaning consumed by App DEL-02-02,
    which the source states declares it upstream in its own register.
  gating: false
  evidence: execution/PKG-04/DEL-04-03/ScopeOfWork.md

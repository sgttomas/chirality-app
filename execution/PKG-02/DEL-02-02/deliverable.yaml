id: DEL-02-02
name: Workflow-making workspace and registration
needs:
- from: DEL-01-01
  condition: The run-start text and a trial text are carried to the supplier unchanged, and every
    well-formed frame from the supplier is delivered natively, the reply to a read of a
    conversation's or a descendant's thread history among them.
  gating: false
- from: DEL-01-02
  condition: The state of each conversation and its turns is reported after a window is lost,
    a Codex restart and a relaunch, with unknown outcomes stated; a turn interrupt, a Codex stop
    and a quit are reported as distinct events, none of which ends a run; and an opaque tag can
    be attached to a conversation and looked up.
  gating: true
- from: DEL-01-03
  condition: Delegation availability is read for a conversation at run time, and each descendant
    thread is shown with the identity, parent and role Codex reports. Of the error notices Codex
    sends for a conversation's turns, those the host has kept (the latest for each turn, up to
    its limit) are reported with the conversation, turn and Codex session each belongs to, the
    order in which they were received, how many were accepted for the turn, what Codex said of
    retrying, whether a later frame naming the turn was received and whether the App's receiving
    ended; and each turn the host holds is reported with its conversation, and with the status
    the host holds for it from Codex's reports.
  gating: true
- from: DEL-01-04
  condition: The act control captures a registration the person performs, for one draft, one
    library entry or several entries, bound to the exact reviewed content of each, and shows an
    unperformed act as not performed; it offers the native act that lowers the workflow approval
    policy and the person's keychain protection act; and a turn the person sends carries the
    run-start text, the run-end line or a trial text as this workspace supplies it.
  gating: false
- from: DEL-01-05
  condition: For a conversation, whether a model is selected and which is reported, and a workflow
    run without one is refused with "run not started — no model selected".
  gating: false
- from: DEL-01-06
  condition: The installed App has the same publisher identity in every release, so that a keychain
    seal written by one release verifies in the next, and the bundled workflows are packaged as
    supplied.
  gating: false
  when: Keychain-verified approval and bundled workflows on an installed build
- from: DEL-02-01
  condition: A package's declared part is read with a reading for each category and element; a
    workflow has a source-qualified identity whose revision changes with any byte, path or file
    of its package; and same-named workflows in different origins are reported as a collision
    with their holding libraries.
  gating: false
- from: DEL-02-03
  condition: Each run is opened with a run reference and ends only by the person's explicit run
    end; the requirement check reports each declared requirement's outcome for the current host;
    and each checkpoint's arrival and disposition in a run is recorded.
  gating: false
- from: DEL-02-04
  condition: For the conversation chosen for a run, in its own home, the role the App supplied at
    its start is reported as App-observed, a start with no role is reported as that and not as
    unknown, and where this App process holds no record of the supply the role is reported as
    not established.
  gating: false
  when: Showing the conversation's role beside the roles the Library lists for a chosen workflow
- from: DEL-04-01
  condition: Registering a workflow revision is a distinct act kind reserved to the person, with
    its own name and wording, and it does not say that the revision was examined, checked or
    approved.
  gating: true
- from: DEL-04-03
  condition: A registration is written as a direct-capture record that binds actor, recorder,
    content identity, scope and purpose; a library's registration acts are kept with that library;
    a record can be validated; and entries for a run's text and its supply check are carried in
    the run's log.
    Where a project's records are read from is decided by the records store, which gives no
    location, in the store or in the project folder, while the project's link to the store is
    unresolved.
    Pending workflow records retain their admitted project identity and physical
    project and records folders, and prove that binding again inside write admission before publication.
  gating: false
- from: external:sgttomas/chirality-library release
  condition: The selected Library release publishes its source archive with a digest, and its
    method index names each workflow and the files of its package, so that the bundled workflows
    are generated from the archive and compared with it.
  when: When the bundled workflows are generated or compared with the release.
- from: external:person using the App
  condition: A person reviews and registers workflows, sends the messages the App prepares, and
    starts and ends runs. In an agent-operated journey examination as the release target defines
    it, the examining agent performs these steps on examination material for control-and-record
    evidence only; the positive case with the person as actor (AC-006) needs the person.
- from: external:SWBPIPE implementation owner
  condition: A host lists its workflow library to the App and delivers a host workflow's package
    with its origin and revision.
  when: Before a host-origin workflow is selected or opened in the App.

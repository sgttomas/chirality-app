id: DEL-02-01
name: Portable workflow contract and shared allocation
needs:
- from: DEL-03-01
  condition: Each operation of a host's catalog edition has an identity and a version as the catalog
    writes them, and the edition states on which surfaces the operation is exposed.
  gating: false
- from: DEL-04-01
  condition: Each act kind has one name and a stated performer, and the acts reserved to a person
    are named and kept apart from routine tool permission.
  gating: true
- from: DEL-01-01
  condition: For the selected supplier version, the harness-capability account lists the supplier's
    item kinds, server requests and client methods and states which are supported.
  gating: true
- from: DEL-03-02
  condition: Each state a change item can be in at the host (queued, accepted, rejected, withdrawn,
    applied, refused, application error) has one name, and an outcome nobody observed is reported
    as unknown.
  gating: false
- from: DEL-04-03
  condition: A record of a person's act binds the actor, kept apart from the recorder, to the subject
    content, scope and purpose with its supporting evidence, so that a checkpoint's declared actor,
    subject and expected evidence name what the record of the act will hold.
  gating: false
- from: DEL-05-01
  condition: The host-loop receiving contract states what a host's loop takes from the declared part,
    workflow identity and checkpoint declarations, and its owner confirms or withholds that receipt.
  gating: false
- from: DEL-05-02
  condition: The host-panel receiving contract states what a host's panel shows from workflow identity,
    checkpoint declarations and requirement outcomes, and its owner confirms or withholds that receipt.
  gating: false
- from: external:App and shared contract owners
  condition: The owners of the shared contract parts decide where each part is placed and who owns
    any common implementation.
  when: Before a shared part is implemented once for both the App and a host.
- from: external:SWBPIPE implementation owner
  condition: The host owner states where the host's loop is placed, how its single agent seat maps
    to the four role meanings, and confirms what the host's library, loop and panel receive from
    this contract.
  when: Before a host consumer is recorded as confirmed.
- from: external:owner
  condition: The owner decides when a workflow needs enforced checkpoints.
  when: Before any hold support is assigned to a checkpoint.
code_paths:
- app/src-tauri/src/workflow_declaration.rs
# workflow_workspace.rs is shared with DEL-02-02. Here: the identity type, the package snapshot
# with its revision method, and the collision report. Review, registration, selection and the
# run and trial texts are DEL-02-02's.
- app/src-tauri/src/workflow_workspace.rs
- app/src-tauri/resources/workflow_role/workflow-declaration.schema.json
- app/src-tauri/resources/workflow_role/workflow-declaration.valid.example.json
- app/src-tauri/resources/workflow_role/workflow-declaration.invalid.example.json
- app/src-tauri/resources/workflow_role/identity-vectors.json
- app/src-tauri/resources/workflow_role/tab-carriage-cases.json
checks:
# workflow_role_tests.rs is shared with DEL-02-02, DEL-02-03 and DEL-02-04. Here: the cases on
# reading the declared part, identity, snapshot and collisions.
- app/src-tauri/src/workflow_role_tests.rs

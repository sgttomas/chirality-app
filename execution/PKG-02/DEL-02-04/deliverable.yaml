  condition: Consume DEL-01-01's supported native supplier receiving contract to implement additive role
    supply at the actual supplier boundary, including the native agent-role configuration through which
    delegated children receive product guidance and role, and the surfaces that record and show a task agent's
    delegation. Current assessment/integration basis is owner-selected 0.167.0 (DEL-01-01 ScopeOfWork [U], CLM-003, REQ-006,
    TBD-002); qualification stays candidate-bound under R23-22.
  gating: true
  evidence: execution/PKG-02/DEL-02-04/ScopeOfWork.md
- from: DEL-02-01
  condition: Consume the portable four-role receiving contract and applicable shared allocation from DEL-02-01
    when developing local role supply.
  gating: false
  evidence: execution/PKG-02/DEL-02-04/ScopeOfWork.md
- from: external:DEP-006
  condition: For the VER-005 positive case, consume evidence of an actual consumer adoption with the proper
    actor and scope; a publication/supply-only case remains distinct and cannot substitute.
  evidence: execution/PKG-02/DEL-02-04/ScopeOfWork.md
- from: external:OI-008
  condition: 'Met 2026-10-10: the owner''s OI-008 ruling places file and record writes, Codex interaction
    and act capture in the Rust host, so guidance composition and supply-record writing are Rust-host responsibilities
    (Design ROLE_SUPPLY §8).'
  evidence: execution/PKG-02/DEL-02-04/ScopeOfWork.md
- from: external:OI-018
  condition: Obtain the instruction distribution/adoption mechanism choice before instruction changes or
    dependent supply, retaining source/supply evidence without inventing precedence; host distribution remains
    open with the same owners (OI-018). The owner's App-local Work authoring and deterministic
    resource-derivation selection is recorded in Work/INSTRUCTION_RESOURCE_AUTHORING.md;
    it does not resolve portable distribution, shared allocation or consumer adoption.
  evidence: execution/PKG-02/DEL-02-04/ScopeOfWork.md
- from: DEL-02-01
  condition: App v4 DEL-02-04 receives this portable workflow/role/checkpoint contract and shared allocation
    and declares it upstream in its own register; its acts are not transferred here.
  gating: false
  evidence: execution/PKG-02/DEL-02-01/ScopeOfWork.md

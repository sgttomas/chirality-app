id: DEL-02-04
name: Additive role selection and supply
needs:
- from: DEL-01-01
  condition: Each ready generation carries the verified version identity record. The guidance
    composed for a thread's start is carried to the supplier as composed, and the boundary
    reports the content identity of what it actually carried.
  gating: true
- from: DEL-02-01
  condition: The four role meanings, the roles a workflow declares compatible, and the form of
    a workflow's declared part are each stated once for App and host receiving.
  gating: false
- from: DEL-01-05
  condition: Every conversation belongs to exactly one App-owned Codex home, and in the account
    home the person's own Codex settings, providers and MCP servers apply.
  gating: false
- from: DEL-01-04
  condition: The conversation roles are offered at a conversation's start and in "Continue as",
    with the default preselected and clearable and no role allowed, and a fork is offered.
  gating: false
- from: DEL-01-03
  condition: Each descendant thread is shown with the identity, parent and role Codex reports,
    and a delegation made by a thread given TASK guidance is shown.
  gating: false
- from: DEL-04-03
  condition: The guidance supplied to a conversation and each observation that a stated limit
    was not kept are carried in the run record by reference and can be validated.
    Where a project's records are read from is decided by the records store, which gives no
    location, in the store or in the project folder, while the project's link to the store is
    unresolved.
    Pending role-supply observations retain their admitted project identity and physical
    project and records folders, and prove that binding again inside write admission before publication.
  gating: false
- from: DEL-01-06
  condition: The default guidance, the role documents and the role set are packaged as supplied.
  gating: false
  when: On an installed build
- from: external:owners of the consumers that adopt the guidance
  condition: A consumer's owner decides and performs its adoption of the App's guidance and gives
    evidence of the actor and scope.
  when: Before an adoption is shown as performed.
- from: external:owner
  condition: The owner, with the instruction owners, decides how role guidance is distributed
    to and adopted by hosts, and what an unmodified copy of the guidance does when a release
    ships a different default.
  when: Before guidance is supplied to a host, and before a second release changes a default.

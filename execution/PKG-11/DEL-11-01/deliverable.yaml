id: DEL-11-01
name: Preserved history and coexistence account
needs:
- from: DEL-10-03
  condition: The responsibility account names the affected consumers of shared material with their
    packaging and tool paths, and gives each included historical statement its present applicability
    and a preserved original reference.
  gating: true
- from: DEL-10-01
  condition: The execution basis names the selected edition of the manual and of the shared roles
    and methods by release and recoverable identity, and shows no edition that was only read, and
    no historical candidate, as selected.
  gating: true
  when: Before a selector cites a manual or method edition.
- from: DEL-11-02
  condition: The adoption account states for each affected consumer whether its adoption of the renewed
    basis is established, with its evidence, and shows an absent or uncertain adoption as not established.
  gating: true
- from: DEL-11-03
  condition: The disposition record gives the owner's actual response to the replacement package, with
    its subject, actor and recorder, or shows the decision as pending with v3.0.1 retained.
  gating: false
- from: doc:reference/REFERENCES.md
  condition: The v3.0.1 fallback release is identified by its published release, source revision and
    installer digest, and the investigation revision by its commit.
- from: doc:reference/archives/ARCHIVES.md
  condition: The Git-ignored archive locations are inventoried with a recorded digest for each and
    a rule of read-only access.
- from: external:sgttomas/chirality-library docs/thesis/ at the selected edition library-v3.3.0
  condition: The thesis is available there with its attribution.
- from: external:checkout holding the Git-ignored archives
  condition: The checkout that holds the inventoried archives is readable.
  when: Before the archive identity check.
- from: external:DEP-006
  condition: The owner of each affected consumer supplies that consumer's continuing obligations and
    their dispositions.
  when: Before that consumer's arrangement retires.
- from: external:OI-024
  condition: The owner with the affected consumers identifies first adopters, continuing obligations
    and the conditions for ending coexistence.
  when: Before each adoption or retirement decision.
code_paths:
- reference/archives/archive_digests.py
checks: []

id: DEL-11-03
name: Owner replacement evidence packet
needs:
- from: DEL-09-02
  condition: The standalone dossier identifies the candidate, gives each planned step's result with
    its evidence and limits, and maps each step to the core-loop elements (plan, execute, save a
    workflow, reuse it, approvals, interruption, restart).
  gating: true
- from: DEL-11-01
  condition: The continuity account gives each continuing obligation's disposition by its accountable
    owner or its open owner and point of need, the identity-check results for preserved material,
    and the replacement standing.
  gating: false
- from: DEL-11-02
  condition: The adoption account states for each affected consumer whether its adoption of the renewed
    basis is established, and shows an unestablished adoption as such.
  gating: true
- from: DEL-09-12
  condition: The validation arrangement shows whether the owner has agreed the period and the activities;
    the account of use holds what the owner observed on the identified candidate, with its limits
    and what was not observed; and each recorded observation carries its disposition, a proposal
    told apart from a decision.
  gating: true
- from: DEL-01-06
  condition: The package identity record identifies the final candidate, and the limitations stated
    with the release are listed. DEL-01-06's results on that candidate (the comparison with an independent
    reading of the package, the install-and-launch witness naming what was and was not observed, each
    shipped component's notice or its named gap, the terms position with the owner's applicability
    statement or as unresolved) are each recorded with their standing, an unrun one as not run.
  gating: true
  when: Before the packet is put to the owner for the publication decision.
- from: DEL-01-01
  condition: For the final candidate, the result of the supplier qualification at the candidate's
    pin (whether the embedding protocol behaves on the candidate as the supplier publishes it) is
    recorded with its outcome, evidence and limits, and the provider requirement account names each
    requirement as published, observed on a named server or not observed; a result not yet made
    reads as not run.
  gating: false
  when: Before the packet is put to the owner for the publication decision.
- from: DEL-01-04
  condition: For the final candidate, the result of the person's keychain protection act on the installed,
    signed build (enrolment of the key, the approval policy stored in the keychain, admission of
    a sealed registered workflow after a cold start) is recorded with its outcome, evidence and limits;
    a result not yet made reads as not run.
  gating: false
  when: Before the packet is put to the owner for the publication decision.
- from: doc:reference/REFERENCES.md
  condition: The v3.0.1 fallback release is identified by its published release, source revision and
    installer digest.
- from: doc:execution/_Decomposition/Open_Issues.csv
  condition: Each undecided matter the packet carries (OI-016, OI-024) names its owner and point
    of need.
- from: doc:execution/_Coordination/PUBLICATION_PUNCHLIST.md
  condition: The results the publication decision rests on are listed with the deliverables that own
    each.
  when: Before the packet is put to the owner for the publication decision.
- from: external:Owner
  condition: The owner responds to the package presented, choosing or leaving the decision open, in
    words that can be attributed and quoted.
  when: Before a disposition is recorded as decided.
- from: external:Owner
  condition: The owner receives the package with the replacement condition and its standing, the exact candidate
    and proposed scope, the evidence and the continuing obligations.
  direction: downstream
  gating: false
- from: external:Affected consumers
  condition: The affected consumers receive the owner's recorded disposition and the continuing obligations;
    each consumer's own adoption or retirement decision stays open.
  direction: downstream
  gating: false
code_paths: []
checks: []

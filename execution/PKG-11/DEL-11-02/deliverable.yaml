id: DEL-11-02
name: Consumer-specific renewed-basis adoption
needs:
- from: DEL-10-03
  condition: The responsibility account names each affected consumer of shared material with its accountable
    owner, packaging and tool paths, and traces each affected technical promise of the workflow, catalog,
    act-and-record and host-loop contracts to its accountable scope and evaluation path.
  gating: true
- from: DEL-10-01
  condition: The execution basis names the selected editions of the manual and of the shared roles
    and methods by release and recoverable identity, and hands over each consequence of an edition
    or practice change for another consumer with the consumer and the source identity.
  gating: true
- from: DEL-02-04
  condition: For each conversation the supply record shows the source and content identity of each
    guidance part and what was supplied, shows adoption as unknown unless a consumer's adoption is
    evidenced with its actor and scope, and can be read without this deliverable defining its format.
  gating: true
- from: external:DEP-006
  condition: The owner of each affected consumer supplies that consumer's adoption decision, its packaging
    and tool-path consequences and the dispositions of its continuing obligations.
  when: Before that consumer transitions or an old arrangement retires.
- from: external:sgttomas/chirality after revision e548d4cfada4d2105de6231516dc6e5fc4bd4689
  condition: The mainline and consumer source changes made since the pinned research are readable for
    comparison.
  when: Before a consumer relies on the pinned research as a current implementation map.
- from: external:OI-018
  condition: The owner with the shared and project instruction owners defines how changed shared instructions
    are distributed to and adopted by projects other than the App.
  when: Before instruction changes or dependent supply to those consumers.
- from: external:OI-024
  condition: The owner with the affected consumers identifies first adopters, continuing obligations
    and the conditions for ending coexistence.
  when: Before each adoption or retirement decision.
code_paths: []
checks: []

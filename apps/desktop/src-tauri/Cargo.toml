[package]
name = "chirality-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace, apart from App v4's.
[workspace]

[lib]
name = "chirality_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chirality-engine-tauri = { git = "ssh://git@github.com/sgttomas/chirality-engine.git", rev = "10d2a545d72155c7a51d3fe8473e21d2d727db9e" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
